<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->
<style>@view-transition { navigation: auto; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Sfondo scuro applicato SUBITO, prima che gli script auth-gate/supabase
     sotto finiscano di scaricare (bloccanti) — evita un flash bianco
     prima del nero dell'overlay di auth-gate.js, vedi il commento
     completo in cartoteca.html dove è stato diagnosticato. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Millennium">
<script src="js/ui/error-recovery.js"></script>
<!-- Accesso obbligatorio (js/cloud/auth-gate.js) — vedi il commento lì:
     rimanda a index.html se non c'è una sessione approvata. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/cloud/supabase-config.js"></script>
<script src="js/cloud/cloud-sync.js"></script>
<script src="js/cloud/auto-sync.js"></script>
<script src="js/cloud/auth-gate.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="stylesheet" href="js/ui/page-loader.css">
<link rel="prefetch" href="audio/soundtracks/56. Battle for the Millennium.mp3">
<link rel="stylesheet" href="js/ui/topbar.css">
<!-- Selettore di mazzo/arena/musica della modale di difficoltà, condiviso
     con la Sala d'Attesa del Multiplayer, più le scatole 3D dei mazzi. -->
<link rel="stylesheet" href="js/ui/deck-box.css">
<link rel="stylesheet" href="js/ui/duel-setup.css">
<link rel="stylesheet" href="js/ui/sfida-libera.css">
<link rel="stylesheet" href="js/ui/scelta-duellante.css">
<link rel="stylesheet" href="js/ui/fluido.css">
<link rel="stylesheet" href="js/ui/deck-switcher.css">
<title>Yu-Gi-Oh! Millennium Duel Arena — Duello Libero</title>
<link rel="stylesheet" href="js/ui/duello-libero.css">
</head>
<body>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <main class="main">
        <div id="cubeGrid"></div>
    </main>

    <!-- La finestra "prepara la sfida" la costruisce js/ui/sfida-libera.js. -->

    <div class="toast" id="toast"></div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/save-manager.js"></script>
<!-- cards-db.js serve solo per CARD_ORIGIN_LABELS (selettore "Carte
     ammesse"): non ha istruzioni eseguite al caricamento e non richiede
     il database carte completo, quindi si può includere da solo. -->
<script src="js/data/cards-db.js"></script>
<script src="js/data/custom-taxonomy.js"></script>
<!-- Controllo "il mio mazzo rispetta le Carte ammesse?" prima di entrare
     nell'arena: gli bastano le 50 carte non standard (file generato,
     ~5 KB) e le carte inventate dal giocatore, non l'intera anagrafica. -->
<script src="js/data/custom-cards.js"></script>
<script src="js/data/card-origins.generated.js"></script>
<script src="js/data/deck-legality.js"></script>
<script src="js/data/characters-db.js"></script>
<!-- Catalogo della Storia (con i ritocchi dell'Editor Mappa): serve solo a
     dire su ogni Duellante bloccato in quale campagna lo si incontra,
     vedi CharacterUnlocks.doveSiSblocca. -->
<script src="js/data/story-campaigns.js"></script>
<script src="js/data/story-ritocchi.js"></script>
<script src="js/story/story-ritocchi.js"></script>
<script src="js/data/character-unlocks.js"></script>
<script src="js/ui/fluido.js"></script>
<script src="js/ui/scelta-duellante.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/topbar.js"></script>
<script src="js/ui/deck-box.js"></script>
<script src="js/data/arena-options.js"></script>
<script src="js/ui/duel-setup.js"></script>
<script src="js/ui/sfida-libera.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script>
    // Nessun onBack: il genitore logico di questa pagina è sempre il menu
    // principale, che è già il backHref di default di PageTopbar.render
    // ('index.html') — anche quando si torna qui da un duello appena
    // concluso (js/duel-session.js#goBack), che non ha più bisogno di
    // alcun flag per "aggirare" il pulsante Indietro (vedi la sua stessa
    // funzione goBack: non imposta più ygoSkipReferrerBack).
    // `deck: true` — ritratto (porta al profilo) E mazzo corrente (apre il
    // selettore a scorrimento) in fondo alla barra: qui si sta per
    // duellare, quindi il mazzo è l'informazione giusta da avere sotto gli
    // occhi. Li monta PageTopbar, vedi lì.
    PageTopbar.render('#topbarMount', { icon: 'freeDuel', title: 'Duello Libero', subtitle: 'Scegli un duellante da sfidare', deck: true });

    initAudioManager();
    Icons.hydrate();

    let toastTimeout = null;
    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // La griglia dei Duellanti con la barra di ricerca e filtri è un
    // componente (js/ui/scelta-duellante.js): qui restano solo cosa succede alla
    // scelta e i messaggi brevi.
    let griglia = null;
    function renderCubes() {
        if (griglia) { griglia.refresh(); return; }
        griglia = SceltaDuellante.mount(document.getElementById('cubeGrid'), {
            onScegli: (character) => openDifficultyModal(character),
            toast: showToast
        });
    }

    // La finestra "prepara la sfida" (arena, musica, carte ammesse, livello
    // e l'avvio del duello) è js/ui/sfida-libera.js, una sola copia per tutto il gioco.
    function openDifficultyModal(character) {
        SfidaLibera.apri(character, { toast: showToast });
    }

    renderCubes();
    // Un amministratore vede tutti i Duellanti, ma `CloudSync.isAdmin()`
    // può ancora rispondere "no" al primo istante (il profilo arriva dal
    // database in modo asincrono). Si ridisegna una volta quando la
    // sessione è nota: per tutti gli altri è un secondo render identico
    // al primo, e costa un pugno di millisecondi.
    if (window.CloudSync && typeof CloudSync.waitForUser === 'function') {
        CloudSync.waitForUser().then(() => renderCubes()).catch(() => {});
    }
</script>
</body>
</html>
