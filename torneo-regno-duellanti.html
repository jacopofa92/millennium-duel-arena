            i++;
            setTimeout(passo, MAP_TRAVEL_MS);
        };
        passo();
    }

    function resolveChosenRoute(state, route) {
        if (route.kind === 'opponent') {
            // Il percorso va salvato SUBITO, appena si scopre che tipo è
            // (avversario), non solo dopo che si conferma la puntata —
            // richiesta esplicita dell'utente: prima, uscire dall'app (o
            // ricaricare la pagina) mentre il modale di puntata era aperto
            // lasciava state.pendingRoutes intatto sul salvataggio, quindi
            // al rientro si rivedeva lo STESSO bivio con TUTTE le opzioni
            // ancora disponibili — bastava scoprire chi si stava per
            // affrontare, non piacerlo, e "ritentare" un percorso diverso
            // senza conseguenze. `wager: null` segnala "avversario già
            // rivelato e bloccato, puntata non ancora scelta": render() lo
            // riconosce e riapre questo stesso modale invece di mostrare
            // un bivio fresco o (peggio) lanciare il duello senza puntata.
            state.pendingRoutes = null;
            state.pendingEncounter = { characterId: route.characterId, wager: null, isKaibaGate: false, x: route.x, y: route.y };
            saveState(state);
            promptOpponentWager(state);
            return;
        }
        if (route.kind === 'deadEnd') {
            enterCorridor(state, state.pendingRoutes.indexOf(route));
            return;
        }
        if (route.kind === 'prize') {
            addStars(route.amount, state);
            pushHistoryNode(state, 'prize', `+${route.amount} Stelle`, route);
            showToast(`🎁 ${pickRandom(PRIZE_SCENES)} (+${route.amount} Stelle)`);
        } else if (route.kind === 'malus') {
            addStars(-route.amount, state);
            pushHistoryNode(state, 'malus', `-${route.amount} Stelle`, route);
            showToast(`⚠️ ${pickRandom(MALUS_SCENES)} (-${route.amount} Stelle)`);
        } else if (route.kind === 'castle') {
            resolveCastlePath(state);
            return;
        } else if (route.kind === 'castleChallenge') {
            // Stesso "Sfida!" di renderCastleChallenge di prima — nessuna
            // puntata (wager: 0, vittoria-o-eliminazione secca), il nodo
            // sulla mappa sostituisce solo la schermata-card, la logica di
            // risoluzione resta la STESSA già gestita da
            // resolvePendingEncounterIfDone per castleStage.
            state.pendingRoutes = null;
            state.pendingEncounter = { characterId: route.characterId, wager: 0, isKaibaGate: false, castleStage: route.castleStage };
            saveState(state);
            launchDuel(state.pendingEncounter);
            return;
        }
        state.step++;
        state.pendingRoutes = null;
        saveState(state);
        if (currentStars() <= 0) {
            state.eliminated = true;
            saveState(state);
        }
        render();
    }

    /**
     * 20% di probabilità di dover prima affrontare Kaiba, puntando TUTTE
     * le Stelle, per poter entrare — richiesta esplicita dell'utente
     * (prima era 50%, che nel gioco reale finiva per sembrare "capita
     * sempre" data la ripetibilità del torneo). `atKaibaGate` (non ancora
     * un vero pendingEncounter: quello scatta solo al click su "Sfida!",
     * vedi renderKaibaGateEncounter) fa sì che il prossimo render() mostri
     * la schermata d'incontro drammatica invece di saltare dritti al duello.
     */
    const KAIBA_GATE_CHANCE = 0.2;
    function resolveCastlePath(state) {
        if (Math.random() < KAIBA_GATE_CHANCE) {
            state.pendingRoutes = null;
            state.atKaibaGate = true;
            saveState(state);
            render();
            // L'intermezzo arriva DOPO il render, così dietro alla scena
            // c'è già il fondale del Castello e la sua musica: quando il
            // dialogo si chiude, il giocatore è già dove deve essere.
            TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'kaibaGate', state, saveState);
        } else {
            enterCastleBracket(state);
            state.pendingRoutes = null;
            saveState(state);
            render();
            TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'castle', state, saveState);
        }
    }

    /**
     * Prepara il tabellone del Castello (semifinale/finale/Pegasus): tre
     * altri Duellanti — MAI Kaiba, che ha già avuto il proprio scontro a
     * parte al Cancello — sono "entrati nel Castello" insieme al
     * giocatore. La semifinale è contro uno scelto a caso tra loro; la
     * finale (quando la semifinale è vinta) contro uno dei DUE rimasti,
     * scelto anche lui a caso — non si simula davvero l'altro incrocio
     * del tabellone, sarebbe complessità aggiuntiva per un dettaglio che
     * il giocatore non vede comunque succedere.
     */
    function enterCastleBracket(state) {
        state.castleReached = true;
        resetCastleMap(state);
        const pool = ROSTER_IDS.slice();
        const finalists = [];
        while (finalists.length < 3 && pool.length > 0) {
            const index = Math.floor(Math.random() * pool.length);
            finalists.push(pool.splice(index, 1)[0]);
        }
        state.castleFinalists = finalists;
        state.castleStage = 'semifinal';
        state.castleSemifinalOpponent = pickRandom(finalists);
    }

    function resetCastleMap(state) {
        state.history = [];
        state.castleHistory = [];
        state.step = 0;
        state.pendingRoutes = null;
        state.castleMapReset = true;
    }

    /**
     * Genera (se manca) il "bivio" a UNA sola scelta per la tappa attuale
     * del Castello (semifinale/finale/Pegasus) — stesso identico
     * meccanismo del bivio normale (state.pendingRoutes, disegnato da
     * renderMap), ma sempre con un solo elemento: il Castello è un
     * percorso lineare, senza vera scelta, però l'utente ha chiesto
     * esplicitamente che restasse un nodo sulla mappa come ogni altra
     * tappa, non una schermata a parte. Va richiamata SOLO quando
     * `state.pendingRoutes` è vuoto (dopo ogni vittoria che avanza
     * `castleStage`, chi chiama azzera già pendingRoutes prima) — mai
     * rigenerata ad ogni render, altrimenti la posizione del nodo
     * cambierebbe da sola scorrendo la mappa.
     */
    function ensureCastleChallengeRoute(state) {
        if (state.pendingRoutes && state.pendingRoutes.length > 0) return;
        const stage = state.castleStage;
        const opponentId = stage === 'pegasus' ? 'pegasus'
            : stage === 'final' ? state.castleFinalOpponent
            : state.castleSemifinalOpponent;
        // Il tappeto rosso attraversa orizzontalmente il centro del
        // fondale: semifinale a sinistra, finale al centro e Pegasus a
        // destra. Anche se resta visibile un solo nodo alla volta, la sua
        // posizione racconta l'avanzamento dentro il Castello.
        const avanzamentoX = stage === 'pegasus' ? 0.78 : (stage === 'final' ? 0.5 : 0.22);
        const margineX = Math.min(110, window.innerWidth * 0.16);
        const route = {
            kind: 'castleChallenge',
            characterId: opponentId,
            castleStage: stage,
            x: Math.max(margineX, Math.min(window.innerWidth - margineX, window.innerWidth * avanzamentoX)),
            y: clampMapY(window.innerHeight * 0.5)
        };
        state.pendingRoutes = [route];
        saveState(state);
        justGeneratedRoutes = true;
    }

    function rememberCastleVictory(state, stage, opponentId) {
        state.castleHistory = state.castleHistory || [];
        const opponent = getRosterCharacter(opponentId);
        const avanzamentoX = stage === 'pegasus' ? 0.78 : (stage === 'final' ? 0.5 : 0.22);
        const margineX = Math.min(110, window.innerWidth * 0.16);
        state.castleHistory.push({
            kind: 'win',
            label: opponent ? opponent.name : 'Duellante sconfitto',
            x: Math.max(margineX, Math.min(window.innerWidth - margineX, window.innerWidth * avanzamentoX)),
            y: clampMapY(window.innerHeight * 0.5)
        });
    }

    // ----------------------------------------------------------------
    // Modale di puntata
    // ----------------------------------------------------------------
    function openWagerModal(character, onConfirm) {
        const modal = document.getElementById('wagerModal');
        const portrait = document.getElementById('wagerPortrait');
        portrait.className = 'opponent-portrait';
        portrait.innerHTML = '🧑‍🎤';
        // Ritratto del TORNEO (Kaiba al Cancello ha l'aspetto del Regno dei Duellanti).
        const immagineTorneo = character ? getCharacterImageFor(character.id, 'duelistKingdom') : null;
        if (immagineTorneo) {
            const img = document.createElement('img');
            img.alt = '';
            img.onload = () => portrait.classList.add('has-image');
            img.onerror = () => img.remove();
            img.src = immagineTorneo;
            portrait.appendChild(img);
        }
        document.getElementById('wagerName').textContent = character ? character.name : 'Duellante';
        document.getElementById('wagerTitle').textContent = (character && character.title) || '';
        const quote = character ? getQuote(character.id, 'intro') : '';
        const quoteEl = document.getElementById('wagerQuote');
        quoteEl.textContent = quote;
        quoteEl.style.display = quote ? 'block' : 'none';

        let selected = null;
        const stars = currentStars();
        // Scoped a #wagerRow, non a ogni .wager-btn della pagina: la
        // schermata iniziale del torneo usa la stessa classe per il
        // selettore di difficoltà (#difficultyRow) — pur non essendo mai
        // presente insieme a questo modale nello stesso DOM, restare
        // espliciti evita ambiguità future.
        const buttons = Array.from(document.querySelectorAll('#wagerRow .wager-btn'));
        buttons.forEach((btn) => {
            // "Tutte" punta l'intero possesso attuale di Stelle — richiesta
            // esplicita dell'utente, oltre alle 3 puntate fisse 2/3/5.
            // Effetto collaterale positivo: con meno di 2 Stelle (es. 1,
            // possibile dopo un'insidia) le 3 puntate fisse erano TUTTE
            // disabilitate (nessuna affrontabile), lasciando il modale
            // senza alcuna opzione selezionabile — bug preesistente, mai
            // segnalato perché raro. "Tutte" resta sempre selezionabile
            // finché si possiede almeno 1 Stella, quindi lo risolve anche
            // per un caso non esplicitamente richiesto.
            const isAll = btn.dataset.wager === 'all';
            const amount = isAll ? stars : parseInt(btn.dataset.wager, 10);
            btn.disabled = isAll ? stars <= 0 : amount > stars;
            if (isAll) btn.textContent = `Tutte (${stars})`;
            btn.classList.remove('selected');
            btn.onclick = () => {
                if (btn.disabled) return;
                selected = amount;
                buttons.forEach((b) => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
        });
        document.getElementById('wagerConfirmBtn').onclick = () => {
            if (selected == null) return;
            modal.classList.remove('open');
            onConfirm(selected);
        };
        modal.classList.add('open');
    }

    /**
     * Apre il modale di puntata per l'avversario già bloccato in
     * `state.pendingEncounter` (wager ancora null) — usata sia subito dopo
     * aver scelto un percorso 'opponent' (resolveChosenRoute) sia da
     * render() per ripresentare la stessa scelta se la pagina viene
     * ricaricata prima che la puntata sia confermata. In ENTRAMBI i casi
     * l'avversario è già fissato in stato salvato: qui si sceglie SOLO
     * quante Stelle puntare, mai un percorso diverso.
     */
    function promptOpponentWager(state) {
        const characterId = state.pendingEncounter.characterId;
        openWagerModal(getRosterCharacter(characterId), (wager) => {
            state.pendingEncounter.wager = wager;
            saveState(state);
            launchDuel(state.pendingEncounter);
        });
    }

    // ----------------------------------------------------------------
    // Lancio del vero duello — vedi js/duel-session.js (mode=tournament)
    // per come questa pagina viene riconosciuta come "da dove torna" il
    // pulsante Continua a fine duello.
    // ----------------------------------------------------------------
    // Colonna sonora del duello, diversa da quella della mappa (vedi
    // initAudioManager qui sopra) e dal brano generico che
    // duelMonstersCore.html sceglierebbe da solo. Sfrutta il parametro
    // ?music= già esistente lì (nato per Duello Libero).
    //
    // Un solo brano per ogni Duellante del roster; chi ha un tema PROPRIO
    // (Kaiba, Pegasus) se lo porta dietro ovunque, e quel dato vive ora
    // in js/data/characters-db.js invece che qui — vedi launchDuel.
    const BATTLE_TRACK = '22. Mountain Shrine.mp3';

    function launchDuel(encounter) {
        // Difficoltà scelta UNA VOLTA sulla schermata iniziale (vedi
        // renderStartScreen) e valida per l'intero torneo — nessuna
        // eccezione per Kaiba/Pegasus, come richiesto esplicitamente
        // dall'utente ("ovviamente i bot sono di conseguenza").
        const state = loadState();
        const difficulty = (state && state.difficulty) || 'Medio';
        // Il TEMA del personaggio batte quello della tappa: chi ne ha uno
        // proprio (Kaiba, Pegasus — vedi `duelTrack` in
        // js/data/characters-db.js) se lo porta dietro ovunque lo si
        // incontri. Prima erano due costanti locali agganciate al CONTESTO
        // (il Cancello, la sfida finale) invece che alla persona, e la
        // traccia di Kaiba qui era perfino diversa da quella usata nel
        // Torneo Kaiba per lo stesso personaggio.
        const sfidante = getRosterCharacter(encounter.characterId);
        let track = (sfidante && sfidante.duelTrack) || BATTLE_TRACK;
        // Campo da gioco fisso per OGNI duello di questo torneo (richiesta
        // esplicita dell'utente) — sfrutta lo stesso parametro ?field=
        // già letto da duelMonstersCore.html per Duello Libero, nessuna
        // modifica a quella pagina. Due varianti distinte: i duelli
        // "esterni" (bosco/roster, sull'isola) usano l'arena ufficiale
        // del Regno dei Duellanti,
        // mentre qualunque duello che si svolge già dentro il Castello
        // (Cancello di Kaiba compreso — narrativamente è già lì, vedi
        // body.castle-mode qui sopra) si combatte nella sala del Castello
        // di Pegasus. Prima anche quelli usavano un'immagine di rovine
        // (rovine_2.jpg), per mancanza di meglio: ora esiste la mappa
        // dedicata, con la scacchiera e le statue alate.
        const insideCastle = !!(encounter.isKaibaGate || encounter.castleStage);
        const fieldImage = insideCastle ? 'arenaCastelloPegasus.jpg' : 'arenaRegnoDeiDuellanti.jpg';
        // Torneo a regolamento classico: SOLO carte Yu-Gi-Oh (richiesta
        // esplicita dell'utente). Chi si presenta con carte fanmade o di
        // altre provenienze viene fermato prima del duello con la
        // spiegazione — vedi findForbiddenCards in js/duel-session.js, che
        // legge questo stesso parametro ?origin= per ogni modalità.
        let url = `duelMonstersCore.html?mode=tournament&tournament=${TOURNAMENT_ID}&character=${encodeURIComponent(encounter.characterId)}&difficulty=${difficulty}&music=${encodeURIComponent(track)}&field=${encodeURIComponent(fieldImage)}&origin=yu-gi-oh`;
        if (window.StoryAutowin) url = StoryAutowin.aggiungiAUrl(url);
        // Il regolamento del torneo ammette solo carte Yu-Gi-Oh: se il
        // mazzo in uso non lo rispetta si dice QUI, prima di caricare
        // l'arena. Il controllo dentro il duello resta come ultima
        // difesa, ma scoprirlo a musica gia' partita e' tardi.
        const fuoriRegolamento = window.DeckLegality
            ? DeckLegality.mazzoCorrenteNonAmmesso('yu-gi-oh')
            : [];
        if (fuoriRegolamento.length > 0) {
            const elenco = fuoriRegolamento.slice(0, 3).join(', ');
            const altre = fuoriRegolamento.length - Math.min(3, fuoriRegolamento.length);
            showToast(`🚫 Il torneo ammette solo carte Yu-Gi-Oh!, ma il tuo mazzo ne contiene ${fuoriRegolamento.length} di altre provenienze (${elenco}${altre > 0 ? ` e altre ${altre}` : ''}). Cambia mazzo dalla barra in alto.`);
            return;
        }
        window.location.href = url;
    }

    /**
     * Consuma la breadcrolla generica "com'è appena finito l'ultimo
     * duello" (js/duel-session.js#finish) SOLO se corrisponde davvero a
     * un pendingEncounter di QUESTO torneo — altrimenti (es. l'utente ha
     * giocato un Duello Libero in un'altra scheda e poi è tornato qui
     * senza passare da un vero duello di torneo) non tocca nulla.
     */
    function resolvePendingEncounterIfDone(state) {
        if (!state.pendingEncounter) return false;
        let outcome = null;
        try {
            const raw = sessionStorage.getItem('ygoLastDuelOutcome');
            if (raw) outcome = JSON.parse(raw);
        } catch (e) { /* noop */ }
        if (!outcome || outcome.mode !== 'tournament' || outcome.tournamentId !== TOURNAMENT_ID) return false;
        try { sessionStorage.removeItem('ygoLastDuelOutcome'); } catch (e) { /* noop */ }

        const enc = state.pendingEncounter;
        const character = getRosterCharacter(enc.characterId);
        const name = character ? character.name : 'il Duellante';
        const won = outcome.playerWon === true;
        // Reazione IN CARATTERE dell'AVVERSARIO appena affrontato (mai del
        // giocatore): se il giocatore vince, il Duellante pronuncia una
        // battuta da 'lose' (l'ha persa lui); se perde, ne pronuncia una da
        // 'win' (l'avversario gongola) — alla Forbidden Memories.
        const reaction = getQuote(enc.characterId, won ? 'lose' : 'win');

        // Duelli del Castello (semifinale/finale/Pegasus): niente puntata,
        // è vittoria-o-eliminazione secca — gestiti PRIMA del ramo
        // Cancello di Kaiba/percorso normale qui sotto, che invece
        // riguardano sempre una vera posta di Stelle.
        if (enc.castleStage) {
            if (won) {
                const reward = enc.castleStage === 'pegasus' ? 15 : (10 + Math.floor(Math.random() * 6));
                addStars(reward, state);
                // Il nuovo sfidante compare solo dopo questa vittoria, ma
                // i nodi già superati DENTRO il Castello restano sul
                // tappeto. La history dell'isola rimane invece separata.
                rememberCastleVictory(state, enc.castleStage, enc.characterId);
                if (window.NativeHaptics) NativeHaptics.success();
                if (enc.castleStage === 'semifinal') {
                    state.castleStage = 'final';
                    state.castleFinalOpponent = pickRandom(state.castleFinalists.filter((id) => id !== enc.characterId));
                    // Chi ti aspetta in finale, detto per nome: prima
                    // restava scritto solo nel nodo della mappa.
                    const avversarioFinale = getRosterCharacter(state.castleFinalOpponent);
                    TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'castleFinal', state, saveState, {
                        avversario: avversarioFinale ? avversarioFinale.name : ''
                    });
                    showToast(`⚔️ Hai sconfitto ${name} in semifinale! +${reward} Stelle. Ti attende la finale!`, reaction);
                } else if (enc.castleStage === 'final') {
                    state.castleStage = 'pegasus';
                    // Da qui resta solo Pegasus: l'intermezzo prepara
                    // l'ultimo duello (vedi js/data/tournament-dialogues.js).
                    TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'pegasus', state, saveState);
                    showToast(`🏆 Hai vinto la finale contro ${name}! +${reward} Stelle. Ora affronti Pegasus in persona.`, reaction);
                } else if (enc.castleStage === 'pegasus') {
                    state.castleStage = 'champion';
                    // Premio di completamento: assegnato PRIMA di
                    // incrementare 'completions', così `primaVolta` è vero
                    // solo alla vera prima vittoria (dopo l'incremento il
                    // contatore sarebbe già a 1 e il raddoppio non
                    // scatterebbe mai).
                    const primaVolta = (SaveManager.getTournamentStats(TOURNAMENT_ID).completions || 0) === 0;
                    state.rewards = window.Rewards ? Rewards.forTournament(TOURNAMENT_ID, primaVolta, state.difficulty) : [];
                    SaveManager.incrementTournamentStat(TOURNAMENT_ID, 'completions');
                    TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'champion', state, saveState);
                    showToast(`👑 Hai sconfitto Maximillion Pegasus! Sei il Campione del Regno dei Duellanti!`, reaction);
                }
            } else {
                if (window.NativeHaptics) NativeHaptics.error();
                state.eliminated = true;
                showToast(`💀 ${name} ti ha sconfitto: il tuo cammino nel Castello finisce qui.`, reaction);
            }
            state.pendingEncounter = null;
            saveState(state);
            return true;
        }

        if (won) {
            addStars(enc.wager, state);
            if (window.NativeHaptics) NativeHaptics.success();
            if (enc.isKaibaGate) {
                enterCastleBracket(state);
                // Battuto Kaiba al Cancello si entra davvero nel Castello:
                // stesso intermezzo di chi ci arriva senza incontrarlo.
                TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'castle', state, saveState);
                showToast(`🏆 Hai sconfitto ${name}! Il Castello di Pegasus si apre davanti a te.`, reaction);
            } else {
                pushHistoryNode(state, 'win', `Vittoria su ${name} (+${enc.wager})`, enc);
                state.step++;
                showToast(`⚔️ Hai sconfitto ${name}! +${enc.wager} Stelle.`, reaction);
            }
        } else {
            addStars(-enc.wager, state);
            if (window.NativeHaptics) NativeHaptics.error();
            if (enc.isKaibaGate) {
                showToast(`💀 ${name} ti ha sconfitto: le tue Stelle sono andate perdute.`, reaction);
            } else {
                pushHistoryNode(state, 'lose', `Sconfitta contro ${name} (-${enc.wager})`, enc);
                state.step++;
                showToast(`💀 ${name} ti ha sconfitto. -${enc.wager} Stelle.`, reaction);
            }
            if (currentStars() <= 0) state.eliminated = true;
        }
        state.pendingEncounter = null;
        state.atKaibaGate = false;
        saveState(state);
        return true;
    }

    // ----------------------------------------------------------------
    // Render principale — stato macchina a stati (vedi i commenti su
    // ogni ramo per quando si applica).
    // ----------------------------------------------------------------
    function render() {
        let state = loadState();
        // Ripristinata ad ogni render, poi eventualmente riattivata solo da
        // renderMap() qui sotto — MAI lasciata attiva su una schermata-card
        // (inizio/eliminazione/castello), che deve restare un riquadro
        // centrato, non a tutto schermo.
        mainEl.classList.remove('map-mode');
        document.body.classList.remove('map-active');
        // Sfondo del Castello di Pegasus per ogni schermata da qui in poi
        // (Cancello di Kaiba compreso — narrativamente è già "alla porta
        // del Castello") — mai per la mappa del bosco o la schermata
        // iniziale, ricalcolato ad ogni render così torna quello di
        // default se lo stato del torneo viene azzerato (Abbandona/Ricomincia).
        document.body.classList.toggle('castle-mode', !!(state && (state.castleReached || state.atKaibaGate)));

        if (!state) {
            // Prima di iniziare non c'è ancora nulla da sospendere/abbandonare:
            // solo una freccia Indietro minima verso l'elenco Tornei.
            hudBackBtn.style.display = 'flex';
            menuFab.style.display = 'none';
            starsBar.style.display = 'none';
            starsHint.style.display = 'none';
            renderStartScreen();
            return;
        }
        hudBackBtn.style.display = 'none';
        menuFab.style.display = 'flex';

        // Un esito di duello fresco per QUESTO torneo va sempre applicato
        // per primo, prima di decidere cos'altro mostrare — altrimenti si
        // rischierebbe di mostrare ancora "duello in sospeso" subito dopo
        // essere tornati da un duello già concluso.
        resolvePendingEncounterIfDone(state);

        starsBar.style.display = 'flex';
        document.getElementById('starsCount').textContent = currentStars();

        if (state.eliminated) { renderEliminated(); return; }
        if (state.castleReached) {
            // Migrazione delle scalate già entrate nel Castello prima di
            // questa regola: elimina una sola volta il vecchio sentiero
            // dell'isola senza toccare avversario o fase correnti.
            if (!state.castleMapReset) {
                resetCastleMap(state);
                saveState(state);
            }
            // Un pendingEncounter (sfida del Castello in sospeso, es.
            // pagina ricaricata a metà) ha comunque priorità sulla
            // normale schermata "sfida X" della tappa attuale.
            if (state.pendingEncounter) { renderResumeEncounter(state); return; }
            // "Campione": fine del cammino, resta una schermata-card
            // dedicata come Eliminato — non è un passo da percorrere, è un
            // traguardo, stesso principio di renderEliminated().
            if (state.castleStage === 'champion') { renderCastleStage(state); return; }
            // Richiesta esplicita dell'utente ("replica i nodi come fuori
            // dal castello"): anche le tappe del Castello (semifinale/
            // finale/Pegasus) ora proseguono sulla STESSA mappa a nodi
            // del resto del torneo, invece di una schermata-card separata
            // — un solo "bivio" con UNA sola scelta possibile (il prossimo
            // avversario del tabellone, niente scelta reale, il Castello
            // resta un percorso lineare) generato da
            // ensureCastleChallengeRoute qui sotto. Ogni vittoria continua
            // ad aggiungere una tappa "win" al sentiero (pushHistoryNode,
            // già chiamato da resolvePendingEncounterIfDone per queste
            // tappe) — ora finalmente visibile, non più scartata da una
            // vista che la ignorava.
            if (!state.pendingRoutes) ensureCastleChallengeRoute(state);
            state = loadState();
            renderMap(state);
            return;
        }
        // Avversario già rivelato/bloccato ma puntata non ancora scelta
        // (pagina ricaricata mentre il modale di puntata era aperto): la
        // mappa dietro mostra il sentiero fatto finora SENZA il bivio
        // (state.pendingRoutes è già null, vedi resolveChosenRoute), poi
        // si riapre lo stesso identico modale — mai un bivio fresco.
        if (state.pendingEncounter && state.pendingEncounter.wager == null) {
            renderMap(state);
            promptOpponentWager(state);
            return;
        }
        if (state.pendingEncounter) { renderResumeEncounter(state); return; }
        // Cancello di Kaiba: sorteggiato in resolveCastlePath, mostra la
        // schermata d'incontro drammatica finché il giocatore non preme
        // "Sfida!" (che trasforma questo in un vero pendingEncounter, sopra).
        if (state.atKaibaGate) { renderKaibaGateEncounter(state); return; }
        // Vicolo già scoperto ma ritorno al bivio interrotto (pagina
        // ricaricata durante l'animazione): si chiude adesso, senza
        // animazione. Mentre l'animazione è in corso invece no.
        if (state.corridor && state.corridor.finito && !deadEndAnimating) {
            finalizeDeadEnd(state);
            return;
        }
        // Rete di sicurezza contro il blocco: un bivio senza più strade
        // aperte non dovrebbe esistere (generateRoutes ne lascia sempre
        // almeno una vera), ma se capitasse se ne genera uno nuovo invece
        // di lasciare il giocatore davanti a soli sentieri chiusi.
        if (!state.corridor && state.pendingRoutes && state.pendingRoutes.every((r) => r.closed)) {
            state.pendingRoutes = null;
        }
        if (!state.pendingRoutes) generateRoutes(state);
        state = loadState();
        renderMap(state);
    }

    render();
</script>
</body>
</html>
