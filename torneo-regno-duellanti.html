<title>Yu-Gi-Oh! Millennium Duel Arena — Regno dei Duellanti</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/ra.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    /* Una volta raggiunto il Castello di Pegasus (o al suo Cancello con
       Kaiba): stesso trattamento a piena copertura del fondale di
       default qui sopra, solo con l'immagine del Castello al posto delle
       rovine egizie — attivata/disattivata da render() in base a
       state.castleReached/atKaibaGate, mai per le schermate precedenti
       (mappa del bosco, schermata iniziale). */
    body.castle-mode {
        background-image: url('images/maps/regno_dei_duellanti_castello_pegasus_torneo.jpg');
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.65) 0%, rgba(6,7,12,0.78) 60%, rgba(4,5,8,0.9) 100%);
        pointer-events: none;
    }
    /* La sfumatura scura qui sopra è tarata sulla foto CHIARA di default
       (ra.jpg, arenaria); l'immagine del Castello è già scura di suo
       (atmosfera da sala del trono in penombra) — la stessa intensità la
       renderebbe quasi invisibile, vanificando lo sfondo appena scelto. */
    body.castle-mode::before {
        background: linear-gradient(180deg, rgba(6,7,12,0.35) 0%, rgba(6,7,12,0.45) 60%, rgba(4,5,8,0.6) 100%);
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --ink: #cdd6ea;
        --ink-dim: #9aa5bd;
        --bad: #e74c3c;
        --good: #2ecc71;
    }

    .main {
        position: relative;
        z-index: 1;
        padding: 20px 18px 60px;
        max-width: 760px;
        margin: 0 auto;
    }
    /* Modalità "schermo di gioco a tutto schermo" per la mappa vera e
       propria (non per le schermate-card inizio/eliminazione/castello,
       che restano centrate — quelle sono già "un quadro", non "una lista
       filtro"): niente più contenitore con bordo/padding, la mappa copre
       l'intero viewport come in un vero gioco d'avventura. */
    .main.map-mode { padding: 0; max-width: none; margin: 0; }
    body.map-active { overflow: hidden; }

    /* =====================================================================
       HUD flottante — sostituisce la vecchia topbar "da pagina filtro"
       (freccia Indietro + titolo fissi in alto). Richiesta esplicita
       dell'utente: "non deve sembrare una pagina filtro con top menu...
       deve sembrare un gioco di avventura con un pulsante di menu".
       Prima che il torneo sia iniziato mostra solo una freccia Indietro
       minima; una volta iniziato (state esiste) mostra invece il
       contatore Stelle + il pulsante Menu (☰), MAI entrambi insieme.
       ===================================================================== */
    .hud-top {
        position: fixed;
        top: max(14px, env(safe-area-inset-top, 14px));
        left: 14px;
        right: 14px;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
    }
    .hud-top > * { pointer-events: auto; }
    .hud-back-btn, .menu-fab {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(247,215,116,0.4);
        background: linear-gradient(150deg, rgba(20,20,26,0.88), rgba(12,12,16,0.92));
        color: #fff;
        font-size: 1.25rem;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        cursor: pointer;
    }
    .stars-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 900;
        color: var(--gold);
        background: linear-gradient(150deg, rgba(20,20,26,0.88), rgba(12,12,16,0.92));
        border: 1px solid rgba(247,215,116,0.4);
        box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        text-shadow: 0 0 12px rgba(247,215,116,0.4);
    }
    .stars-hint {
        position: fixed;
        /* Parte da top:0 (non più 62px): prima si fermava appena sotto la
           pillola Stelle/pulsante Menu, lasciando quella fascia (dove
           galleggiano senza alcuno sfondo scuro dietro) completamente
           trasparente sul bosco sottostante — una cucitura netta ben
           visibile dove il gradiente scuro iniziava di colpo (bug reale
           segnalato dall'utente: "vedo che esiste una trasparenza in alto").
           Il padding-top spinge il TESTO più in basso, sotto le icone,
           mentre lo sfondo copre l'intera fascia superiore con un'unica
           dissolvenza continua, senza soluzione di continuità. */
        top: 0;
        left: 0;
        right: 0;
        z-index: 290;
        text-align: center;
        color: var(--ink-dim);
        font-size: 0.72rem;
        line-height: 1.4;
        pointer-events: none;
        padding: 70px 60px 16px;
        /* Sfuma verso il basso: rimane leggibile qualunque sia il nodo della
           mappa che le finisce sotto, senza un riquadro netto che stonerebbe
           con l'aspetto "mappa di gioco" del resto dello schermo. */
        background: linear-gradient(180deg, rgba(6,7,12,0.75) 0%, rgba(6,7,12,0.55) 45%, rgba(6,7,12,0.22) 80%, transparent 100%);
    }

    /* =====================================================================
       MAPPA — sostituisce le vecchie "card" testuali dei percorsi: una
       vera mappa a scorrimento verticale (stile "isola vista dall'alto",
       terreno boschivo simulato in puro CSS con gradienti radiali
       ripetuti — nessuna immagine reale necessaria) con un sentiero di
       pallini collegati da linee (SVG), esattamente come descritto:
       "muoversi in una mappa... percorsi (linee)... pallini (sfidanti,
       premi, malus)". Cresce verso il basso man mano che si avanza (il
       viewport scorre da solo fino in fondo ad ogni render) invece di
       essere un elenco di card usa-e-getta.
       ===================================================================== */
    .map-viewport {
        position: relative;
        width: 100%;
        height: 420px;
        margin-bottom: 20px;
        border-radius: 18px;
        border: 2px solid rgba(247,215,116,0.28);
        box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(0,0,0,0.5);
        /* Scorrevole in OGNI direzione (non più solo in verticale): il
           mondo di gioco (.map-canvas) è più largo dello schermo, così il
           sentiero può davvero "vagare" a sinistra/destra invece di
           restare incollato al centro — mouse/trackpad su desktop,
           trascinamento nativo col dito su touch (nessun JS necessario per
           quello, lo fa già il browser); il drag-to-pan col mouse è
           aggiunto a parte, vedi setupMapDragPan più sotto. */
        overflow: auto;
        cursor: grab;
        overscroll-behavior: contain;
    }
    .map-viewport.dragging { cursor: grabbing; }
    /* A tutto schermo quando è la vera mappa esplorabile (vedi .main.map-mode qui sopra) — il "quadro" con bordo arrotondato resta solo per le schermate-card. */
    .main.map-mode .map-viewport {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        border-radius: 0;
        border: none;
        box-shadow: inset 0 0 90px rgba(0,0,0,0.55);
    }
    .map-canvas {
        position: relative;
        /* width/height REALI impostati inline da renderMap() (JS), già
           calcolati lì come max(contenuto, viewport) — mai un min-width/
           min-height CSS qui: quel trucco (usato in una versione precedente)
           faceva sì che l'SVG delle linee (viewBox legato alla sola
           dimensione del CONTENUTO) venisse stirato dal browser per
           riempire il canvas ingrandito dal CSS, sfasando le linee rispetto
           ai pallini (posizionati in px assoluti, mai ridimensionati) — vedi
           il commento in renderMap per il fix vero, alla radice. */
        /* Sfondo REALE della mappa d'esplorazione (il bosco del Regno dei
           Duellanti) — a DIMENSIONE ORIGINALE (1536×1024, mai scalata),
           richiesta esplicita dell'utente: su schermi più piccoli
           dell'immagine (praticamente sempre su mobile) si esplora
           scorrendo/trascinando, esattamente come il resto della mappa.
           Vive sul CANVAS (il contenuto che scorre), non sul viewport (la
           finestra fissa): deve muoversi insieme ai pallini quando si
           scorre/trascina, altrimenti la mappa sembrerebbe "scivolare" su
           uno sfondo immobile. Ripetuta a piastrelle alla stessa
           risoluzione nativa quando il mondo cresce oltre una singola
           immagine (il sentiero può allungarsi ben oltre 1536px di
           avanzamento) — una sfumatura scura leggera sopra aiuta la
           leggibilità di pallini/etichette senza coprire la foto. */
        background-color: #0c0e08;
        background-image:
            linear-gradient(180deg, rgba(6,7,12,0.28) 0%, rgba(6,7,12,0.12) 45%, rgba(6,7,12,0.4) 100%),
            url('images/maps/regno_dei_duellanti_bosco_torneo.jpg');
        background-repeat: no-repeat, repeat;
        background-size: 100% 100%, 1536px 1024px;
    }
    /* DENTRO IL CASTELLO il bosco lascia il posto alle sale di Pegasus —
       stessa mappa a nodi, stesso modo di scorrerla, un altro luogo. Basta
       cambiare l'immagine: la geometria dei pallini non c'entra nulla con
       lo sfondo, che è una texture sotto di loro.
       L'attributo lo scrive renderMap sul <body> guardando `castleStage`,
       così cambia anche il fondo della pagina dietro la mappa e non resta
       una cornice di bosco attorno al castello. */
    body[data-luogo="castello"] .map-canvas {
        background-color: #0a0710;
        background-image:
            linear-gradient(180deg, rgba(8,4,14,0.34) 0%, rgba(8,4,14,0.14) 45%, rgba(8,4,14,0.46) 100%),
            url('images/maps/regno_dei_duellanti_castello_pegasus_torneo.jpg');
    }
    body[data-luogo="castello"] .map-viewport { background: #0a0710; }
    .map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        width: 88px;
    }
    .map-node-dot {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.55rem;
        background: linear-gradient(150deg, rgba(40,32,20,0.92), rgba(18,16,22,0.95));
        border: 3px solid rgba(255,255,255,0.25);
        box-shadow: 0 8px 20px rgba(0,0,0,0.55);
    }
    .map-node-label {
        font-size: 0.68rem;
        font-weight: 800;
        color: var(--ink-dim);
        text-shadow: 0 1px 4px rgba(0,0,0,0.95);
        text-align: center;
        white-space: nowrap;
    }
    .map-node.start .map-node-dot { border-color: rgba(247,215,116,0.6); }
    .map-node.win .map-node-dot { border-color: rgba(46,204,113,0.7); background: linear-gradient(150deg, rgba(20,50,28,0.92), rgba(15,30,20,0.95)); }
    .map-node.lose .map-node-dot { border-color: rgba(231,76,60,0.7); background: linear-gradient(150deg, rgba(55,20,20,0.92), rgba(30,15,15,0.95)); }
    .map-node.prize .map-node-dot { border-color: rgba(247,215,116,0.7); background: linear-gradient(150deg, rgba(55,45,15,0.92), rgba(30,25,10,0.95)); }
    .map-node.malus .map-node-dot { border-color: rgba(180,120,60,0.7); background: linear-gradient(150deg, rgba(45,30,15,0.92), rgba(25,18,10,0.95)); }
    .map-node.current .map-node-dot {
        width: 64px; height: 64px;
        border-color: var(--gold-strong);
        box-shadow: 0 0 0 7px rgba(243,156,18,0.22), 0 8px 24px rgba(0,0,0,0.6);
        animation: mapCurrentPulse 1800ms ease-in-out infinite;
    }
    @keyframes mapCurrentPulse {
        0%, 100% { box-shadow: 0 0 0 6px rgba(243,156,18,0.22), 0 6px 20px rgba(0,0,0,0.6); }
        50% { box-shadow: 0 0 0 10px rgba(243,156,18,0.1), 0 6px 20px rgba(0,0,0,0.6); }
    }
    .map-node.choice {
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
        color: inherit;
    }
    .map-node.choice .map-node-dot {
        border-style: dashed;
        border-color: rgba(255,255,255,0.4);
        animation: mapChoiceBeckon 1400ms ease-in-out infinite;
    }
    @keyframes mapChoiceBeckon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    .map-node.choice.castle .map-node-dot { border-color: rgba(155, 89, 182, 0.7); }
    .map-node.choice:hover .map-node-dot { border-color: var(--gold); }
    .map-line {
        stroke: rgba(255,255,255,0.4);
        stroke-width: 4;
        stroke-dasharray: 2 9;
        stroke-linecap: round;
        fill: none;
    }
    .map-line.choice-line { stroke: rgba(247,215,116,0.6); }

    /* =====================================================================
       Bivi "parlanti" e vicoli ciechi (richiesta dell'utente).
       - Il sentiero percorso è un tratto dorato pieno, distinto dai bivi
         ancora da scegliere (tratteggio) e dai vicoli ciechi (grigio).
       - Un duello si riconosce prima di sceglierlo: ritratto dello
         sfidante nel pallino, con un cartellino "Duello" e il nome.
       - "Ignoto" è un sentiero misterioso: premio, insidia o vicolo cieco.
       - Le etichette stanno su una pillola scura: sopra la foto del bosco
         il testo grigio di prima si perdeva.
       ===================================================================== */
    .map-line.path-line { stroke: rgba(247,215,116,0.85); stroke-width: 5; stroke-dasharray: none; }
    .map-line.dead-line { stroke: rgba(170,170,170,0.45); stroke-width: 3; stroke-dasharray: 4 7; }
    .map-node-label {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(8, 8, 14, 0.72);
        color: #efe6cf;
    }
    .map-node-label:empty { display: none; }
    .map-node-dot { position: relative; overflow: hidden; }
    .map-node-dot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
    }
    .map-node-tag {
        margin-top: -14px;
        z-index: 1;
        padding: 1px 7px;
        border-radius: 4px;
        font-size: 0.56rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #2a1606;
        background: linear-gradient(180deg, #ffe08a, #e0a630);
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .map-node.choice.duel { width: 110px; }
    .map-node.choice.duel .map-node-dot {
        width: 68px;
        height: 68px;
        border: 3px solid #e8b84a;
        background: radial-gradient(circle at 50% 35%, #3a2a14, #120d08);
        box-shadow: 0 0 0 4px rgba(232,184,74,0.18), 0 0 18px rgba(232,184,74,0.35), 0 8px 20px rgba(0,0,0,0.6);
    }
    .map-node.choice.duel .map-node-label { color: #ffe9a8; }
    .map-node.choice.mystery .map-node-dot {
        border-color: rgba(150, 190, 255, 0.55);
        background: radial-gradient(circle at 50% 40%, rgba(60, 70, 120, 0.9), rgba(14, 14, 28, 0.95));
        color: #cfe0ff;
        text-shadow: 0 0 10px rgba(150, 190, 255, 0.8);
    }
    .map-node.choice.closed { cursor: default; }
    .map-node.choice.closed .map-node-dot,
    .map-node.dead .map-node-dot {
        animation: none;
        border-style: solid;
        border-color: rgba(170,170,170,0.45);
        background: rgba(30, 30, 34, 0.9);
        filter: grayscale(1);
        opacity: 0.75;
    }
    .map-node.choice.closed .map-node-label,
    .map-node.dead .map-node-label { color: #a9a9a9; }
    .map-node.dead-step .map-node-dot { width: 20px; height: 20px; font-size: 0.6rem; border-width: 2px; }
    .map-node.dead-step { width: 24px; }
    .map-node.current.dead-here .map-node-dot {
        animation: none;
        border-color: #c9c9c9;
        box-shadow: 0 0 0 7px rgba(200,200,200,0.15), 0 8px 24px rgba(0,0,0,0.6);
    }
    .map-node.choice:focus-visible .map-node-dot { outline: 3px solid #fff3c4; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
        .map-node.choice .map-node-dot, .map-node.current .map-node-dot { animation: none; }
    }
    /* Legenda in basso: dice che cosa nasconde un sentiero "Ignoto". */
    .map-legend {
        position: fixed;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 24px);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(8, 8, 14, 0.78);
        border: 1px solid rgba(247,215,116,0.25);
        font-size: 0.7rem;
        color: #e8dfc6;
        pointer-events: none;
    }
    .map-legend b { color: #ffe08a; font-weight: 800; }

    /* =====================================================================
       Animazioni: comparsa di nodi/linee NUOVI (un bivio appena generato,
       richiesta esplicita dell'utente: "un po' di animazione... quando ne
       compaiono di nuovi") e il "viaggio" verso il nodo scelto al click
       (richiesta esplicita: "e quando clicco su un nodo per raggiungerlo").
       Applicate via classi aggiunte SOLO ai nodi/linee davvero nuovi (vedo
       renderMap/chooseRoute più sotto) — mai in modo indiscriminato ad ogni
       render, altrimenti il sentiero già fatto "riapparirebbe" ogni volta
       che si torna sulla mappa. ===================================== */
    @keyframes mapNodeAppear {
        from { transform: translate(-50%, -50%) scale(0.35); opacity: 0; }
        to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .map-node-appear { animation: mapNodeAppear 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes mapLineAppear { from { opacity: 0; } to { opacity: 1; } }
    /* Un fade (non un growth via stroke-dasharray/dashoffset) per non
       toccare il pattern tratteggiato già impostato da .map-line/.choice-line
       (settare un dasharray calcolato in JS per un "disegno" progressivo lo
       sovrascriverebbe, perdendo il tratteggio a regime). */
    .map-line-appear { animation: mapLineAppear 0.45s ease-out both; }

    /* Nodi/linee scartati al momento della scelta: restano visibili ma
       sfumati, per non far sparire di scatto l'intero bivio mentre il
       "viaggiatore" si muove verso quello scelto. */
    .map-node-declined, .map-line-declined { transition: opacity 0.35s ease; opacity: 0.12; }
    /* Il nodo scelto: ferma il "richiamo" (mapChoiceBeckon, infinito — una
       transizione CSS normale non potrebbe mai vincere contro
       un'animazione ancora attiva sulla stessa proprietà) e lo blocca in
       un piccolo ingrandimento "premuto". */
    .map-node-chosen .map-node-dot {
        animation: none;
        transform: scale(1.18);
        border-color: var(--gold);
        box-shadow: 0 0 0 10px rgba(247,215,116,0.3), 0 8px 24px rgba(0,0,0,0.6);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    /* Pallino luminoso che percorre la linea dal nodo "sei qui" fino al
       nodo scelto — un div assoluto animato via transizione CSS su
       left/top (non serve SVG/animateMotion: ogni linea di questa mappa è
       un singolo segmento retto, un'interpolazione lineare basta). */
    .map-traveler {

    .opponent-quote {
        color: #f2f6ff;
        font-size: 0.82rem;

    /* --- Menu di avventura (☰): visualizza bottino / sospendi / abbandona / annulla --- */

    /* --- Bottino --- */

    // ================================================================
    // Regno dei Duellanti — mappa a bivi generata "man mano" (non un
    // grafo intero precalcolato): ad ogni passo si offrono 2-3 percorsi
    // (o un 4° "verso il Castello" oltre le 10 Stelle). Un duello si vede

    // ================================================================
    const TOURNAMENT_ID = 'duelistKingdom';
    const STARTING_STARS = 2;
    const CASTLE_THRESHOLD = 10;
    // Le puntate fisse vivono nel markup (#wagerRow in cima al file, 2/3/5
    // più "Tutte") e nella logica di openWagerModal più sotto — nessuna
    // costante qui: un elenco separato era dichiarato ma mai letto da
    // nessuno (codice morto), e sarebbe comunque andato disallineato dopo
    // l'aggiunta di "Tutte" (richiesta esplicita dell'utente).

    // d'esplorazione (Forest Shrine) finché non si raggiunge il Castello di
    // Pegasus (Cancello di Kaiba compreso — narrativamente già "alla porta
    // del Castello"), poi quella del Castello (Heishin's Millennium Puzzle

    // di vera BATTAGLIA (vedi BATTLE_TRACK/KAIBA_TRACK/PEGASUS_TRACK più
    // sotto, usati da launchDuel per il duello stesso, mai per questa
    // mappa). Letta QUI (loadState() è hoisted, richiamabile prima della
    // propria dichiarazione testuale più sotto) invece che nel normale
    // flusso di render() (che gira più tardi, a initAudioManager già
    // chiamata) per evitare di caricare per un istante il brano del bosco
    // e scartarlo subito se la pagina si riapre già dentro il Castello
    // (torneo salvato a metà).
    const FOREST_MAP_TRACK = 'audio/soundtracks/19. Forest Shrine.mp3';
    const CASTLE_MAP_TRACK = "audio/soundtracks/27. Heishin's Millennium Puzzle Confrontation.mp3";
    const initialTournamentState = loadState();
    let currentMapTrack = (initialTournamentState && (initialTournamentState.castleReached || initialTournamentState.atKaibaGate)) ? 'castle' : 'forest';
    initAudioManager({ trackSrc: currentMapTrack === 'castle' ? CASTLE_MAP_TRACK : FOREST_MAP_TRACK });

    /** Cambia la colonna sonora della mappa a runtime (SPA, nessun vero cambio pagina) quando si entra/esce dal Castello — no-op se il brano desiderato è già quello attivo. */
    function switchMapTrackIfNeeded(wantsCastle) {
        const desired = wantsCastle ? 'castle' : 'forest';
        if (desired === currentMapTrack) return;
        currentMapTrack = desired;
        if (!window.DuelMusic || !DuelMusic.setTrack) return;
        DuelMusic.setTrack(desired === 'castle' ? CASTLE_MAP_TRACK : FOREST_MAP_TRACK, { restart: true });
    }
    // Solo i Duellanti del vero Regno dei Duellanti (Duelist Kingdom) —
    // MAI Kaiba o Pegasus, che compaiono solo tramite il percorso
    // speciale "verso il Castello" più sotto, mai come incontro casuale

    const ROSTER_IDS = ['rex', 'weevil', 'mako', 'panik', 'bonz', 'paradoxBrothers', 'mai', 'bandit_keith'];

     * Battute in carattere per ogni Duellante — alla Forbidden Memories,

     * battute del tutto diverse, quindi il testo narrativo appartiene al

            lose: ["Nooo, la mia collezione... schiacciata!", "Impossibile, i miei insetti erano perfetti!"]
        },
        mako: {

            win: ["Le maree della vittoria sono con me!", "Il mare ha scelto: tu affondi, io navigo."],
            lose: ["Il mare stavolta mi ha voltato le spalle...", "Anche l'oceano più in tempesta può calmarsi."]
        },
        panik: {
            intro: ["Il Signor Pegasus si aspetta grandi cose da me... e da te, la sconfitta.", "Le illusioni ti confonderanno fino alla fine!"],
            win: ["Come previsto: un'altra vittima delle mie illusioni.", "Il Signor Pegasus sarà fiero di me."],

        },

            win: ["Caduto dritto in trappola, come tutti gli altri.", "Un altro autografo per la Regina delle Trappole."],

        },
        kaiba: {

            win: ["Come previsto. La mediocrità non ha scampo contro di me.", "Il Castello di Pegasus resta un sogno, per te."],

        },

    // Scenette di ambientazione per i bivi premio/insidia — alla stessa

    // posto vivo da esplorare, mai lette dalla logica di gioco (che
    // continua a ragionare solo su route.amount).
    const PRIZE_SCENES = [
        "Trovi uno scrigno abbandonato tra le palme, dimenticato da un altro Duellante.",
        "Un vecchio pescatore ti indica un sentiero nascosto e ti regala alcune Stelle come pegno di fortuna.",
        "Sotto una roccia scolpita scopri una piccola riserva di Stelle dell'Esagono.",
        "Un Kuriboh curioso ti porta tra le zampe alcune Stelle scintillanti."
    ];
    const MALUS_SCENES = [
        "Il sentiero frana all'improvviso: alcune delle tue Stelle rotolano nella boscaglia.",
        "Un gruppo di Duellanti in cerca di guai ti tende un'imboscata e ti alleggerisce di qualche Stella.",
        "Ti perdi tra gli alberi per ore: il tempo perso ti costa alcune Stelle.",
        "Una tempesta improvvisa sull'isola ti fa perdere l'equilibrio, e alcune Stelle con esso."
    ];

    /** Una battuta casuale (mai la stessa ripetuta due volte se ce n'è più di una) per `character` nella categoria `kind` ('intro'/'win'/'lose') — stringa vuota se il personaggio non è ancora in QUOTE_BANK. */
    function getQuote(characterId, kind) {
        const bank = QUOTE_BANK[characterId];
        if (!bank || !bank[kind] || bank[kind].length === 0) return '';
        return pickRandom(bank[kind]);
    }

    function getRosterCharacter(id) {
        return characterDatabase.find((c) => c.id === id);
    }

    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    /** Stato di default per un torneo mai iniziato (in memoria finché non si preme "Inizia") — `difficulty` ('Medio'/'Difficile') scelta dal giocatore in renderStartScreen, si applica a OGNI bot del torneo, Kaiba e Pegasus compresi (vedi launchDuel). */
    function makeInitialState(difficulty) {
        return {
            step: 0,
            pendingRoutes: null,
            pendingEncounter: null,
            history: [],
            // SEMPRE STARTING_STARS, a ogni inizio e a ogni ricomincio: le
            // Stelle del torneo sono sue e non quelle già in tasca al
            // giocatore (vedi currentStars/addStars) — cominciare con il
            // portafoglio pieno voleva dire aprire il Cancello di Kaiba,
            // che ne chiede dieci, magari al primo passo. Impostata QUI
            // direttamente (non con `addStars(STARTING_STARS)` dopo aver
            // creato lo stato): `addStars` scrive ANCHE nel portafoglio
            // reale del giocatore (`SaveManager.addCurrency`), corretto
            // per una VINCITA ma sbagliato per la dote di partenza, che
            // non è stata vinta da nessuno — bug reale trovato e chiuso,
            // segnalato dall'utente ("parto sempre con 2 stelle" non era
            // vero: `addStars` veniva chiamata PRIMA che questo stato
            // esistesse ancora, quindi il suo `if (!state) return 0`
            // la rendeva un no-op silenzioso e si partiva da zero).
            stars: STARTING_STARS,
            castleReached: false,
            eliminated: false,
            atKaibaGate: false,
            difficulty: difficulty === 'Difficile' ? 'Difficile' : 'Medio'
        };
    }

    function loadState() {
        return SaveManager.getTournamentState(TOURNAMENT_ID);
    }
    function saveState(state) {
        SaveManager.setTournamentState(TOURNAMENT_ID, state);
    }

    // ----------------------------------------------------------------
    // LE STELLE DEL TORNEO SONO SUE, NON DEL GIOCATORE.
    // ----------------------------------------------------------------
    // Prima il torneo leggeva e scriveva direttamente il portafoglio del
    // giocatore (save.currency.starChips): cominciandolo con Stelle già in
    // tasca si partiva da quelle, e il Cancello di Kaiba a 10 Stelle si
    // apriva magari al primo passo. Non è un torneo, è un saldo.
    //
    // Ora il conto vive nello STATO DEL TORNEO (`state.stars`) e parte
    // sempre da zero: si puntano e si perdono quelle, e sono l'unica cosa
    // che conta per arrivare al Castello.
    //
    // Il portafoglio del giocatore resta il BOTTINO: ogni Stella VINTA gli
    // viene accreditata e gli resta, anche se poi la si ripunta e la si
    // perde qui dentro. È la differenza fra "quante ne ho raccolte in
    // tutto" e "quante ne ho adesso su quest'isola" — perdere una puntata
    // non può togliere al giocatore quello che ha già guadagnato in una
    // partita precedente.
    function currentStars() {
        const state = loadState();
        return (state && typeof state.stars === 'number') ? state.stars : 0;
    }
    /**
     * Somma (o sottrae) Stelle del torneo, mai sotto zero. Una VINCITA
     * viene accreditata anche al portafoglio del giocatore; una perdita
     * no, per la ragione detta qui sopra.
     */
    function addStars(amount, currentState) {
        // Quando il chiamante sta già modificando lo stato del percorso,
        // bisogna aggiornare QUELLO stesso oggetto. Ricaricarne una copia
        // dal localStorage e poi risalvare `currentState` poco dopo
        // ripristinava il totale precedente, annullando bonus e malus.
        const state = currentState || loadState();
        if (!state) return 0;
        const prima = (typeof state.stars === 'number') ? state.stars : 0;
        state.stars = Math.max(0, prima + amount);
        saveState(state);
        if (amount > 0) SaveManager.addCurrency('starChips', amount);
        return state.stars;
    }

    // ----------------------------------------------------------------
    // Generazione dei percorsi: 2 o 3 scelte, ciascuna 'opponent' (55%),
    // 'prize' (25%) o 'malus' (20%) — pesi scelti per rendere gli
    // incontri con un Duellante il caso più comune senza eliminare mai
    // del tutto la varietà. Nessun Duellante ripetuto nello stesso set
    // di scelte (mero polish, non una regola del gioco reale).
    // ----------------------------------------------------------------
    const DEAD_END_CHANCE = 0.35;
    function rollRouteKind() {
        const r = Math.random();
        if (r < 0.55) return 'opponent';
        if (r < 0.80) return 'prize';
        return 'malus';
    }
    function generateRoutes(state) {
        const count = Math.random() < 0.5 ? 2 : 3;
        const usedCharacters = new Set();
        const routes = [];
        for (let i = 0; i < count; i++) {
            const kind = rollRouteKind();
            if (kind === 'opponent') {
                let pool = ROSTER_IDS.filter((id) => !usedCharacters.has(id));
                if (pool.length === 0) pool = ROSTER_IDS;
                const characterId = pickRandom(pool);
                usedCharacters.add(characterId);
                routes.push({ kind: 'opponent', characterId: characterId });
            } else if (kind === 'prize') {
                routes.push({ kind: 'prize', amount: 1 + Math.floor(Math.random() * 2) });
            } else {
                routes.push({ kind: 'malus', amount: 1 + Math.floor(Math.random() * 2) });
            }
        }
        // VICOLO CIECO (richiesta dell'utente): a volte uno dei sentieri
        // ignoti non porta da nessuna parte, e dopo 1 o 2 nodi si torna al
        // bivio. Per non incastrare mai il giocatore:
        //  - al massimo UN vicolo cieco per bivio, e solo AGGIUNTO o al
        //    posto di un'altra scelta quando ne restano almeno due vere —
        //    quindi da ogni bivio c'è sempre almeno una strada che prosegue;
        //  - chi lo scopre torna al bivio da solo e quel sentiero resta
        //    chiuso (route.closed): non lo si può riprendere, niente giri a
        //    vuoto (vedi enterCorridor/finalizeDeadEnd).
        if (Math.random() < DEAD_END_CHANCE) {
            const deadEnd = { kind: 'deadEnd', depth: Math.random() < 0.5 ? 1 : 2 };
            if (routes.length >= 3) routes.splice(Math.floor(Math.random() * routes.length), 1);
            // Posizione nel ventaglio a caso: sempre in coda sarebbe
            // riconoscibile.
            routes.splice(Math.floor(Math.random() * (routes.length + 1)), 0, deadEnd);
        }
        // Oltre la soglia, il percorso verso il Castello resta SEMPRE
        // disponibile in aggiunta alle scelte normali (non le sostituisce):
        // il giocatore può continuare a raccogliere Stelle se preferisce.
        if (currentStars() >= CASTLE_THRESHOLD) {
            routes.push({ kind: 'castle' });
        }
        assignChoicePositions(state, routes);
        state.pendingRoutes = routes;
        saveState(state);
        // Consumato dal PROSSIMO renderMap() (chiamato subito dopo, stesso
        // giro sincrono di render() — vedi in fondo al file) per animare
        // in comparsa SOLO questo bivio appena generato, mai i render
        // successivi in cui le stesse scelte restano ferme in attesa.
        justGeneratedRoutes = true;
    }
    let justGeneratedRoutes = false;

    // ----------------------------------------------------------------
    // Render
    // ----------------------------------------------------------------
    const content = document.getElementById('content');
    const mainEl = document.querySelector('.main');
    const starsBar = document.getElementById('starsBar');
    const starsHint = document.getElementById('starsHint');
    const hudBackBtn = document.getElementById('hudBackBtn');
    const menuFab = document.getElementById('adventureMenuBtn');

    hudBackBtn.onclick = () => { window.location.href = 'tornei.html'; };

    // ----------------------------------------------------------------
    // Menu di avventura (☰) — sostituisce la topbar "da pagina filtro":
    // visualizza bottino / sospendi torneo / abbandona torneo / annulla.
    // ----------------------------------------------------------------
    const adventureMenuModal = document.getElementById('adventureMenuModal');
    const menuOptionsList = document.getElementById('menuOptionsList');
    const menuAbandonConfirm = document.getElementById('menuAbandonConfirm');
    const lootModal = document.getElementById('lootModal');

    function openAdventureMenu() {
        menuOptionsList.style.display = 'flex';
        menuAbandonConfirm.style.display = 'none';
        adventureMenuModal.classList.add('open');
    }
    function closeAdventureMenu() { adventureMenuModal.classList.remove('open'); }

    menuFab.onclick = openAdventureMenu;
    document.getElementById('menuCancelBtn').onclick = closeAdventureMenu;
    adventureMenuModal.addEventListener('click', (e) => { if (e.target === adventureMenuModal) closeAdventureMenu(); });

    function openLootModal() {
        const state = loadState();
        document.getElementById('lootStars').textContent = currentStars();
        const list = document.getElementById('lootList');
        const entries = (state && state.history ? state.history.slice() : []).reverse();
        list.innerHTML = entries.length
            ? entries.map((e) => `<div class="loot-entry"><span>${ICON_FOR_KIND[e.kind] || '•'}</span><span>${e.label}</span></div>`).join('')
            : '<p class="loot-empty">Il tuo cammino è appena iniziato: nessun evento ancora registrato.</p>';
        lootModal.classList.add('open');
    }
    document.getElementById('menuLootBtn').onclick = () => { closeAdventureMenu(); openLootModal(); };
    document.getElementById('lootCloseBtn').onclick = () => lootModal.classList.remove('open');
    lootModal.addEventListener('click', (e) => { if (e.target === lootModal) lootModal.classList.remove('open'); });

    document.getElementById('menuSuspendBtn').onclick = () => {
        closeAdventureMenu();
        showToast('⏸ Torneo sospeso: i progressi sono salvati, potrai riprenderlo quando vuoi.');
        setTimeout(() => { window.location.href = 'tornei.html'; }, 700);
    };
    // Abbandono: richiede una conferma esplicita (nessun window.confirm nativo
    // in questo progetto, stesso stile a modale usato ovunque) perché
    // cancella per sempre Stelle e percorso fatto finora.
    document.getElementById('menuAbandonBtn').onclick = () => {
        menuOptionsList.style.display = 'none';
        menuAbandonConfirm.style.display = 'block';
    };
    document.getElementById('menuAbandonCancelBtn').onclick = () => {
        menuAbandonConfirm.style.display = 'none';
        menuOptionsList.style.display = 'flex';
    };
    document.getElementById('menuAbandonConfirmBtn').onclick = () => {
        saveState(null);
        closeAdventureMenu();
        if (window.NativeHaptics) NativeHaptics.error();
        window.location.href = 'tornei.html';
    };

    /** `quote`, se presente, è la reazione IN CARATTERE del Duellante appena affrontato (getQuote) — mostrata sotto il risultato meccanico, alla Forbidden Memories. innerHTML invece di textContent: sicuro perché entrambi i pezzi sono sempre testo generato da questo stesso script, mai input dell'utente. */
    function showToast(text, quote) {
        const toast = document.getElementById('resultToast');
        toast.innerHTML = quote ? `${text}<br><span class="toast-quote">“${quote}”</span>` : text;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), quote ? 3800 : 2600);
    }

    /** Difficoltà scelta sulla schermata iniziale, prima di "Inizia il Torneo" — richiesta esplicita dell'utente: si applica a OGNI bot del torneo (roster, semifinale/finale del Castello, Kaiba, Pegasus), nessuna eccezione. */
    let selectedTournamentDifficulty = 'Medio';

    function renderStartScreen() {
        starsBar.style.display = 'none';
        starsHint.style.display = 'none';
        // Contatore persistente (mai azzerato da Abbandona/Ricomincia — vedi
        // SaveManager.getTournamentStats): il torneo resta liberamente
        // ripetibile senza alcun limite, questo mostra solo quante volte
        // è già stato tentato/completato.
        const stats = SaveManager.getTournamentStats(TOURNAMENT_ID);
        const statsLine = stats.attempts > 0
            ? `<p style="color:var(--ink-dim); font-size:0.78rem;">🔁 Tentativi: ${stats.attempts} · 👑 Completamenti: ${stats.completions}</p>`
            : '';
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">🏝️</div>
                <h2>Il Regno dei Duellanti ti aspetta</h2>
                <p>Parti con ${STARTING_STARS} Stelle dell'Esagono. Sfida i Duellanti dell'isola puntando le tue Stelle, raccogli premi ed evita le insidie del percorso — raggiungi ${CASTLE_THRESHOLD} Stelle per tentare l'accesso al Castello di Pegasus.</p>
                ${statsLine}
                <p style="color:var(--ink-dim); font-size:0.8rem; margin-bottom:10px;">Difficoltà dei Duellanti (Kaiba e Pegasus compresi)</p>
                <div class="wager-row" id="difficultyRow" style="margin-bottom:22px;">
                    <button type="button" class="wager-btn" data-difficulty="Facile">Facile</button>
                    <button type="button" class="wager-btn" data-difficulty="Medio">Normale</button>
                    <button type="button" class="wager-btn" data-difficulty="Difficile">Difficile</button>
                </div>
                <button type="button" class="big-btn" id="startTournamentBtn">🚀 Inizia il Torneo</button>
            </div>
        `;
        const difficultyButtons = Array.from(document.querySelectorAll('#difficultyRow .wager-btn'));
        const syncDifficultyButtons = () => difficultyButtons.forEach((btn) => btn.classList.toggle('selected', btn.dataset.difficulty === selectedTournamentDifficulty));
        difficultyButtons.forEach((btn) => {
            btn.onclick = () => { selectedTournamentDifficulty = btn.dataset.difficulty; syncDifficultyButtons(); };
        });
        syncDifficultyButtons();
        document.getElementById('startTournamentBtn').onclick = async () => {
            const state = makeInitialState(selectedTournamentDifficulty);
            saveState(state);
            SaveManager.incrementTournamentStat(TOURNAMENT_ID, 'attempts');
            if (window.NativeHaptics) NativeHaptics.light();
            // Prologo PRIMA della mappa: `mostraUnaVolta` marca subito la
            // scena nello stato, quindi un reload a metà non la ripete.
            await TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'prologue', state, saveState);
            render();
        };
    }

    function renderEliminated() {
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">💀</div>
                <h2>Eliminato dal Torneo</h2>
                <p>Hai perso tutte le tue Stelle dell'Esagono: la tua avventura nel Regno dei Duellanti finisce qui, per questa volta.</p>
                <button type="button" class="big-btn" id="restartTournamentBtn">🔄 Ricomincia</button>
            </div>
        `;
        document.getElementById('restartTournamentBtn').onclick = () => {
            saveState(null);
            render();
        };
    }

    // Metadati di presentazione per ciascuna tappa del Castello — solo
    // testo/icone, la logica vera (avversario, ricompensa) vive in
    // resolvePendingEncounterIfDone/enterCastleBracket qui sopra.
    const CASTLE_STAGE_META = {
        semifinal: { icon: '🥊', title: 'Semifinale', reward: '10-15' },
        final: { icon: '🏆', title: 'Finale', reward: '10-15' },
        pegasus: { icon: '🏰', title: 'Il Duello Finale', reward: '15' }
    };

    // Unico stato del Castello ancora renderizzato come schermata a
    // sé stante: semifinale/finale/Pegasus passano invece dalla mappa a
    // nodi (vedi ensureCastleChallengeRoute + il ramo castleReached di
    // render()) esattamente come un bivio sull'isola aperta.
    function renderCastleStage(state) {
        starsHint.style.display = 'none';
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">👑</div>
                <h2>Campione del Regno dei Duellanti!</h2>
                <p>Hai sconfitto Maximillion Pegasus in persona e incassato il montepremi dell'isola.</p>
                ${window.Rewards ? Rewards.summaryHtml(state.rewards, 'Premio del torneo') : ''}
                <div class="modal-actions" style="margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                    <button type="button" class="big-btn secondary" id="backToMenuBtn">Torna al menu</button>
                    <button type="button" class="big-btn" id="playAgainBtn">🔄 Gioca ancora</button>
                </div>
            </div>
        `;
        document.getElementById('backToMenuBtn').onclick = () => { window.location.href = 'index.html'; };
        // Rigiocare dopo aver VINTO passava dal menu ☰ e da "Abbandona
        // torneo" — un'etichetta che non ha senso per chi ha appena
        // conquistato il titolo (segnalato dall'utente). Qui l'azzeramento
        // è lo stesso, ma senza conferma: a torneo finito non c'è più
        // alcun progresso da perdere.
        document.getElementById('playAgainBtn').onclick = () => {
            saveState(null);
            render();
        };
    }

    /**
     * Schermata generica "sfida X" — oggi usata solo dal Cancello di
     * Kaiba (renderKaibaGateEncounter più sotto): l'incontro apre con
     * una battuta in carattere del Duellante (getQuote), alla Forbidden
     * Memories. Le tappe del Castello (semifinale/finale/Pegasus) la
     * usavano anch'esse fino a quando sono passate alla mappa a nodi
     * (vedi il commento su renderCastleStage) — la firma
     * `encounterOverride` esiste apposta per il Cancello, che ha un
     * incontro già pronto (wager pieno, isKaibaGate) invece di farselo
     * costruire.
     */
    function renderCastleChallenge(state, opponentId, meta, encounterOverride) {
        const character = getRosterCharacter(opponentId);
        const quote = getQuote(opponentId, 'intro');
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">${meta.icon}</div>
                <h2>${meta.title}: ${character ? character.name : 'Duellante'}</h2>
                ${quote ? `<p class="opponent-quote">${quote}</p>` : ''}
                <p>${meta.intro}<br><br>In palio: <strong>${meta.rewardText}</strong>.</p>
                <button type="button" class="big-btn" id="castleChallengeBtn">⚔️ Sfida!</button>
            </div>
        `;
        document.getElementById('castleChallengeBtn').onclick = () => {
            state.pendingEncounter = encounterOverride || { characterId: opponentId, wager: 0, isKaibaGate: false, castleStage: state.castleStage };
            state.atKaibaGate = false;
            saveState(state);
            launchDuel(state.pendingEncounter);
        };
    }

    /** Il Cancello del Castello: Kaiba si frappone tra il giocatore e l'ingresso, puntando TUTTE le Stelle accumulate finora — stessa schermata "sfida X" delle tappe del Castello, solo con l'encounter già pronto (wager pieno, isKaibaGate). */
    function renderKaibaGateEncounter(state) {
        starsHint.style.display = 'none';
        const wager = currentStars();
        renderCastleChallenge(state, 'kaiba', {
            icon: '🚪',
            title: 'Il Cancello del Castello',
            intro: 'Prima di poterti presentare al Castello di Pegasus, Seto Kaiba in persona ti sbarra la strada.',
            rewardText: `tutte le tue ${wager} Stelle — vittoria o sconfitta`
        }, { characterId: 'kaiba', wager: wager, isKaibaGate: true });
    }

    /** Un pendingEncounter esiste ma non è arrivato nessun esito di duello fresco per lui: probabilmente la pagina è stata ricaricata/l'app chiusa a metà duello. */
    function renderResumeEncounter(state) {
        const enc = state.pendingEncounter;
        const character = getRosterCharacter(enc.characterId);
        const stakeText = enc.castleStage ? 'una sfida ad eliminazione diretta' : `${enc.wager} Stelle in palio`;
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">⚔️</div>
                <h2>Duello in sospeso</h2>
                <p>Avevi una sfida in corso contro ${character ? character.name : 'un Duellante'} (${stakeText}). Riprendila per continuare.</p>
                <button type="button" class="big-btn" id="resumeDuelBtn">Riprendi la sfida</button>
            </div>
        `;
        document.getElementById('resumeDuelBtn').onclick = () => launchDuel(enc);
    }

    // ----------------------------------------------------------------
    // Mappa a nodi collegati — sostituisce le vecchie "card" di
    // percorso: il sentiero già fatto (state.history) resta visibile
    // come pallini collegati da linee, con i nuovi 2-3 (o 4 col
    // Castello) percorsi possibili che si diramano dal pallino "sei
    // qui" attuale. Coordinate in PIXEL VERI su un "mondo" (.map-canvas)
    // ben più grande dello schermo, non più unità scalate dall'SVG alla
    // larghezza del contenitore: serve per poter scorrere liberamente in
    // ogni direzione (richiesta esplicita dell'utente). Ogni posizione è
    // CASUALE ma calcolata UNA SOLA VOLTA (in pushHistoryNode/
    // assignChoicePositions) e persistita dentro state.history/
    // state.pendingRoutes — mai ricalcolata da una formula fissa ad ogni
    // render: "ogni torneo a nodi diversi", ma una volta disegnati un
    // nodo e le sue linee restano sempre agli stessi punti per tutta la
    // durata di QUEL torneo.
    //
    // ASSE PRIMARIO ORIZZONTALE (richiesta esplicita dell'utente: "inizia
    // da sinistra... i nodi vanno in orizzontale da sinistra a destra"):
    // X cresce ad ogni tappa (il mondo si allarga verso destra man mano
    // che si avanza, MAI verso il basso come nella versione precedente),
    // Y è l'asse "organico" secondario (un vagare casuale su e giù dentro
    // una fascia di altezza FISSA — MAP_WORLD_HEIGHT non cresce mai — che
    // dà l'idea di un sentiero disegnato a mano invece di una riga dritta).
    // Più bivi contemporanei (2-4 scelte) si dispongono impilati in
    // VERTICALE, non più affiancati in orizzontale: sono scelte alla
    // STESSA distanza dal via, proprio come diramazioni parallele di un
    // sentiero prima che si ricongiunga.
    // ----------------------------------------------------------------
    const MAP_WORLD_HEIGHT = 640;
    // Zona morta in alto (sotto l'HUD flottante fisso + il banner
    // "Raccogli 10 Stelle...") e in basso, entro cui un pallino (e la sua
    // etichetta) non deve mai finire — la mappa è a tutto schermo (vedi
    // .main.map-mode), quello spazio non esiste più "gratis" sopra un
    // contenitore con bordo come prima.
    const MAP_TOP_PADDING = 150;
    const MAP_BOTTOM_PADDING = 80;
    const MAP_START_X = 130;
    // Distanza orizzontale "di base" tra una tappa del sentiero e la
    // successiva/tra "sei qui" e un nuovo bivio — con un po' di variazione
    // casuale propria (vedi pushHistoryNode) così i passi non sono tutti
    // identici.
    // Jitter ampio apposta (richiesta esplicita: "distanza casuale ma non
    // esagerata per tutta la mappa") — prima erano solo ±35/appena
    // percettibili su una base di 230 (~15%), rendendo il passo quasi
    // sempre identico; ora la distanza reale tra una tappa e la successiva
    // varia genuinamente (160-300px, ~±30%) invece di un lieve wobble
    // attorno a un valore fisso.
    const MAP_NODE_SPACING_X = 230;
    const MAP_NODE_SPACING_X_JITTER = 70;
    const MAP_CHOICE_SPACING_X = 230;
    const MAP_CHOICE_SPACING_X_JITTER = 65;
    // Quanto un pallino del sentiero può vagare in verticale rispetto al
    // precedente — il "su e giù" casuale che rende il sentiero organico
    // invece di una riga dritta, e la disposizione diversa ad ogni
    // torneo, non solo il tipo degli incontri.
    const MAP_NODE_Y_DRIFT = 95;
    const ICON_FOR_KIND = { win: '⚔️', lose: '💀', prize: '🎁', malus: '⚠️', start: '🏝️' };
    const MAP_START_POS = { x: MAP_START_X, y: MAP_WORLD_HEIGHT / 2 };

    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    function clampMapY(y) { return Math.max(MAP_TOP_PADDING, Math.min(MAP_WORLD_HEIGHT - MAP_BOTTOM_PADDING, y)); }

    /** Posizione dell'ultimo pallino del sentiero (l'ultima tappa risolta, o il punto di partenza se il torneo è appena iniziato) — punto di partenza per posizionare la prossima tappa/i prossimi bivi. */
    function lastNodePosition(state) {
        if (state.history.length === 0) return MAP_START_POS;
        const last = state.history[state.history.length - 1];
        return { x: last.x, y: last.y };
    }

    /** Aggiunge una tappa al sentiero (state.history) con una posizione CASUALE calcolata una sola volta qui — mai più ricalcolata nei render successivi. X avanza sempre verso destra (asse primario, vedi il commento sopra); Y vaga casualmente dentro la fascia fissa del mondo. Usare SEMPRE questa, mai un push diretto su state.history, per ogni nuova tappa risolta (premio/insidia/vittoria/sconfitta). */
    // `pos` (facoltativo) è il punto del bivio che il giocatore ha scelto:
    // la tappa nasce LÌ, così il sentiero passa davvero dal nodo cliccato.
    // Prima nasceva a caso accanto, e con i vicoli cieci (che restano
    // disegnati sui punti delle scelte scartate) il cammino vero finiva
    // sopra a quelli chiusi.
    function pushHistoryNode(state, kind, label, pos) {
        const from = lastNodePosition(state);
        const haPos = pos && typeof pos.x === 'number' && typeof pos.y === 'number';
        state.history.push({
            step: state.step,
            kind: kind,
            label: label,
            x: haPos ? pos.x : from.x + MAP_NODE_SPACING_X + randomBetween(-MAP_NODE_SPACING_X_JITTER, MAP_NODE_SPACING_X_JITTER),
            y: haPos ? pos.y : clampMapY(from.y + randomBetween(-MAP_NODE_Y_DRIFT, MAP_NODE_Y_DRIFT))
        });
    }

    /**
     * Assegna a ogni nuovo bivio (`routes`, appena generato da
     * generateRoutes) una posizione CASUALE ma persistente, sparsa
     * attorno al pallino "sei qui" attuale — non più un ventaglio
     * perfettamente equidistante ricalcolato ad ogni render. A
     * differenza di pushHistoryNode (dove X è l'asse di avanzamento),
     * più bivi CONTEMPORANEI sono scelte alla STESSA distanza dal via:
     * si impilano in VERTICALE (Y), non affiancati in orizzontale.
     *
     * L'ancora del ventaglio (`anchorY`) è il pallino "sei qui" stesso,
     * ma RICENTRATA quanto basta da lasciare spazio per l'intero
     * ventaglio dentro la fascia fissa del mondo — non ogni singolo
     * punto clampato per conto suo: dopo molte tappe un sentiero casuale
     * può arrivare vicino a un bordo, e clampare ogni bivio
     * SEPARATAMENTE lì li farebbe collassare tutti sullo stesso valore
     * limite (bug reale trovato e corretto in una sessione precedente,
     * quando il ventaglio era ancora orizzontale — stesso principio, ora
     * sull'asse verticale). Il jitter finale resta piccolo apposta
     * (±20, contro uno `step` sempre più largo) per non reintrodurre lo
     * stesso rischio.
     */
    function assignChoicePositions(state, routes) {
        const from = lastNodePosition(state);
        const baseX = from.x + MAP_CHOICE_SPACING_X + randomBetween(-MAP_CHOICE_SPACING_X_JITTER, MAP_CHOICE_SPACING_X_JITTER);
        const n = routes.length;
        const usableHeight = MAP_WORLD_HEIGHT - MAP_TOP_PADDING - MAP_BOTTOM_PADDING;
        const totalSpread = Math.min(usableHeight, n <= 2 ? 170 : 320);
        const step = n > 1 ? totalSpread / (n - 1) : 0;
        const halfSpread = totalSpread / 2;
        const anchorY = Math.max(MAP_TOP_PADDING + halfSpread, Math.min(MAP_WORLD_HEIGHT - MAP_BOTTOM_PADDING - halfSpread, from.y));
        routes.forEach((route, i) => {
            const evenY = anchorY + (i - (n - 1) / 2) * step;
            route.x = baseX + randomBetween(-25, 25);
            route.y = clampMapY(evenY + randomBetween(-20, 20));
        });
        // I vicoli ciechi già scoperti restano disegnati dove stavano le
        // scelte di un bivio precedente, quindi un bivio nuovo può nascere
        // proprio sopra uno di loro (visto succedere). Il ventaglio intero
        // scivola a destra finché nessuna scelta tocca più un vicolo: tutto
        // insieme, così resta un ventaglio ordinato.
        const ostacoli = [];
        (state.closedBranches || []).forEach((b) => b.nodes.forEach((p) => ostacoli.push(p)));
        const tocca = () => routes.some((r) => ostacoli.some((p) => Math.hypot(r.x - p.x, r.y - p.y) < 90));
        for (let tentativi = 0; tentativi < 6 && tocca(); tentativi++) {
            routes.forEach((r) => { r.x += 80; });
        }
    }

    /**
     * Trascinamento col MOUSE per scorrere la mappa in ogni direzione
     * (richiesta esplicita: "desktop con il mouse, da app con il touch")
     * — il touch usa lo scroll nativo del browser (già bidirezionale
     * grazie a `overflow: auto` su .map-viewport, nessun JS necessario),
     * qui si aggiunge solo il drag-to-pan per chi non ha un touchscreen.
     * `pointerType !== 'mouse'` esclude il touch di proposito: lo scroll
     * nativo lì è già corretto, aggiungere anche questo trascinamento
     * andrebbe in conflitto con l'inerzia nativa del browser (jank).
     * Il piccolo controllo su `moved` impedisce che un trascinamento reale
     * finisca per attivare per errore il pallino sotto il puntatore al
     * rilascio (un click vero, senza spostamento, resta un click normale).
     */
    function setupMapDragPan(viewport) {
        let dragging = false;
        let moved = false;
        let startX = 0, startY = 0, startLeft = 0, startTop = 0;
        viewport.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            dragging = true;
            moved = false;
            startX = e.clientX; startY = e.clientY;
            startLeft = viewport.scrollLeft; startTop = viewport.scrollTop;
        });
        viewport.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                moved = true;
                viewport.classList.add('dragging');
            }
            viewport.scrollLeft = startLeft - dx;
            viewport.scrollTop = startTop - dy;
        });
        const endDrag = () => { dragging = false; viewport.classList.remove('dragging'); };
        viewport.addEventListener('pointerup', endDrag);
        viewport.addEventListener('pointerleave', endDrag);
        // Fase di CAPTURE: intercetta il click prima che arrivi al pallino
        // sotto il puntatore, ma solo se c'è stato un vero trascinamento.
        viewport.addEventListener('click', (e) => {
            if (moved) { e.stopPropagation(); moved = false; }
        }, true);
    }

    function renderMap(state) {
        // Unica vera schermata "di gioco" del torneo: a tutto schermo,
        // niente più contenitore con bordo — vedi il commento su
        // .main.map-mode più sopra.
        mainEl.classList.add('map-mode');
        document.body.classList.add('map-active');
        // DENTRO IL CASTELLO IL MONDO CAMBIA: fuori si esplora il bosco
        // dell'isola, dal Cancello in poi si è nelle sale di Pegasus, e la
        // mappa deve dirlo da sé senza bisogno di una scritta. Un
        // attributo sul <body> invece che una classe sul canvas, così a
        // cambiare è anche il fondo della pagina dietro di essa e non
        // resta una cornice di bosco attorno al castello.
        document.body.dataset.luogo = state.castleStage ? 'castello' : 'isola';
        // Il promemoria delle Stelle serve solo FINCHÉ si deve entrare:
        // dentro il Castello si è già passati dal Cancello, e continuare a
        // dire "raccogli 10 Stelle per accedere" mentre si sta giocando la
        // semifinale è una riga che contraddice lo schermo.
        starsHint.style.display = (state.castleStage || currentStars() >= CASTLE_THRESHOLD) ? 'none' : 'block';

        // Il Castello è una seconda mappa, non la continuazione grafica
        // dell'isola: nessun approdo, nessun nodo già percorso e nessun
        // "sei qui". Si vede esclusivamente lo sfidante attuale.
        const castleOnly = !!state.castleReached;
        const history = castleOnly
            ? (state.castleHistory || [])
            : [Object.assign({ kind: 'start', label: "L'approdo sull'isola" }, MAP_START_POS)].concat(state.history);
        // Dentro un vicolo cieco il "sei qui" è il nodo del vicolo, e
        // l'unica scelta è il tratto successivo (se il vicolo è lungo 2);
        // le altre strade del bivio aspettano, nascoste, il ritorno.
        const corridor = (!castleOnly && state.corridor) ? state.corridor : null;
        const junction = history[history.length - 1];
        const current = castleOnly ? MAP_START_POS
            : corridor ? corridor.nodes[corridor.at]
            : junction;
        const choices = corridor
            ? ((!corridor.finito && corridor.at < corridor.nodes.length - 1)
                ? [Object.assign({ kind: 'corridorStep' }, corridor.nodes[corridor.at + 1])]
                : [])
            : (state.pendingRoutes || []);
        const closedBranches = castleOnly ? [] : (state.closedBranches || []);
        // Larghezza dinamica (cresce verso DESTRA man mano che si avanza,
        // come cresceva verso il basso nella versione a scorrimento
        // verticale) — l'altezza invece è SEMPRE MAP_WORLD_HEIGHT, una
        // fascia fissa entro cui il sentiero vaga in verticale.
        const rightmostX = closedBranches.reduce((max, b) => b.nodes.reduce((m, n) => Math.max(m, n.x), max),
            choices.reduce((max, c) => Math.max(max, c.x), corridor ? Math.max(...corridor.nodes.map((n) => n.x)) : current.x));
        const contentWidth = rightmostX + MAP_CHOICE_SPACING_X;
        const contentHeight = MAP_WORLD_HEIGHT;
        // Il canvas deve riempire SEMPRE almeno l'intero .map-viewport
        // (100vw/100dvh in map-mode), anche quando il sentiero generato dai
        // nodi è più piccolo dello schermo (monitor desktop ampi) — bug
        // reale corretto qui: un tentativo precedente forzava questa
        // stessa cosa via CSS (min-width/min-height:100% su .map-canvas)
        // lasciando però l'inline width/height (quindi il viewBox dell'SVG
        // sottostante) alla sola contentWidth/Height più piccola — l'SVG
        // veniva così "stirato" dal browser per riempire il canvas
        // ingrandito dal CSS, MA i nodi HTML (posizionati in px assoluti,
        // MAI ridimensionati) restavano nelle coordinate originali: risultato,
        // le linee (che vivono nel sistema di coordinate stirato dell'SVG)
        // finivano visibilmente sfasate rispetto ai pallini (segnalato
        // dall'utente: "i nodi e le linee sono sfasate"). Calcolare QUI la
        // dimensione finale e usarla identica per canvas E viewBox elimina
        // il problema alla radice: 1 unità SVG = 1px CSS reale, sempre.
        const canvasWidth = Math.max(contentWidth, window.innerWidth);
        const canvasHeight = Math.max(contentHeight, window.innerHeight);

        content.innerHTML = `
            <div class="map-viewport" id="mapViewport">
                <div class="map-canvas" id="mapCanvas" style="width:${canvasWidth}px; height:${canvasHeight}px;">
                    <svg class="map-lines" viewBox="0 0 ${canvasWidth} ${canvasHeight}" preserveAspectRatio="none"></svg>
                </div>
            </div>
            ${castleOnly ? '' : '<div class="map-legend"><span><b>⚔️ Duello</b> sfidante già noto</span><span><b>❔ Ignoto</b> premio, insidia o vicolo cieco</span></div>'}
        `;
        const canvas = document.getElementById('mapCanvas');
        const svg = canvas.querySelector('svg');

        function addLine(a, b, extraClass, opts) {
            opts = opts || {};
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
            line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
            line.setAttribute('class', 'map-line' + (extraClass ? ' ' + extraClass : '') + (opts.appear ? ' map-line-appear' : ''));
            if (opts.appear && opts.delay) line.style.animationDelay = opts.delay + 's';
            if (typeof opts.routeIndex === 'number') line.dataset.routeIndex = String(opts.routeIndex);
            svg.appendChild(line);
            return line;
        }
        function addNode(pos, kind, opts) {
            opts = opts || {};
            const el = document.createElement(opts.onClick ? 'button' : 'div');
            if (opts.onClick) el.type = 'button';
            el.className = 'map-node ' + kind + (opts.extraClass ? ' ' + opts.extraClass : '') + (opts.appear ? ' map-node-appear' : '');
            if (opts.appear && opts.delay) el.style.animationDelay = opts.delay + 's';
            if (typeof opts.routeIndex === 'number') el.dataset.routeIndex = String(opts.routeIndex);
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
            el.innerHTML = `<span class="map-node-dot">${opts.icon || '?'}</span><span class="map-node-label">${opts.label || ''}</span>`;
            // Ritratto dello sfidante dentro il pallino: l'icona resta
            // sotto come ripiego finché l'immagine non è caricata (o se non
            // esiste), così un file mancante non lascia un buco.
            if (opts.image) {
                const dot = el.querySelector('.map-node-dot');
                const img = document.createElement('img');
                img.alt = '';
                img.onload = () => dot.classList.add('has-image');
                img.onerror = () => img.remove();
                img.src = opts.image;
                dot.appendChild(img);
            }
            if (opts.tag) {
                const tag = document.createElement('span');
                tag.className = 'map-node-tag';
                tag.textContent = opts.tag;
                el.insertBefore(tag, el.querySelector('.map-node-label'));
            }
            if (opts.onClick) el.onclick = opts.onClick;
            canvas.appendChild(el);
            return el;
        }

        // Linee: dal via ad ogni pallino del sentiero, poi dal pallino
        // "sei qui" a CIASCUna delle nuove scelte (bivio) — queste ultime
        // in dissolvenza SOLO se il bivio è appena stato generato ora
        // (justGeneratedRoutes), mai ai render successivi in cui le stesse
        // scelte restano semplicemente in attesa (altrimenti "riapparirebbero"
        // ogni volta che si torna sulla mappa, es. da un duello concluso).
        // Vicoli ciechi già scoperti: grigi, sotto a tutto il resto.
        closedBranches.forEach((b) => {
            let prima = b.from;
            b.nodes.forEach((n) => { addLine(prima, n, 'dead-line'); prima = n; });
        });
        for (let i = 0; i < history.length - 1; i++) addLine(history[i], history[i + 1], 'path-line');
        // Il vicolo in cui si è entrati: dal bivio fino al nodo raggiunto.
        if (corridor) {
            let prima = junction;
            corridor.nodes.slice(0, corridor.at + 1).forEach((n) => { addLine(prima, n, corridor.finito ? 'dead-line' : 'path-line'); prima = n; });
        }
        if (!castleOnly || history.length > 0) {
            choices.forEach((route, index) => addLine(current, route, 'choice-line' + (route.closed ? ' dead-line' : ''), { appear: justGeneratedRoutes, delay: index * 0.08, routeIndex: index }));
        }

        closedBranches.forEach((b) => {
            b.nodes.forEach((n, i) => {
                const fine = i === b.nodes.length - 1;
                addNode(n, 'dead' + (fine ? '' : ' dead-step'), { icon: fine ? '🚧' : '•', label: fine ? 'Vicolo cieco' : '' });
            });
        });

        // Sentiero già fatto (start + tappe risolte) — una volta
        // disegnato, resta sempre visibile scorrendo la mappa: le
        // posizioni vengono da state.history, mai ricalcolate. Il pallino
        // "sei qui" fa sempre un piccolo "pop" di comparsa (si è appena
        // arrivati lì, ad ogni render reale di questa funzione — mai per un
        // semplice scroll/trascinamento, che non richiama mai renderMap).
        history.forEach((node, i) => {
            const isCurrent = !castleOnly && !corridor && i === history.length - 1;
            addNode(node, isCurrent ? 'current' : node.kind, {
                icon: ICON_FOR_KIND[node.kind] || '•',
                label: castleOnly ? (node.label || '') : (isCurrent ? 'Sei qui' : (i === history.length - 1 ? 'Bivio' : '')),
                appear: isCurrent
            });
        });
        if (corridor) {
            corridor.nodes.slice(0, corridor.at).forEach((n) => addNode(n, 'dead-step', { icon: '•' }));
            addNode(corridor.nodes[corridor.at], 'current' + (corridor.finito ? ' dead-here' : ''), {
                icon: corridor.finito ? '🚧' : '🌿',
                label: corridor.finito ? 'Vicolo cieco' : 'Sei qui',
                appear: true
            });
        }

        // Bivio: i percorsi ancora da scegliere, "a sorpresa" finché non
        // si sceglie (stesso spirito del vecchio Sentiero 1/2/3) — tranne
        // il Castello, sempre riconoscibile perché è una destinazione
        // precisa, non un incontro casuale.
        // Cosa si vede PRIMA di scegliere (richiesta dell'utente): un duello
        // si riconosce, con il ritratto e il nome dello sfidante; tutto il
        // resto è "ignoto" e può essere un premio, un'insidia o un vicolo
        // cieco — è lì che resta la sorpresa.
        choices.forEach((route, index) => {
            const isCastle = route.kind === 'castle';
            const isCastleChallenge = route.kind === 'castleChallenge';
            let label = 'Ignoto';
            let icon = '❔';
            let extraClass = 'mystery';
            let image = null;
            let tag = null;
            let onClick = () => chooseRoute(state, index);
            if (route.kind === 'corridorStep') {
                label = 'Il sentiero prosegue';
                onClick = () => advanceCorridor(state);
            } else if (route.closed) {
                // Senza etichetta: la scritta "Vicolo cieco" la porta il
                // fondo del vicolo (closedBranches), che per un vicolo
                // lungo 1 cade proprio qui sotto — due scritte uguali
                // sarebbero solo rumore.
                icon = '🚧';
                label = '';
                extraClass = 'closed';
                onClick = null;
            } else if (route.kind === 'opponent') {
                const sfidante = getRosterCharacter(route.characterId);
                icon = '⚔️';
                label = sfidante ? sfidante.name : 'Duellante';
                tag = 'Duello';
                extraClass = 'duel';
                image = sfidante ? getCharacterImageFor(sfidante.id, 'duelistKingdom') : null;
            } else if (isCastle) {
                icon = '🏰';
                label = 'Castello di Pegasus';
                extraClass = 'castle';
            } else if (isCastleChallenge) {
                const meta = CASTLE_STAGE_META[route.castleStage] || CASTLE_STAGE_META.semifinal;
                const opponent = getRosterCharacter(route.characterId);
                icon = meta.icon;
                label = opponent ? opponent.name : meta.title;
                tag = meta.title;
                extraClass = 'castle duel';
                image = opponent ? getCharacterImageFor(opponent.id, 'duelistKingdom') : null;
            }
            addNode(route, 'choice', {
                extraClass,
                icon,
                label,
                image,
                tag,
                onClick,
                appear: justGeneratedRoutes,
                delay: index * 0.08 + 0.1,
                routeIndex: index
            });
        });
        // Consumato: da qui in poi (fino alla prossima generateRoutes) i
        // render successivi con QUESTO STESSO bivio non lo animano più.
        justGeneratedRoutes = false;

        const viewport = document.getElementById('mapViewport');
        setupMapDragPan(viewport);
        // Centra la vista sul pallino "sei qui" (sia in orizzontale che in
        // verticale) SOLO come punto di partenza — la mappa resta comunque
        // liberamente scorribile in ogni direzione dopo, per rivedere il
        // sentiero già fatto (tornando verso sinistra) o sbirciare il
        // Castello quando è già visibile più a destra.
        // requestAnimationFrame: al momento di questa chiamata il canvas è
        // appena stato inserito nel DOM, il browser non ha ancora calcolato
        // scrollWidth/clientHeight per il nuovo contenuto.
        requestAnimationFrame(() => {
            // Fuori dal Castello si centra a metà fra "sei qui" e il bivio:
            // su un telefono, centrando solo "sei qui", gli sfidanti a
            // destra finivano fuori schermo proprio quando vanno scelti.
            const mediaScelte = choices.length ? choices.reduce((s, c) => s + c.x, 0) / choices.length : current.x;
            const focus = castleOnly && choices[0] ? choices[0]
                : { x: (current.x + mediaScelte) / 2, y: current.y };
            viewport.scrollLeft = Math.max(0, focus.x - viewport.clientWidth / 2);
            viewport.scrollTop = Math.max(0, focus.y - viewport.clientHeight / 2);
        });
    }

    // Durata del "viaggio" verso il nodo scelto — deve combaciare con la
    // transition-duration di .map-traveler in CSS, altrimenti la vera
    // risoluzione (apertura del modale di puntata, ecc.) scatterebbe prima
    // che il pallino luminoso abbia finito di percorrere la linea.
    const MAP_TRAVEL_MS = 500;

    /**
     * Anima il pallino luminoso "viaggiatore" dal nodo "sei qui" fino al
     * nodo scelto lungo la linea che li collega (richiesta esplicita
     * dell'utente: "un po' di animazione... quando clicco su un nodo per
     * raggiungerlo"), sfuma via le altre scelte scartate, poi chiama
     * `onDone` — la VERA risoluzione (mutare lo stato, aprire il modale di
     * puntata, ecc.) resta interamente dentro `onDone`, invariata: questa
     * funzione è solo un intermezzo visivo prima, mai una sostituzione
     * della logica di gioco.
     */
    function animateTravelToRoute(index, onDone) {
        const canvas = document.getElementById('mapCanvas');
        const chosenEl = canvas && canvas.querySelector('.map-node[data-route-index="' + index + '"]');
        const currentEl = canvas && canvas.querySelector('.map-node.current');
        if (!canvas || !chosenEl || !currentEl) { onDone(); return; } // difensivo: mai dovrebbe mancare, ma non deve bloccare il gioco se succede
        const from = { x: parseFloat(currentEl.style.left), y: parseFloat(currentEl.style.top) };
        const to = { x: parseFloat(chosenEl.style.left), y: parseFloat(chosenEl.style.top) };

        canvas.querySelectorAll('.map-node.choice').forEach((el) => {
            if (el !== chosenEl) el.classList.add('map-node-declined');
        });
        canvas.querySelectorAll('.map-line.choice-line').forEach((line) => {
            if (line.dataset.routeIndex !== String(index)) line.classList.add('map-line-declined');
        });
        chosenEl.classList.add('map-node-chosen');

        const traveler = document.createElement('div');
        traveler.className = 'map-traveler';
        traveler.style.left = from.x + 'px';
        traveler.style.top = from.y + 'px';
        canvas.appendChild(traveler);
        // Forza un reflow prima di spostarlo: senza, il browser fonderebbe
        // la posizione iniziale e quella finale nello stesso frame, senza
        // alcuna transizione visibile (stesso principio già noto per le
        // altre animazioni "from -> to" di questo motore).
        void traveler.offsetWidth;
        traveler.style.left = to.x + 'px';
        traveler.style.top = to.y + 'px';

        setTimeout(onDone, MAP_TRAVEL_MS);
    }

    function chooseRoute(state, index) {
        const route = state.pendingRoutes[index];
        if (!route || route.closed) return;
        if (window.NativeHaptics) NativeHaptics.light();
        animateTravelToRoute(index, () => resolveChosenRoute(state, route));
    }

    // ----------------------------------------------------------------
    // VICOLI CIECHI.
    // ----------------------------------------------------------------
    // Un sentiero ignoto può non portare a nulla: si entra (1 nodo, o 2 se
    // il sentiero "prosegue"), si scopre che finisce, e si torna al bivio
    // da soli. Lo stato del cammino in corso vive in `state.corridor`
    // { routeIndex, from, nodes, at, finito }, salvato a ogni passo: una
    // pagina ricaricata riparte dallo stesso punto, e se il vicolo era già
    // stato scoperto si torna subito al bivio (render → finalizeDeadEnd).
    // Il bivio resta in `state.pendingRoutes` per tutto il tempo, e al
    // ritorno quel sentiero è chiuso per sempre (route.closed): non ci si
    // può rientrare, e le altre strade restano tutte lì.
    // I vicoli già scoperti restano disegnati (state.closedBranches),
    // grigi, come memoria di dove non andare.
    const DEAD_END_SCENES = [
        "Una frana ha sepolto il sentiero: da qui non si passa.",
        "Il sentiero finisce sul ciglio di una scogliera a picco sul mare.",
        "La boscaglia si chiude in un muro di rovi impenetrabile.",
        "Il ponte di corda che attraversava la gola è crollato da tempo."
    ];

    function enterCorridor(state, index) {
        const route = state.pendingRoutes[index];
        const from = lastNodePosition(state);
        const nodes = [{ x: route.x, y: route.y }];
        if (route.depth === 2) {
            // Il secondo tratto prosegue in avanti e si allontana dal
            // centro del bivio: così non finisce dove nasceranno i bivi
            // successivi del cammino vero.
            const versoFuori = route.y >= from.y ? 1 : -1;
            nodes.push({
                x: route.x + 175 + randomBetween(-20, 20),
                y: clampMapY(route.y + versoFuori * randomBetween(35, 75))
            });
        }
        state.corridor = { routeIndex: index, from: { x: from.x, y: from.y }, nodes: nodes, at: 0, finito: false };
        saveState(state);
        if (nodes.length === 1) { reachDeadEnd(state); return; }
        showToast('🌿 Il sentiero prosegue tra la vegetazione...');
        render();
    }

    function advanceCorridor(state) {
        if (window.NativeHaptics) NativeHaptics.light();
        animateTravelToRoute(0, () => {
            state.corridor.at++;
            saveState(state);
            reachDeadEnd(state);
        });
    }

    let deadEndAnimating = false;
    function reachDeadEnd(state) {
        state.corridor.finito = true;
        saveState(state);
        deadEndAnimating = true;
        render();
        if (window.NativeHaptics) NativeHaptics.error();
        showToast(`🚧 Vicolo cieco! ${pickRandom(DEAD_END_SCENES)} Torni al bivio.`);
        // Il ritorno parte dopo un attimo, il tempo di leggere: si
        // ripercorrono a ritroso i nodi del vicolo fino al bivio.
        const tappe = state.corridor.nodes.slice(0, state.corridor.at).reverse().concat([state.corridor.from]);
        setTimeout(() => animateWalkBack(tappe, () => finalizeDeadEnd(state)), 1400);
    }

    function finalizeDeadEnd(state) {
        deadEndAnimating = false;
        const c = state.corridor;
        if (!c) return;
        state.closedBranches = state.closedBranches || [];
        state.closedBranches.push({ from: c.from, nodes: c.nodes });
        if (state.pendingRoutes && state.pendingRoutes[c.routeIndex]) state.pendingRoutes[c.routeIndex].closed = true;
        state.corridor = null;
        saveState(state);
        render();
    }

    /** Il viaggiatore luminoso ripercorre `tappe` una dopo l'altra, partendo dal nodo "sei qui". Solo grafica: alla fine chiama `onDone`, anche se la mappa non c'è più. */
    function animateWalkBack(tappe, onDone) {
        const canvas = document.getElementById('mapCanvas');
        const currentEl = canvas && canvas.querySelector('.map-node.current');
        if (!canvas || !currentEl || tappe.length === 0) { onDone(); return; }
        const traveler = document.createElement('div');
        traveler.className = 'map-traveler';
        traveler.style.left = currentEl.style.left;
        traveler.style.top = currentEl.style.top;
        canvas.appendChild(traveler);
        let i = 0;
        const passo = () => {
            if (i >= tappe.length) { onDone(); return; }
            void traveler.offsetWidth;
            traveler.style.left = tappe[i].x + 'px';
            traveler.style.top = tappe[i].y + 'px';
