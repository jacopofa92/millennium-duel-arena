<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Copertura d'avvio (identica in ogni pagina col loader: la sorveglia guardrail-copertura-avvio). Fino a quando
     js/ui/page-loader.js -- che sta nel body e arriva dopo gli script bloccanti dell'head -- non prende il suo posto,
     lo schermo restava vuoto e i tocchi cadevano nel nulla. La toglie page-loader.js; 15 s di rete di sicurezza. -->
<style>html.avvio-in-corso::before{content:"";position:fixed;inset:0;z-index:2147483000;background:#0b0d14}html.avvio-in-corso::after{content:"";position:fixed;z-index:2147483001;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;box-sizing:border-box;border:3px solid rgba(247,215,116,.22);border-top-color:#f7d774;border-radius:50%;animation:avvio-in-corso-giro .9s linear infinite}@keyframes avvio-in-corso-giro{to{transform:rotate(360deg)}}</style>
<script>(function(){var r=document.documentElement;r.classList.add("avvio-in-corso");setTimeout(function(){r.classList.remove("avvio-in-corso")},15000)})();</script>
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->

<title>Yu-Gi-Oh! Millennium Duel Arena — Lezione sul Tag Team</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    html, body { min-height: 100%; }
    :root {
        --gold: #f7d774;
        --ink: #f3ecd9;
        --ink-dim: #b9ae92;
        --line: rgba(247, 215, 116, 0.28);
        --blu: #6cb8ff;
        --rosso: #ff8a7a;
    }
    body {
        font-family: 'Arial', sans-serif;
        color: var(--ink);
        background: #0b0d14 url('images/background/ra.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.62) 0%, rgba(6,7,12,0.76) 60%, rgba(4,5,8,0.88) 100%);
        pointer-events: none;
    }
    main {
        position: relative;
        z-index: 1;
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 22px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .tt-progresso { display: flex; gap: 6px; }
    .tt-progresso i { flex: 1; height: 4px; border-radius: 2px; background: rgba(247, 215, 116, 0.18); }
    .tt-progresso i.fatto { background: var(--gold); }
    .tt-pagina {
        padding: 20px 18px;
        border: 1px solid var(--sup-bordo);
        border-radius: 12px;
        background: var(--sup-riquadro);
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 340px;
    }
    .tt-titolo { font-family: Georgia, 'Times New Roman', serif; font-size: 1.3rem; color: var(--gold); text-wrap: balance; }
    .tt-testo { font-size: 0.98rem; line-height: 1.5; color: var(--ink); }
    .tt-testo b { color: var(--gold); font-weight: 700; }
    .tt-nota { font-size: 0.85rem; line-height: 1.45; color: var(--ink-dim); }
    /* Schema: due lati con le loro pedine (rettangoli con sigla), niente immagini. */
    .tt-schema { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
    .tt-lato { display: flex; flex-direction: column; gap: 6px; }
    .tt-vs { font-family: Georgia, serif; color: var(--gold); font-size: 1.1rem; }
    .tt-pedina {
        padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; text-align: center;
        border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
    }
    .tt-lato--noi .tt-pedina { border-color: rgba(108, 184, 255, 0.55); }
    .tt-lato--loro .tt-pedina { border-color: rgba(255, 138, 122, 0.55); }
    .tt-pedina.davanti { background: rgba(247, 215, 116, 0.16); border-color: var(--gold); font-weight: 700; }
    .tt-pedina.ko { opacity: 0.45; text-decoration: line-through; }
    .tt-pedina small { display: block; color: var(--ink-dim); font-weight: 400; margin-top: 2px; }
    .tt-azioni { display: flex; gap: 10px; margin-top: auto; }
    .tt-azioni button, .tt-azioni a {
        flex: 1; padding: 13px 14px; border-radius: 10px; font-size: 0.98rem; font-weight: 700; cursor: pointer;
        text-align: center; text-decoration: none; min-height: 46px;
        border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--ink);
    }
    .tt-azioni .primario { background: linear-gradient(180deg, #f7d774, #d8a33a); color: #2a1c05; border-color: #f7d774; }
    .tt-azioni button:disabled { opacity: 0.35; cursor: default; }
    @media (max-width: 520px) { .tt-schema { grid-template-columns: 1fr; } .tt-vs { text-align: center; } }
</style>
</head>
<body>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <main>
        <div class="tt-progresso" id="progresso"></div>
        <section class="tt-pagina" id="pagina"></section>
    </main>

<script src="js/save-manager.js"></script>
<!-- Completare la lezione conta per le Sfide "Tutorial": serve il tracker coi suoi cataloghi e le ricompense. -->
<script src="js/cloud/server-date.js"></script>
<script src="js/economy/rewards.js"></script>
<script src="js/data/challenges-db.js"></script>
<script src="js/data/missions-db.js"></script>
<script src="js/challenges/challenge-tracker.js"></script>
<script src="js/ui/challenge-banner.js"></script>
<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/emoji-tema.js"></script>
<script>document.addEventListener('DOMContentLoaded', function () { if (window.EmojiTema) EmojiTema.automatico(); });</script>
<script src="js/ui/deck-switcher.js"></script>
<script src="js/ui/topbar.js"></script>
<script src="js/ui/tab-bar.js"></script>
<script>
    PageTopbar.render('#topbarMount', { icon: 'rules', title: 'Tag Team', backHref: 'tutorial.html' });
    initAudioManager();
    Icons.hydrate();

    // Una lezione senza duello: il Tag Team si impara meglio guardando come si passa la mano che giocando una partita
    // preparata. Le regole raccontate qui sono quelle di js/modes/tag.js; i numeri di Life Point sono di js/data/tag-db.js.
    const sq = (lato, nomi, davanti, ko) => '<div class="tt-lato tt-lato--' + lato + '">' + nomi.map((n, i) =>
        '<div class="tt-pedina' + (i === davanti ? ' davanti' : '') + (ko && ko.includes(i) ? ' ko' : '') + '">' + n[0] + '<small>' + n[1] + '</small></div>').join('') + '</div>';
    const schema = (a, b) => '<div class="tt-schema">' + a + '<div class="tt-vs">VS</div>' + b + '</div>';
    const TU = [['Tu', '8000 LP'], ['Il tuo compagno', '8000 LP']];
    const LORO = [['Avversario 1', '8000 LP'], ['Avversario 2', '8000 LP']];

    const PAGINE = [
        {
            titolo: 'Due contro due, un campo alla volta',
            testo: 'Nel <b>Tag Team</b> ogni squadra ha due duellanti, ma sul tavolo ce n\'è <b>uno solo per lato</b>: chi sta davanti gioca, l\'altro aspetta in panchina con la sua mano, il suo Mazzo e il suo campo.',
            schema: schema(sq('noi', TU, 0), sq('loro', LORO, 0)),
            nota: 'Il Cimitero e le carte bandite sono invece della squadra intera: chi entra trova quello che ha lasciato il compagno.'
        },
        {
            titolo: 'I formati',
            testo: '<b>2 contro 2</b>: ognuno ha 8000 Life Point. <b>2 contro 1</b>: tu e il compagno partite con 4000 a testa contro gli 8000 dell\'avversario solo. <b>Contro un Boss</b>: la coppia affronta un Boss con 12000 Life Point. Prima del duello puoi anche scegliere un unico totale condiviso dalla squadra.',
            schema: schema(sq('noi', [['Tu', '4000 LP'], ['Compagno', '4000 LP']], 0), sq('loro', [['Avversario', '8000 LP']], 0)),
            nota: 'Il compagno è guidato dal computer; in Multiplayer puoi giocare anche con amici veri.'
        },
        {
            titolo: 'Lo scambio',
            testo: 'All\'<b>inizio del turno della tua squadra</b> entra l\'altro duellante: i turni si alternano fra voi due. Mano, Mazzo, campo e Terreno sono quelli di chi entra, e ognuno pesca nel suo turno.',
            schema: schema(sq('noi', TU, 1), sq('loro', LORO, 0)),
            nota: 'Una scena TAG! ti dice chi esce e chi entra. Con la regola "scambio su richiesta" puoi chiedere al compagno di invertire il turno: se non gli conviene, si va a turno.'
        },
        {
            titolo: 'Quando un duellante cade',
            testo: 'A <b>0 Life Point</b> un duellante è fuori (KO) e il compagno gioca da solo. Se cade nel turno dell\'avversario resta davanti fino a fine turno e incassa i colpi che restano; il compagno entra <b>all\'inizio del proprio turno</b>, con mano e Life Point intatti. La squadra perde quando sono fuori entrambi.',
            schema: schema(sq('noi', TU, 1, [0]), sq('loro', LORO, 0)),
            nota: 'Se il KO arriva nel tuo turno, finisci il turno e poi entra il compagno.'
        },
        {
            titolo: 'Il primo turno e la scelta del bersaglio',
            testo: 'Non puoi attaccare un avversario che <b>non ha ancora giocato il suo primo turno</b>. Nel 2 contro 2 chi è di turno sceglie <b>quale dei due avversari affrontare</b>; ma lo stesso non si può affrontare per più di <b>due turni di fila</b>, così l\'altro non resta intatto per sempre.',
            schema: schema(sq('noi', TU, 0), sq('loro', LORO, 1)),
            nota: 'Un duellante appena entrato in campo "ha già giocato" quando il suo turno comincia: da quel momento si può attaccare.'
        },
        {
            titolo: 'Guarda il campo del compagno',
            testo: 'Vuoi sapere cosa ha in panchina? Tocca l\'<b>icona del compagno</b> accanto al campo: vedi le sue carte in sola lettura, anche quelle coperte (è un alleato). Per l\'avversario in panchina vedi solo i dorsi e quante carte ha in mano.',
            nota: 'Tocca di nuovo l\'icona, o fuori dal riquadro, per chiuderlo. Niente di quello che vedi può essere cambiato da qui.'
        }
    ];

    let i = 0;
    const pagina = document.getElementById('pagina');
    const barra = document.getElementById('progresso');

    function disegna() {
        const p = PAGINE[i];
        const ultima = i === PAGINE.length - 1;
        barra.innerHTML = PAGINE.map((_, k) => '<i class="' + (k <= i ? 'fatto' : '') + '"></i>').join('');
        pagina.innerHTML =
            '<div class="tt-titolo">' + p.titolo + '</div>' +
            '<div class="tt-testo">' + p.testo + '</div>' + (p.schema || '') +
            (p.nota ? '<div class="tt-nota">' + p.nota + '</div>' : '') +
            '<div class="tt-azioni">' +
                '<button type="button" id="indietro"' + (i === 0 ? ' disabled' : '') + '>Indietro</button>' +
                (ultima ? '<a class="primario" id="prova" href="tag.html">Prova un Tag Team</a>'
                        : '<button type="button" class="primario" id="avanti">Avanti</button>') +
            '</div>';
        document.getElementById('indietro').addEventListener('click', () => { i = Math.max(0, i - 1); disegna(); });
        const avanti = document.getElementById('avanti');
        if (avanti) avanti.addEventListener('click', () => { i++; if (window.NativeHaptics) NativeHaptics.light(); disegna(); });
        // Arrivati all'ultima pagina la lezione è letta: si segna come le altre del menu Tutorial.
        if (ultima) {
            const gia = !!SaveManager.getTutorial().lezioni.tagRegole;
            SaveManager.setTutorial({ lezioni: { tagRegole: true } });
            // La Sfida "Tutorial" conta la lezione solo la PRIMA volta (rifarla non la fa contare ancora).
            if (!gia && window.ChallengeTracker) ChallengeTracker.recordProgress('tutorialLezione', { lezione: 'tagRegole' });
        }
    }
    disegna();
</script>
</body>
</html>
