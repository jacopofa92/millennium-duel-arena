<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima grido (temporanea)</title>
<link rel="stylesheet" href="js/ui/grido-evocazione.css">
<style>
    html, body { margin: 0; height: 100%; background: #0b0d14 url('images/fields/industriaKaibaCorp.jpg') center / cover no-repeat; font-family: system-ui, sans-serif; color: #f7d774; }
    .barra { position: fixed; left: 8px; top: 8px; z-index: 99999; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: rgba(0,0,0,.65); padding: 8px 10px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); }
    .barra select, .barra button { font: inherit; max-width: 60vw; }
    #nota { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; border-radius: 10px; background: rgba(0,0,0,.55); color: #cfc6a0; font-size: 15px; text-align: center; display: none; }
</style>
</head>
<body>
<div class="barra">
    <label>Duellante <select id="duellante"></select></label>
    <label>Grido <select id="grido"></select></label>
    <label>Lato
        <select id="lato"><option value="player">Giocatore (sinistra)</option><option value="bot">Avversario (destra)</option></select>
    </label>
    <button id="ripeti">Riparti</button>
</div>
<div id="nota">Questo duellante non ha nessun grido: l'animazione non parte.</div>
<script src="js/data/cards-data.generated.js"></script>
<script src="js/data/characters-db.js"></script>
<script src="js/data/gridi-evocazione.js"></script>
<script src="js/ui/grido-evocazione.js"></script>
<script>
    // Anteprima in ciclo della scena del grido: si sceglie il duellante e poi uno dei SUOI gridi.
    // Se il duellante non ne ha, non succede niente (come in duello: la scena non parte e l'Evocazione procede).
    const el = (id) => document.getElementById(id);
    const carta = (id) => cardDatabase.find((c) => c.id === id) || { id, name: 'Carta ' + id, attribute: 'LUCE' };
    const gridiDi = (duellante) => {
        const chiave = chiavePersonaggio(duellante.image);
        return GRIDI_EVOCAZIONE.filter((v) => v.chi.indexOf(chiave) !== -1);
    };
    const duellanti = characterDatabase.filter((c) => c && c.image);
    const selDuellante = el('duellante'); const selGrido = el('grido');
    // Prima quelli con grido (in ordine di elenco), poi gli altri.
    const conGrido = duellanti.filter((c) => gridiDi(c).length > 0);
    const senzaGrido = duellanti.filter((c) => gridiDi(c).length === 0);
    const opzione = (c, n) => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name + (n ? ' (' + n + ')' : ' (nessun grido)'); return o; };
    conGrido.forEach((c) => selDuellante.appendChild(opzione(c, gridiDi(c).length)));
    const sep = document.createElement('option'); sep.disabled = true; sep.textContent = '── senza grido ──'; selDuellante.appendChild(sep);
    senzaGrido.forEach((c) => selDuellante.appendChild(opzione(c, 0)));

    let timer = null; let prossima = 0;
    const attuale = () => duellanti.find((c) => String(c.id) === selDuellante.value);

    function riempiGridi() {
        selGrido.textContent = '';
        const d = attuale(); const gridi = d ? gridiDi(d) : [];
        if (gridi.length === 0) { selGrido.disabled = true; const o = document.createElement('option'); o.textContent = '—'; selGrido.appendChild(o); return; }
        selGrido.disabled = false;
        const tutti = document.createElement('option'); tutti.value = 'tutti'; tutti.textContent = 'Tutti, uno dopo l\'altro'; selGrido.appendChild(tutti);
        gridi.forEach((v) => { const o = document.createElement('option'); o.value = v.carta; o.textContent = carta(v.carta).name + ' — ' + v.grido; selGrido.appendChild(o); });
    }

    function lancia() {
        clearTimeout(timer);
        const old = document.getElementById('gridoEvocazione');
        if (old) { old.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); timer = setTimeout(lancia, 450); return; }
        const d = attuale(); const gridi = d ? gridiDi(d) : [];
        // Nessun grido: l'animazione non fa nulla.
        el('nota').style.display = gridi.length ? 'none' : 'block';
        if (!gridi.length) return;
        const voce = selGrido.value === 'tutti' ? gridi[prossima++ % gridi.length] : (gridi.find((v) => String(v.carta) === selGrido.value) || gridi[0]);
        const c = carta(voce.carta);
        const lato = el('lato').value;
        const io = { name: d.name, image: d.image };
        const altro = { name: 'Avversario', image: 'images/characters/mirror.jpg' };
        window.DuelSession = { player: lato === 'player' ? io : altro, opponent: lato === 'bot' ? io : altro };
        GridoEvocazione.azzera();
        GridoEvocazione.mostra(
            { posto: lato, carta: { id: c.id, name: c.name, attribute: c.attribute } },
            () => { timer = setTimeout(lancia, 1200); }
        );
    }
    selDuellante.addEventListener('change', () => { prossima = 0; riempiGridi(); lancia(); });
    selGrido.addEventListener('change', () => { prossima = 0; lancia(); });
    el('lato').addEventListener('change', lancia);
    el('ripeti').addEventListener('click', () => { prossima = 0; lancia(); });
    riempiGridi();
    lancia();
</script>
</body>
</html>
