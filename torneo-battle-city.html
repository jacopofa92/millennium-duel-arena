    // ---------------- Fase 1: la città ----------------
    /**
     * Posa la puntina del giocatore sulla sua casella e disegna un percorso
     * (linea tratteggiata che scorre + freccia) verso ognuna delle caselle
     * raggiungibili: è la risposta alla richiesta dell'utente di rendere
     * più evidente DOVE ci si può spostare. Legge tutto da `gridEl.dataset`
     * e dalla geometria reale delle caselle, quindi la si può richiamare
     * anche al ridimensionamento senza ridisegnare la città.
     */
    const riduciMovimento = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    /**
     * Il PERCORSO di un collegamento: i due capi piu' gli eventuali punti intermedi (`via`, vedi CITY_LAYOUTS), addolciti agli
     * angoli (ogni vertice interno e' il punto di controllo di una curva fra i due punti medi vicini: segue il vialetto senza
     * oscillare e senza uscirne, perche' passa SEMPRE per i capi e resta dentro il poligono dei punti). Con due soli punti e'
     * una retta. Strade, frecce, orme e camminata della pedina leggono tutti da qui, quindi coincidono.
     * Torna { d (path SVG), punto(t) (t in 0..1 per LUNGHEZZA), angolo(t) in gradi }.
     */
    function percorsoSmusso(pts) {
        const mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
        const quad = [];   // { a, c, b }
        if (pts.length === 2) {
            quad.push({ a: pts[0], c: mid(pts[0], pts[1]), b: pts[1] });
        } else {
            let inizio = pts[0];
            for (let i = 1; i < pts.length - 1; i++) {
                const fine = i === pts.length - 2 ? pts[pts.length - 1] : mid(pts[i], pts[i + 1]);
                quad.push({ a: inizio, c: pts[i], b: fine });
                inizio = fine;
            }
        }
        let d = `M${quad[0].a.x.toFixed(1)} ${quad[0].a.y.toFixed(1)}`;
        const tabella = [{ p: quad[0].a, s: 0 }];
        let totale = 0;
        quad.forEach((q) => {
            d += ` Q${q.c.x.toFixed(1)} ${q.c.y.toFixed(1)} ${q.b.x.toFixed(1)} ${q.b.y.toFixed(1)}`;
            for (let k = 1; k <= 12; k++) {
                const t = k / 12, u = 1 - t;
                const p = { x: u * u * q.a.x + 2 * u * t * q.c.x + t * t * q.b.x, y: u * u * q.a.y + 2 * u * t * q.c.y + t * t * q.b.y };
                const prec = tabella[tabella.length - 1].p;
                totale += Math.hypot(p.x - prec.x, p.y - prec.y);
                tabella.push({ p: p, s: totale });
            }
        });
        const punto = (t) => {
            const s = Math.max(0, Math.min(1, t)) * totale;
            let i = 1;
            while (i < tabella.length - 1 && tabella[i].s < s) i++;
            const a = tabella[i - 1], b = tabella[i];
            const k = b.s > a.s ? (s - a.s) / (b.s - a.s) : 0;
            return { x: a.p.x + (b.p.x - a.p.x) * k, y: a.p.y + (b.p.y - a.p.y) * k };
        };
        const angolo = (t) => {
            const p = punto(Math.max(0, t - 0.02)), q = punto(Math.min(1, t + 0.02));
            return Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
        };
        return { d: d, punto: punto, angolo: angolo, lunghezza: totale };
    }
    /** Orme a coppie lungo un percorso, girate nel verso del cammino (SVG come testo). */
    function ormeLungoPercorso(perc, passo) {
        const N = 40;
        let out = '', prossimo = passo * 0.6, fatto = 0, lato = 1, q = perc.punto(0);
        for (let i = 1; i <= N; i++) {
            const p = perc.punto(i / N);
            const seg = Math.hypot(p.x - q.x, p.y - q.y) || 1;
            while (prossimo <= fatto + seg) {
                const k = (prossimo - fatto) / seg;
                const x = q.x + (p.x - q.x) * k, y = q.y + (p.y - q.y) * k;
                const ang = Math.atan2(p.y - q.y, p.x - q.x);
                const cx = x - Math.sin(ang) * 3.4 * lato, cy = y + Math.cos(ang) * 3.4 * lato;
                out += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="1.9" ry="3" transform="rotate(${(ang * 180 / Math.PI + 90).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`;
                lato = -lato;
                prossimo += passo;
            }
            fatto += seg;
            q = p;
        }
        return out;
    }

    /**
     * La pedina CAMMINA da `da` a `a` lungo il percorso (un fotogramma alla volta; `via` = punti intermedi della strada), con un
     * po' di polvere ai piedi e il verso (sinistra/destra) che segue la direzione. Solo grafica: se la griglia sparisce o parte
     * un'altra camminata si ferma da sola. All'arrivo la posizione e' esattamente quella finale. Con "riduci movimento" si
     * sposta e basta.
     */
    function camminaPedina(gridEl, token, da, a, via) {
        const id = (token._camminata = (token._camminata || 0) + 1);
        const perc = percorsoSmusso([da].concat(via || [], [a]));
        const dist = perc.lunghezza;
        const metti = (p) => { token.style.left = `${p.x}px`; token.style.top = `${p.y}px`; };
        if (riduciMovimento() || dist < 2) { token.classList.remove('cammina'); metti(a); return; }
        const durata = Math.max(380, Math.min(900, dist * 3.2));
        token.classList.add('cammina');
        let inizio = null, ultimaPolvere = 0;
        const facile = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
        let xPrima = da.x;
        const passo = (ora) => {
            if (token._camminata !== id) return;
            if (!gridEl.isConnected) return;
            if (inizio === null) inizio = ora;
            const t = Math.min(1, (ora - inizio) / durata);
            const p = perc.punto(facile(t));
            if (Math.abs(p.x - xPrima) > 0.5) { token.classList.toggle('verso-sinistra', p.x < xPrima); xPrima = p.x; }
            metti(p);
            if (ora - ultimaPolvere > 90 && t < 1) {
                ultimaPolvere = ora;
                const pv = document.createElement('i');
                pv.className = 'city-polvere';
                pv.style.left = `${p.x + (Math.random() - 0.5) * 12}px`;
                pv.style.top = `${p.y}px`;
                gridEl.appendChild(pv);
                pv.addEventListener('animationend', () => pv.remove());
            }
            if (t < 1) requestAnimationFrame(passo);
            else { metti(a); token.classList.remove('cammina'); }
        };
        requestAnimationFrame(passo);
    }

    function layoutCityOverlay(gridEl) {
        if (!gridEl || !gridEl.isConnected) return;
        const token = gridEl.querySelector('.city-player-token');
        const routes = gridEl.querySelector('.city-routes');
        const playerCell = gridEl.querySelector(`.city-cell[data-index="${gridEl.dataset.player}"]`);
        if (!token || !routes || !playerCell) return;
        const district = CITY_DISTRICTS.find((d) => d.id === gridEl.dataset.district) || CITY_DISTRICTS[0];

        const gridRect = gridEl.getBoundingClientRect();
        const cellRect = playerCell.getBoundingClientRect();
        const centro = (r) => ({ x: r.left - gridRect.left + r.width / 2, y: r.top - gridRect.top + r.height / 2 });
        // I punti intermedi stanno in coordinate dello schermo: si portano nel sistema della griglia.
        const viaLocale = (a, b) => viaDelTratto(district, a, b).map((q) => ({ x: q.x - gridRect.left, y: q.y - gridRect.top }));
        const p = centro(cellRect);

        // Il segnalino è un solo nodo persistente (le caselle non vengono
        // distrutte e ricreate). La PRIMA volta si posa senza animazione; se
        // cambia la casella del giocatore la pedina CAMMINA lungo la strada
        // dalla casella di prima; al solo ridimensionamento si riposa e basta.
        token.style.width = `${Math.round(cellRect.width * 0.44)}px`;
        const cellaPrima = token.dataset.cella;
        if (!token.dataset.positioned) {
            token.dataset.positioned = '1';
            token.style.left = `${p.x}px`;
            token.style.top = `${p.y}px`;
        } else if (cellaPrima !== undefined && cellaPrima !== gridEl.dataset.player) {
            const prima = gridEl.querySelector(`.city-cell[data-index="${cellaPrima}"]`);
            const collegata = prima && neighborsOf({ links: cityLinks[district.id], cells: { length: GRID_W * GRID_H } }, Number(cellaPrima)).includes(Number(gridEl.dataset.player));
            camminaPedina(gridEl, token, prima ? centro(prima.getBoundingClientRect()) : p, p, collegata ? viaLocale(Number(cellaPrima), Number(gridEl.dataset.player)) : []);
        } else if (!token.classList.contains('cammina')) {
            token.style.left = `${p.x}px`;
            token.style.top = `${p.y}px`;
        }
        token.dataset.cella = gridEl.dataset.player;

        routes.setAttribute('viewBox', `0 0 ${gridRect.width} ${gridRect.height}`);
        const raggio = cellRect.width;
        // Dai due centri ai due capi di un tratto: appena fuori dalla pedina di partenza, prima di quella d'arrivo (la linea
        // collega, non copre). `da` e `verso` sono la direzione di uscita e di arrivo: con punti intermedi non sono i due
        // nodi ma il primo/ultimo punto della strada. Verso l'alto si parte piu' lontano perche' la pedina si alza SOPRA il
        // centro della casella e ci si ferma prima, sotto la targhetta d'arrivo (sta sul bordo basso del suo alone).
        const capo = (da, verso, partenza) => {
            const dx = verso.x - da.x, dy = verso.y - da.y;
            const lung = Math.hypot(dx, dy) || 1;
            const ux = dx / lung, uy = dy / lung;
            const suSu = uy < -0.5;
            const f = partenza ? (suSu ? 0.32 : 0.26) : (suSu ? 0.46 : 0.32);
            return { x: da.x + ux * raggio * f, y: da.y + uy * raggio * f };
        };
        /** Percorso fra due caselle collegate, accorciato ai capi. */
        const percorsoTra = (ia, ib, ca0, cb0) => {
            // Le pedine stanno un po' SOPRA il centro della casella (l'etichetta e l'ombra sono sotto): le strade puntano al
            // corpo della pedina, non al punto fra pedina ed etichetta (prima sembravano sfasate verso il basso).
            const su = raggio * 0.16;
            const ca = { x: ca0.x, y: ca0.y - su }, cb = { x: cb0.x, y: cb0.y - su };
            const via = viaLocale(ia, ib);
            const dopoA = via.length ? via[0] : cb, primaB = via.length ? via[via.length - 1] : ca;
            return percorsoSmusso([capo(ca, dopoA, true)].concat(via, [capo(cb, primaB, false)]));
        };
        const tratti = (gridEl.dataset.reachable || '').split(',').filter(Boolean).map((i) => {
            const cell = gridEl.querySelector(`.city-cell[data-index="${i}"]`);
            if (!cell) return '';
            const perc = percorsoTra(Number(gridEl.dataset.player), Number(i), p, centro(cell.getBoundingClientRect()));
            // Strada con la freccia sul punto a meta', girata lungo la tangente.
            const m = perc.punto(0.55);
            const angolo = perc.angolo(0.55);
            const s = Math.max(5, raggio * 0.07);
            return `<g class="route">
                <path class="route-glow" d="${perc.d}"/>
                <path class="route-line" d="${perc.d}"/>
                <path class="route-arrow" d="M${-s} ${-s} L${s * 0.6} 0 L${-s} ${s}" transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${angolo.toFixed(1)})"/>
            </g>`;
        });
        // Le ORME del cammino fatto in questo distretto (ultime 8 tappe): sotto le strade, sbiadite.
        const percorso = (gridEl.dataset.percorso || '').split(',').filter(Boolean);
        let orme = '';
        for (let k = Math.max(1, percorso.length - 8); k < percorso.length; k++) {
            const ca = gridEl.querySelector(`.city-cell[data-index="${percorso[k - 1]}"]`);
            const cb = gridEl.querySelector(`.city-cell[data-index="${percorso[k]}"]`);
            if (!ca || !cb || percorso[k - 1] === percorso[k]) continue;
            orme += ormeLungoPercorso(percorsoTra(Number(percorso[k - 1]), Number(percorso[k]), centro(ca.getBoundingClientRect()), centro(cb.getBoundingClientRect())), Math.max(10, raggio * 0.2));
        }
        routes.innerHTML = (orme ? `<g class="city-orme">${orme}</g>` : '') + tratti.join('');
    }

    // Al ridimensionamento (rotazione del telefono, finestra) le caselle si
    // spostano: si riposano puntina e percorsi senza ridisegnare la città.
    let cityLayoutTimer = null;
    let orientamentoCitta = window.innerWidth < window.innerHeight;
    window.addEventListener('resize', () => {
        clearTimeout(cityLayoutTimer);
        cityLayoutTimer = setTimeout(() => {
            const state = loadState();
            if (state && state.phase === 'city') {
                const district = CITY_DISTRICTS[Math.max(0, Math.min(CITY_DISTRICTS.length - 1, state.sector - 1))];
                if (window.innerWidth < window.innerHeight && window.AmbienteWebGL && document.body.dataset.ambienteCity) { AmbienteWebGL.ferma(); delete document.body.dataset.ambienteCity; }
                applyPhaseBackdrop('city', state);
                posizionaCaselleCitta(document.getElementById('cityGrid'), district);
                aggiornaLuceCitta(state);
            }
            layoutCityOverlay(document.getElementById('cityGrid'));
        }, 120);
    });


    /**
     * Riga sotto l'intestazione del distretto: Radar potenziato (si tocca
     * per usarlo), Scudo del Duel Disk (solo indicatore: scatta da solo),
     * la Missione in corso e, quando c'è, l'avviso di Blackout.
     */
    function renderItemRow(state) {
        const row = document.getElementById('itemRow');
        if (!row) return;
        row.innerHTML = '';
        const tuttoVisibile = state.grid.cells.every((c) => c.revealed);
        const radarInutile = tuttoVisibile && !(state.blackout > 0);

        const radar = document.createElement('button');
        radar.type = 'button';
        radar.className = 'item-btn';
        radar.id = 'useRadarBtn';
        radar.title = ITEMS.radar.nome + ': ' + ITEMS.radar.desc;
        radar.innerHTML = `${ITEMS.radar.icon} ${ITEMS.radar.corto} <span class="item-count">×${state.items.radar}</span>`;
        radar.disabled = state.items.radar <= 0 || radarInutile;
        radar.onclick = useRadar;
        row.appendChild(radar);

        const scudo = document.createElement('span');
        scudo.className = 'item-btn item-passive';
        scudo.id = 'shieldBadge';
        scudo.title = ITEMS.shield.nome + ': ' + ITEMS.shield.desc;
        scudo.innerHTML = `${ITEMS.shield.icon} ${ITEMS.shield.corto} <span class="item-count">×${state.items.shield}</span>`;
        row.appendChild(scudo);

        if (state.quest) {
            const chip = document.createElement('span');
            chip.className = 'item-btn item-passive item-chip-quest';
            chip.id = 'questChip';
            chip.textContent = `🎯 Missione: batti ${nameOf(state.quest.characterId)} (+${state.quest.rewardCredits} crediti)`;
            row.appendChild(chip);
        }
        if (state.blackout > 0) {
            const chip = document.createElement('span');
            chip.className = 'item-btn item-passive item-chip-blackout';
            chip.id = 'blackoutChip';
            chip.textContent = `📴 Blackout: radar spento ancora ${state.blackout} ${state.blackout === 1 ? 'mossa' : 'mosse'}`;
            row.appendChild(chip);
        }
    }

    /** Usa un Radar potenziato: rivela TUTTO il distretto e riaccende il radar se era in Blackout. */
    function useRadar() {
        const state = loadState();
        if (!state || state.phase !== 'city' || !state.grid) return;
        ensureExtras(state);
        if (state.items.radar <= 0) return;
        const tuttoVisibile = state.grid.cells.every((c) => c.revealed);
        if (tuttoVisibile && !(state.blackout > 0)) {
            showToast('📡 Il radar mostra già tutto il distretto.');
            return;
        }
        state.items.radar--;
        let nuove = 0;
        state.grid.cells.forEach((c) => {
            if (!c.revealed) { c.revealed = true; c.justRevealed = true; nuove++; }
        });
        const eraBlackout = state.blackout > 0;
        state.blackout = 0;
        logEvent(state, '📡', `Radar potenziato: ${nuove ? `${nuove} isolati rivelati` : 'segnale ripristinato'}${eraBlackout ? ', blackout finito' : ''}.`);
        saveState(state);
        if (window.NativeHaptics) NativeHaptics.success();
        render();
        showToast(`📡 Radar potenziato: ${nuove ? `<strong>${nuove} isolati rivelati</strong>` : '<strong>segnale ripristinato</strong>'}${eraBlackout ? ', il blackout è finito' : ''}.`);
    }

    /** Camera del telefono in verticale: tiene al centro il nodo del giocatore e azzera lo spostamento dato col dito. */
    let cittaCorrente = null;
    function impostaCamera(state) {
        const distretto = CITY_DISTRICTS[Math.max(0, Math.min(CITY_DISTRICTS.length - 1, state.sector - 1))];
        cittaCorrente = { state: state, district: distretto };
        // Le strade del quartiere seguono l'orientamento attuale (vedi layoutAttivo).
        if (state.grid) state.grid.links = cityLinks[distretto.id];
    }    function renderCity(state) {
        document.body.classList.add('city-map-active');
        impostaCamera(state);
        applyPhaseBackdrop('city', state);
        applyPhaseTrack('city');
        mainEl.classList.add('map-mode');
        ensureHeliport(state);

        const district = CITY_DISTRICTS[Math.max(0, Math.min(CITY_DISTRICTS.length - 1, state.sector - 1))];
        // Le luci WebGL sono tarate sulla copertura del fondale: col fondale rimpicciolito (telefono in verticale) non coinciderebbero.
        if (window.AmbienteWebGL && document.body.dataset.ambienteCity !== district.id && window.innerWidth >= window.innerHeight) {
            AmbienteWebGL.ferma();
            const overlay = document.getElementById('cityAmbient');
            AmbienteWebGL.avviaMappa(district.ambient, overlay, {
                larghezza: window.innerWidth, altezza: window.innerHeight,
                ia: district.aspect, scala: Math.min(.48, 760 / Math.max(1, window.innerWidth))
            });
            // Anche un device con WebGL spento non deve riprovare a compilare
            // shader a ogni render della stessa mappa.
            document.body.dataset.ambienteCity = district.id;
        }

        ensureExtras(state);
        const grid = state.grid;
        grid.districtId = district.id;
        ensureDistrictGates(grid, district.id);
        const reachable = new Set(neighborsOf(grid, grid.playerIndex));
        const exhausted = sectorExhausted(state);

        let gridEl = document.getElementById('cityGrid');
        const sameSector = gridEl && gridEl.dataset.sector === String(state.sector)
            && gridEl.querySelectorAll('.city-cell').length === grid.cells.length;
        if (!sameSector) {
            content.innerHTML = `
                <div class="sector-head">
                    <div class="sector-title">${district.nome}<small style="display:block;opacity:.62;font-size:.62rem;letter-spacing:.1em;margin-top:2px;">QUARTIERE ${state.sector} / ${CITY_DISTRICTS.length}${state.citySweep ? ` · PATTUGLIA ${state.citySweep + 1}` : ''}</small></div>
                    <div class="city-clock" aria-live="polite">${oraDelDistretto(state) === 'giorno' ? 'Giorno' : oraDelDistretto(state) === 'tramonto' ? 'Tramonto' : 'Notte'}</div>
                    <div class="sector-hint" id="sectorHint"></div>
                </div>
                <div class="item-row" id="itemRow"></div>
                <div class="city-grid" id="cityGrid" data-sector="${state.sector}" data-district="${district.id}"style="grid-template-columns: repeat(${grid.w}, 1fr);"></div>
                <div class="sector-actions" id="sectorActions"></div>`;
            gridEl = document.getElementById('cityGrid');
            // Strato dei percorsi: PRIMO figlio della griglia e z-index 0,
            // così le linee passano sotto le pedine (vedi .city-routes).
            const routes = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            routes.setAttribute('class', 'city-routes');
            routes.setAttribute('aria-hidden', 'true');
            gridEl.appendChild(routes);
            grid.cells.forEach((cell, index) => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'city-cell';
                el.dataset.index = index;
                // Piccole deviazioni visive: la logica resta una griglia, ma
                // i punti seguono gli isolati della foto invece di sembrare
                // pedine perfettamente allineate su una scacchiera.
                const offsets = [[-4,-2],[2,3],[5,-3],[-2,4],[3,1],[4,-4],[-5,2],[1,-2],[-3,3],[5,2]];
                const drift = offsets[index % offsets.length];
                el.style.setProperty('--node-x', `${drift[0]}%`);
                el.style.setProperty('--node-y', `${drift[1]}%`);
                el.style.setProperty('--node-size', `${52 + ((index * 7) % 9)}%`);
                gridEl.appendChild(el);
            });
            const token = document.createElement('div');
            token.className = 'city-player-token';
            token.setAttribute('aria-hidden', 'true');
            // La pedina VERA del giocatore (la stessa dei tornei e della Storia), non piu' la puntina SVG generica.
            token.innerHTML = `<img class="cp-pedina" alt="" src="${PEDINA_GIOCATORE}"><small>Sei qui</small>`;
            gridEl.appendChild(token);
        }

        const titoloDistretto = document.querySelector('.sector-title');
        if (titoloDistretto) titoloDistretto.innerHTML = `${district.nome}<small style="display:block;opacity:.62;font-size:.62rem;letter-spacing:.1em;margin-top:2px;">QUARTIERE ${state.sector} / ${CITY_DISTRICTS.length}${state.citySweep ? ` · PATTUGLIA ${state.citySweep + 1}` : ''}</small>`;
        const orologio = document.querySelector('.city-clock');
        if (orologio) orologio.textContent = oraDelDistretto(state) === 'giorno' ? 'Giorno' : oraDelDistretto(state) === 'tramonto' ? 'Tramonto' : 'Notte';
        const tuttiEsplorati = CITY_DISTRICTS.every((d) => state.visitedDistricts.includes(d.id));
        document.getElementById('sectorHint').textContent = state.locators >= FINALS_THRESHOLD && tuttiEsplorati
            ? 'Zona di decollo aperta: raggiungi l\'elicottero in questo quartiere'
            : `Raggiungi i passaggi luminosi per spostarti tra i quartieri · ${Math.max(0, FINALS_THRESHOLD - state.locators)} Carte Locazione mancanti · duelli di questo quartiere ${LOC_DUELLI_PER_QUARTIERE - locazioniRimasteQuartiere(state)}/${LOC_DUELLI_PER_QUARTIERE}`;
        renderItemRow(state);

        grid.cells.forEach((cell, index) => {
            const el = gridEl.querySelector(`.city-cell[data-index="${index}"]`);
            el.className = 'city-cell';
            const isPlayer = index === grid.playerIndex;
            const meta = CELL_META[cell.kind] || CELL_META.empty;

            // Quale pedina e quale etichetta. Una casella già risolta mostra
            // il gettone spento (si vede che ci si è già passati), una vuota
            // solo l'alone a terra; l'etichetta si vede solo se raggiungibile
            // (vedi .cell-label), quindi descrive cosa si trova ANDANDOCI.
            let piece;
            let label;
            // Con il radar spento (Blackout) le celle non ancora attraversate
            // tornano "Ignoto" anche se erano state rivelate.
            const veduta = cellVisible(state, cell);
            if (!veduta) {
                el.classList.add('hidden-cell');
                piece = 'hidden';
                label = 'Ignoto';
            } else {
                el.classList.add('revealed');
                if (cell.resolved) el.classList.add('resolved');
                if (cell.kind === 'heliport') el.classList.add('heliport');
                if (cell.kind === 'districtGate') el.classList.add('district-gate');
                if (cell.kind === 'credits') el.classList.add('credits');
                if (cell.justRevealed) el.classList.add('just-revealed');
                const vuota = cell.kind === 'empty' || cell.kind === 'start';
                piece = vuota ? null : (cell.resolved ? 'done' : meta.piece);
                label = cell.kind === 'districtGate'
                    ? `Verso ${CITY_DISTRICTS.find((d) => d.id === cell.destinationId)?.nome || 'altro quartiere'}`
                    : (vuota || cell.resolved) ? 'Libero' : meta.label;
                // Il bersaglio della Missione: anello dorato ed etichetta dedicata.
                if (state.quest && state.quest.cellIndex === index && !cell.resolved) {
                    el.classList.add('quest-target');
                    label = 'Bersaglio';
                }
            }
            // Il disegno si riscrive solo se cambia: le 25 caselle restano
            // nodi persistenti (vedi il commento sul segnalino più sotto).
            // Un Duellante mostra il PERSONAGGIO ritagliato
            // (images/characters/pedine/<nome-avatar>.png, senza sfondo); un
            // Rare Hunter mostra un ritaglio anonimo unico (rareHunter.png)
            // perché chi è si estrae solo entrandoci. Ogni Duellante PROVA il suo PNG: se il file
            // non c'è, BoardPieces ripiega da solo sulla pedina standard
            // (niente elenco da tenere: basta mettere o togliere il file).
            // Il PNG ha lo stesso nome del file avatar del personaggio
            // (es. joeyWheeler.jpg -> pedine/joeyWheeler.png), NON il suo id.
            const avatarDelDuellante = (piece === 'duelist' && cell.characterId) ? getCharacter(cell.characterId) : null;
            const nomeAvatar = avatarDelDuellante && avatarDelDuellante.image
                ? avatarDelDuellante.image.split('/').pop().replace(/\.[^.]+$/, '') : null;
            // Il Rare Hunter ha un ritaglio unico, uguale per tutti: chi si
            // incontra davvero si decide solo entrandoci.
            const faccia = piece === 'hunter' ? 'images/characters/pedine/rareHunter.png'
                : (nomeAvatar ? `images/characters/pedine/${nomeAvatar}.png` : null);
            const firma = `${piece || '-'}|${label}|${faccia || ''}`;
            if (el.dataset.content !== firma) {
                el.innerHTML = `${piece ? BoardPieces.markup(piece, null, faccia ? { image: faccia } : null) : ''}<div class="cell-label">${label}</div>`;
                el.dataset.content = firma;
            }
            el.title = `${label || 'Isolato'}${cell.kind === 'credits' && !cell.resolved ? ' — contiene crediti' : ''}`;
            el.setAttribute('aria-label', `Casella ${index + 1}: ${label || 'Isolato'}`);
            // Il radar l'ha appena rivelata: un anello di luce che si allarga. Dopo il contenuto, che altrimenti lo cancellerebbe.
            if (veduta && cell.justRevealed) {
                const ping = document.createElement('i');
                ping.className = 'city-radar-ping';
                ping.addEventListener('animationend', () => ping.remove());
                el.appendChild(ping);
            }
            if (isPlayer) el.classList.add('player');

            // Una cella è cliccabile solo se adiacente al segnalino. Le
            // celle già risolte restano attraversabili (non si resta mai
            // chiusi in un angolo dopo aver ripulito il quartiere).
            if (!isPlayer && reachable.has(index)) {
                el.classList.add('reachable');
                el.onclick = () => moveToCell(index);
                el.tabIndex = 0;
                el.removeAttribute('aria-disabled');
                el.setAttribute('aria-label', veduta ? (label || meta.label || 'Isolato libero') : 'Isolato sconosciuto');
            } else {
                el.onclick = null;
                el.tabIndex = -1;
                el.setAttribute('aria-disabled', 'true');
            }
        });
        // Segnalino e percorsi si posano in base alla geometria VERA delle
        // caselle (le deviazioni --node-x/--node-y spostano ogni punto), che
        // esiste solo dopo il layout: da qui il requestAnimationFrame. Gli
        // indici servono anche al ridimensionamento, che ripete lo stesso
        // calcolo senza un render completo (vedi in fondo al file).
        posizionaCaselleCitta(gridEl, district);
        gridEl.dataset.player = String(grid.playerIndex);
        gridEl.dataset.reachable = Array.from(reachable).join(',');
        gridEl.dataset.percorso = (grid.percorso || []).join(',');
        aggiornaLuceCitta(state);
        requestAnimationFrame(() => {
            layoutCityOverlay(gridEl);
        });
        // Consumata: l'animazione di comparsa del radar deve giocare una
        // volta sola, non ad ogni render successivo dello stesso settore.
        grid.cells.forEach((c) => { delete c.justRevealed; });
        saveState(state);

        const actions = document.getElementById('sectorActions');
        actions.innerHTML = '';
        if (exhausted && state.sector === CITY_DISTRICTS.length && state.locators < FINALS_THRESHOLD) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'big-btn';
            btn.textContent = 'Chiama una nuova pattuglia';
            btn.onclick = () => {
                const s = loadState();
                const empty = s.grid.cells.map((cell, i) => ({ cell, i })).filter((v) => v.cell.kind === 'empty');
                if (!empty.length) return;
                const slot = pickRandom(empty);
                s.citySweep = (s.citySweep || 0) + 1;
                s.grid.cells[slot.i] = { kind: 'hunter', revealed: true, resolved: false };
                logEvent(s, '🚔', `Una pattuglia di Rare Hunter blocca una strada di KaibaCorp${s.citySweep > 1 ? ` (${s.citySweep})` : ''}. Per tentare di recuperare Carte Locazione dovrai affrontarla.`);
                saveState(s);
                render();
            };
            actions.appendChild(btn);
        }
    }

    /** Entra nella cella `index` (già validata come adiacente) e ne risolve il contenuto. */
    function moveToCell(index) {
        const state = loadState();
        if (!state || state.phase !== 'city') return;
        const grid = state.grid;
        if (!neighborsOf(grid, grid.playerIndex).includes(index)) return;
        const cell = grid.cells[index];

        ensureExtras(state);
        avanzaOrologioCitta(state, 1);
        // Il cammino fatto nel distretto (per le orme): additivo, nasce vuoto in un distretto nuovo.
        if (!Array.isArray(grid.percorso)) grid.percorso = [grid.playerIndex];
        grid.percorso.push(index);
        if (grid.percorso.length > 12) grid.percorso.shift();
        grid.playerIndex = index;
        revealAround(state, index);
        if (window.NativeHaptics) NativeHaptics.light();
        // Ogni mossa consuma una delle mosse di Blackout; l'evento che lo
        // accende (più sotto) parte DOPO questo scalare, quindi dura per
        // intero le mosse successive.
        if (state.blackout > 0) {
            state.blackout--;
            if (state.blackout === 0) logEvent(state, '📡', 'Il segnale del radar è tornato.');
        }

        if (cell.kind === 'districtGate') {
            travelToDistrict(state, cell, index);
            return;
        }

        if (cell.resolved || cell.kind === 'empty') {
            cell.resolved = true;
            saveState(state);
            render();
            return;
        }

        switch (cell.kind) {
            case 'locator': {
                cell.resolved = true;
                state.locators++;
                const scene = pickRandom(LOCATOR_SCENES);
                logEvent(state, '🃏', scene);
                saveState(state);
                if (window.NativeHaptics) NativeHaptics.success();
                render();
                showToast(`🃏 ${scene} <strong>+1 Carta Locazione</strong>.`);
                return;
            }
            case 'credits': {
                cell.resolved = true;
                const crediti = randomCreditReward(CREDIT_NODE_REWARD);
                SaveManager.addCurrency('credits', crediti);
                logEvent(state, '💰', `Trovi ${crediti} crediti per strada.`);
                saveState(state);
                render();
                showToast(`💰 Hai trovato <strong>${crediti} crediti</strong>.`);
                return;
            }
            case 'shop': {
                cell.resolved = true;
                // Due isolati rivelati (erano tre) più UN oggetto: Radar
                // potenziato o Scudo del Duel Disk.
                revealRandomCells(state, 2);
                const oggetto = giveRandomItem(state);
                const scene = pickRandom(SHOP_SCENES);
                const premio = oggetto
                    ? `Due isolati rivelati e <strong>${ITEMS[oggetto].icon} ${ITEMS[oggetto].nome}</strong>.`
                    : 'Due isolati rivelati (hai già il massimo di oggetti).';
                logEvent(state, '🏪', scene + (oggetto ? ` Ottieni: ${ITEMS[oggetto].nome}.` : ''));
                saveState(state);
                render();
                showToast(`🏪 ${scene} ${premio}`);
                return;
            }
            case 'quest': {
                cell.resolved = true;
                // Il bersaglio è un Duellante di QUESTO distretto non ancora
                // affrontato. Una sola missione alla volta: una seconda
                // soffiata, o nessun bersaglio rimasto, non assegna nulla.
                const bersagli = grid.cells
                    .map((c, i) => ({ c: c, i: i }))
                    .filter((e) => e.c.kind === 'duelist' && !e.c.resolved);
                if (state.quest || bersagli.length === 0) {
                    const nota = state.quest
                        ? 'Un\'altra soffiata, ma hai già una missione in corso.'
                        : 'Il biglietto è vecchio: il bersaglio se n\'è già andato.';
                    logEvent(state, '🎯', nota);
                    saveState(state);
                    render();
                    showToast(`🎯 ${nota}`);
                    return;
                }
                const scelto = pickRandom(bersagli);
                state.quest = { characterId: scelto.c.characterId, cellIndex: scelto.i, rewardCredits: randomCreditReward(QUEST_CREDIT_REWARD), sector: state.sector, districtId: grid.districtId };
                // La soffiata dice anche DOVE: la casella del bersaglio si rivela.
                if (!scelto.c.revealed) { scelto.c.revealed = true; scelto.c.justRevealed = true; }
                const scenaMissione = pickRandom(QUEST_SCENES);
                logEvent(state, '🎯', `${scenaMissione} Missione: sconfiggi ${nameOf(scelto.c.characterId)} (+${state.quest.rewardCredits} crediti).`);
                saveState(state);
                if (window.NativeHaptics) NativeHaptics.success();
                render();
                showToast(`🎯 ${scenaMissione} <strong>Missione: sconfiggi ${nameOf(scelto.c.characterId)}</strong> in questo distretto per <strong>+${state.quest.rewardCredits} crediti</strong>.`);
                return;
            }
            case 'event': {
                cell.resolved = true;
                // Quattro esiti: un aiuto (34%), rischio di perdere una
                // Locazione (28%), blackout (20%) o furto di crediti (18%).
                // Lo Scudo può assorbire entrambe le perdite e il blackout.
                const roll = Math.random();
                if (roll < 0.34) {
                    const scene = pickRandom(EVENT_GOOD);
                    revealRandomCells(state, 2);
                    const oggetto = Math.random() < 0.22 ? giveRandomItem(state) : null;
                    const crediti = Math.random() < 0.34
                        ? CREDITI_TROVATI[0] + Math.floor(Math.random() * (CREDITI_TROVATI[1] - CREDITI_TROVATI[0] + 1))
                        : 0;
                    if (crediti) SaveManager.addCurrency('credits', crediti);
                    logEvent(state, '✨', scene + (oggetto ? ` Ottieni: ${ITEMS[oggetto].nome}.` : '') + (crediti ? ` Ritrovi ${crediti} crediti.` : ''));
                    saveState(state);
                    render();
                    showToast(`✨ ${scene}${oggetto ? ` <strong>${ITEMS[oggetto].icon} ${ITEMS[oggetto].nome}</strong>.` : ''}${crediti ? ` <strong>+${crediti} crediti.</strong>` : ''}`);
                } else if (roll < 0.62) {
                    const scene = pickRandom(EVENT_BAD);
                    if (consumeShield(state)) {
                        logEvent(state, '🛡️', `${scene} Lo Scudo del Duel Disk assorbe il colpo.`);
                        saveState(state);
                        render();
                        showToast(`🛡️ ${scene} <strong>Lo Scudo del Duel Disk ti protegge: nessuna carta persa.</strong>`);
                    } else {
                        state.locators = Math.max(0, state.locators - 1);
                        logEvent(state, '⚠️', scene);
                        if (state.locators <= 0) state.eliminated = true;
                        saveState(state);
                        if (window.NativeHaptics) NativeHaptics.error();
                        render();
                        showToast(`⚠️ ${scene} <strong>−1 Carta Locazione</strong>.`);
                    }
                } else if (roll < 0.82) {
                    const scene = pickRandom(BLACKOUT_SCENES);
                    if (consumeShield(state)) {
                        logEvent(state, '🛡️', `${scene} Lo Scudo del Duel Disk lo respinge.`);
                        saveState(state);
                        render();
                        showToast(`🛡️ ${scene} <strong>Lo Scudo del Duel Disk lo respinge: il radar resta acceso.</strong>`);
                    } else {
                        state.blackout = BLACKOUT_MOVES;
                        logEvent(state, '📴', `${scene} Radar spento per ${BLACKOUT_MOVES} mosse.`);
                        saveState(state);
                        if (window.NativeHaptics) NativeHaptics.error();
                        render();
                        showToast(`📴 ${scene} <strong>Radar spento per ${BLACKOUT_MOVES} mosse</strong>: le celle nuove non si vedono finché non ci passi.`);
                    }
                } else {
                    const scena = pickRandom(EVENT_CREDIT_LOSS);
                    if (consumeShield(state)) {
                        logEvent(state, '🛡️', `${scena} Lo Scudo del Duel Disk protegge i tuoi crediti.`);
                        saveState(state);
                        render();
                        showToast(`🛡️ ${scena} <strong>Lo Scudo ti protegge: nessun credito perso.</strong>`);
                    } else {
                        const persi = CREDITI_PERSI[0] + Math.floor(Math.random() * (CREDITI_PERSI[1] - CREDITI_PERSI[0] + 1));
                        SaveManager.addCurrency('credits', -persi);
                        logEvent(state, '💸', `${scena} Perdi ${persi} crediti.`);
                        saveState(state);
                        render();
                        showToast(`💸 ${scena} <strong>−${persi} crediti.</strong>`);
                    }
                }
                return;
            }
            case 'heliport': {
                // Vecchi salvataggi potevano aprire il decollo appena raccolte
                // sei Locazioni. Le quattro tappe urbane ora restano obbligatorie.
                if (CITY_DISTRICTS.some((d) => !(state.visitedDistricts || []).includes(d.id))) {
                    cell.kind = 'empty'; cell.resolved = true;
                    saveState(state); render();
                    showToast('🚁 Per raggiungere il dirigibile devi aver visitato tutti e quattro i quartieri.');
                    return;
                }
                enterAirship(state);
                return;
            }
            case 'duelist':
            case 'hunter': {
                const characterId = cell.kind === 'hunter' ? pickRareHunter(state) : cell.characterId;
                state.pendingEncounter = {
                    characterId: characterId,
                    stage: cell.kind === 'hunter' ? 'hunter' : 'street',
                    cellIndex: index,
                    wager: null
                };
                saveState(state);
                // Si resta sulla mappa (non sulla schermata "duello in sospeso", che serve solo a chi ricarica): la pedina cammina
                // fino allo sfidante, che grida (posa grido), e solo dopo si apre la puntata. Con "riduci movimento" subito.
                renderCity(state);
                const sfidante = cell.kind === 'duelist' ? getCharacter(cell.characterId) : null;
                if (sfidante) posaGridoSullaCasella(document.querySelector(`.city-cell[data-index="${index}"]`), sfidante);
                const apri = () => {
                    const s = loadState();
                    if (s && s.pendingEncounter && s.phase === 'city' && !document.getElementById('wagerModal').classList.contains('open')) promptWager(s);
                };
                if (riduciMovimento()) apri(); else setTimeout(apri, 700);
                return;
            }
            default: {
                cell.resolved = true;
                saveState(state);
                render();
            }
        }
    }

    // ---------------- Fase 2: il dirigibile ----------------
    function enterAirship(state) {
        state.phase = 'airship';
        state.grid = null;
        buildBracket(state);
        simulateOtherAirshipMatches(state);
        logEvent(state, '🚁', 'Sali sul dirigibile di Kaiba: gli otto finalisti disputano i quarti.');
        saveState(state);
        render();
        // L'intermezzo arriva DOPO il render: dietro alla scena c'è già il
        // fondale del dirigibile e la sua colonna sonora, quindi quando il
        // dialogo si chiude il giocatore è già dove deve essere.
        // js/data/tournament-dialogues.js lo mostra una volta sola per
        // partita e resta sempre saltabile.
        TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'airship', state, saveState).then(() => {
            showToast('🚁 Il dirigibile decolla su Domino City. Gli 8 finalisti sono al completo.');
        });
    }

    function fighterMarkup(id, state, resultWinner) {
        const isPlayer = id === 'player';
        const character = isPlayer ? null : getCharacter(id);
        const label = isPlayer ? 'Tu' : (character ? character.name : '—');
        let cls = 'fighter';
        if (resultWinner) cls += (resultWinner === id ? ' winner' : ' loser');
        const avatar = character && character.image
            ? `<span class="avatar"><img src="${getCharacterPawnImage(character.image)}" alt=""></span>`
            : `<span class="avatar">${isPlayer ? '🫵' : '?'}</span>`;
        return `<div class="${cls}">${avatar}<span class="who">${label}</span></div>`;
    }

    function matchMarkup(aId, bId, winner, isPlayerMatch) {
        const cls = 'match' + (isPlayerMatch ? ' is-player' : '') + (winner ? ' decided' : '');
        return `<div class="${cls}">
            ${fighterMarkup(aId, null, winner)}
            <span class="vs">VS</span>
            ${fighterMarkup(bId, null, winner)}
        </div>`;
    }

    /**
     * Sul dirigibile si disputano soltanto i quarti canonici. La striscia
     * rende esplicita la fase prima del trasferimento alla Torre Kaiba.
     */
    function renderAirship(state) {
        document.body.classList.remove('city-map-active');
        applyPhaseBackdrop('airship');
        applyPhaseTrack('airship');
        mainEl.classList.remove('map-mode');
        const br = state.bracket;
        const roundIndex = currentAirshipRound(state);
        const round = AIRSHIP_ROUNDS[roundIndex];
        const combattenti = br[round.slotsKey];
        const vincitori = br[round.winnersKey];
        const opponentId = combattenti[1];

        const matches = [];
        for (let m = 0; m < round.matchCount; m++) {
            matches.push(matchMarkup(combattenti[m * 2], combattenti[m * 2 + 1], vincitori[m], m === 0));
        }

        const progressRows = AIRSHIP_ROUNDS.map((r, i) => {
            let cls = 'tower-floor';
            if (i < roundIndex) cls += ' done';
            else if (i === roundIndex) cls += ' current';
            else cls += ' locked';
            return `<div class="${cls}"><div class="floor-name">${r.name}</div></div>`;
        }).join('');

        content.innerHTML = `
            <div class="panel">
                <h2>Dirigibile Kaiba</h2>
                <p class="panel-sub">Da qui si vince o si scende — le Carta Locazione non contano più.</p>
                <div class="tower" style="margin-bottom:14px;">${progressRows}</div>
                <div class="bracket">
                    <div class="bracket-round">
                        <div class="bracket-round-name">${round.name}</div>
                        ${matches.join('')}
                    </div>
                </div>
                <p style="color:var(--ink-dim); font-size:0.8rem; margin:14px 0 16px;">Il tuo avversario: <strong style="color:#fff;">${nameOf(opponentId)}</strong>.</p>
                <div class="modal-actions">
                    <button type="button" class="big-btn" id="fightBtn" style="flex:1;">⚔️ Sfida ${nameOf(opponentId)}</button>
                </div>
            </div>`;

        document.getElementById('fightBtn').onclick = () => {
            const s = loadState();
            s.pendingEncounter = { characterId: opponentId, stage: round.stage, wager: 0 };
            saveState(s);
            launchDuel(s.pendingEncounter, s);
        };
    }

    // ---------------- Fase 3: la Torre Kaiba ----------------
    function enterTower(state) {
        state.phase = 'tower';
        state.towerStage = 'semi';
        logEvent(state, '🗼', 'Il dirigibile attracca alla Torre Kaiba: semifinali.');
        saveState(state);
        // A differenza di enterAirship, qui NON si chiama render(): questa
        // funzione viene invocata mentre si sta già risolvendo l'esito di
        // un duello, ed è il chiamante a ridisegnare subito dopo. La scena
        // si limita quindi a sovrapporsi, e il torneo prosegue da sé.
        //
        // Il contesto racconta il tabellone VERO: chi affronti, e chi si
        // gioca l'altra semifinale. Sono i vincitori dei quarti 2 e 3, già
        // simulati (vedi simulateOtherQuarters) — l'esito di quello
        // scontro NON si legge qui, perché a questo punto non è ancora
        // stato deciso: lo sarà alla prima chiamata di playerFinalOpponent.
        const br = state.bracket;
        TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'tower', state, saveState, {
            avversario: nameOf(playerSemiOpponent(state)),
            altroA: nameOf(br.quarterWinners[2]),
            altroB: nameOf(br.quarterWinners[3])
        });
    }

    function renderTower(state) {
        document.body.classList.remove('city-map-active');
        applyPhaseBackdrop('tower');
        applyPhaseTrack('tower');
        mainEl.classList.remove('map-mode');
        const stage = state.towerStage;
        const semiOpponent = playerSemiOpponent(state);
        const finalOpponent = stage === 'final' ? playerFinalOpponent(state) : null;

        const floors = [
            { key: 'semi', name: 'Piano 40 — Semifinale', who: nameOf(semiOpponent) },
            { key: 'final', name: 'Cima — Finale', who: stage === 'final' ? nameOf(finalOpponent) : '???' }
        ];
        const floorsMarkup = floors.map((f) => {
            let cls = 'tower-floor';
            if (f.key === stage) cls += ' current';
            else if (f.key === 'semi' && stage === 'final') cls += ' done';
            else cls += ' locked';
            return `<div class="${cls}">
                <div class="floor-name">${f.name}</div>
                <div class="floor-who">${f.key === 'semi' && stage === 'final' ? 'Superata' : f.who}</div>
            </div>`;
        }).join('');

        const currentOpponent = stage === 'final' ? finalOpponent : semiOpponent;
        content.innerHTML = `
            <div class="panel">
                <h2>Torre Kaiba</h2>
                <p class="panel-sub">Due duelli ti separano dal titolo. Nessuna posta, nessuna seconda occasione.</p>
                <div class="tower">${floorsMarkup}</div>
                <div class="modal-actions">
                    <button type="button" class="big-btn" id="fightBtn" style="flex:1;">⚔️ Sfida ${nameOf(currentOpponent)}</button>
                </div>
            </div>`;

        document.getElementById('fightBtn').onclick = () => {
            const s = loadState();
            s.pendingEncounter = { characterId: currentOpponent, stage: stage, wager: 0 };
            saveState(s);
            launchDuel(s.pendingEncounter, s);
        };
        saveState(state);
    }

    /** Un pendingEncounter senza un esito fresco: la pagina è stata ricaricata/l'app chiusa a metà duello. */
    function renderResumeEncounter(state) {
        mainEl.classList.remove('map-mode');
        const enc = state.pendingEncounter;
        content.innerHTML = `
            <div class="panel" style="text-align:center;">
                <h2>Duello in sospeso</h2>
                <p class="panel-sub">Hai lasciato in sospeso la sfida contro <strong style="color:#fff;">${nameOf(enc.characterId)}</strong>.</p>
                <div class="modal-actions">
                    <button type="button" class="big-btn secondary" id="dropBtn" style="flex:1;">Rinuncia</button>
                    <button type="button" class="big-btn" id="resumeBtn" style="flex:1;">Riprendi il duello</button>
                </div>
            </div>`;
        document.getElementById('resumeBtn').onclick = () => {
            const s = loadState();
            if (s.pendingEncounter.wager == null) { promptWager(s); return; }
            launchDuel(s.pendingEncounter, s);
        };
        // Rinunciare costa la posta: altrimenti si potrebbe "annullare"
        // ogni duello scomodo ricaricando la pagina, e la puntata non
        // sarebbe più una scelta con un rischio.
        document.getElementById('dropBtn').onclick = () => {
            const s = loadState();
            const lost = s.pendingEncounter.wager || 0;
            if (s.phase === 'city') {
                s.locators = Math.max(0, s.locators - lost);
                if (s.grid && s.pendingEncounter.cellIndex != null) s.grid.cells[s.pendingEncounter.cellIndex].resolved = true;
                if (s.locators <= 0) s.eliminated = true;
                logEvent(s, '🏳️', `Rinunci alla sfida contro ${nameOf(s.pendingEncounter.characterId)}${lost ? ` (−${lost})` : ''}.`);
            } else {
                s.eliminated = true;
                logEvent(s, '🏳️', 'Rinunci a un duello delle finali: sei fuori dal torneo.');
            }
            s.pendingEncounter = null;
            saveState(s);
            render();
        };
    }

    // ================================================================
    // Puntata
    // ================================================================
    /** La posta imposta dagli uomini di Marik: non si tratta, e non può mai superare quello che possiedi. */
    function forcedHunterWager(state) {
        return Math.min(3, state.locators);
    }

    function promptWager(state) {
        const enc = state.pendingEncounter;
        const character = getCharacter(enc.characterId);
        const modal = document.getElementById('wagerModal');
        const portrait = document.getElementById('wagerPortrait');
        portrait.className = 'opponent-portrait';
        portrait.innerHTML = enc.stage === 'hunter' ? '🕶️' : '🧑‍🎤';
        if (character && character.image) {
            const img = document.createElement('img');
            img.alt = '';
            img.onload = () => portrait.classList.add('has-image');
            // Lo sfidante grida: posa "grido" (miniatura), e se per lui non esiste ripiega sulla pedina normale.
            const posa = percorsoPosaGrido(character);
            const normale = getCharacterPawnImage(character.image);
            img.onerror = () => {
                if (posa && img.src.indexOf('pedine-esclamazione') !== -1) { img.src = normale; return; }
                img.remove();
            };
            img.src = posa || normale;
            portrait.appendChild(img);
        }
        document.getElementById('wagerName').textContent = character ? character.name : 'Duellante';
        document.getElementById('wagerTitle').textContent = (character && character.title) || '';
        const quote = getQuote(enc.characterId, 'intro');
        const quoteEl = document.getElementById('wagerQuote');
        quoteEl.textContent = quote;
        quoteEl.style.display = quote ? 'block' : 'none';

        const forcedEl = document.getElementById('wagerForced');
        const boxEl = document.getElementById('wagerBox');
        const resto = locazioniRimasteQuartiere(state);
        // La posta non supera il tetto per duello, ne' quello che si puo' ancora vincere in questo quartiere (rischio = guadagno).
        const max = Math.min(WAGER_MAX, state.locators, resto);
        let value = 1;

        if (enc.stage !== 'hunter' && resto <= 0) {
            // Quartiere "esaurito": il duello si puo' giocare ma e' senza posta (non si vince ne' si perde nulla).
            value = 0;
            forcedEl.style.display = 'block';
            forcedEl.innerHTML = `Le ${LOC_DUELLI_PER_QUARTIERE} Carte Locazione di questo quartiere sono già state vinte: questo duello è <strong>senza posta</strong>. Cerca le altre nei quartieri vicini.`;
            boxEl.style.display = 'none';
        } else if (enc.stage === 'hunter') {
            // I Rare Hunter non lasciano scegliere: è l'unico caso in cui
            // la puntata libera viene sospesa, e serve a rendere davvero
            // pericoloso entrare nella loro cella quando si è a corto di
            // carte (il Radar l'aveva mostrata: era una scelta).
            value = forcedHunterWager(state);
            forcedEl.style.display = 'block';
            forcedEl.innerHTML = `🕶️ Gli uomini di Marik non trattano: la posta è fissata a <strong>${value} Carta Locazione</strong>.`;
            boxEl.style.display = 'none';
        } else {
            forcedEl.style.display = 'none';
            boxEl.style.display = 'block';
            const valueEl = document.getElementById('wagerValue');
            const ownedEl = document.getElementById('wagerOwned');
            const slider = document.getElementById('wagerSlider');
            const minusBtn = document.getElementById('wagerMinus');
            const plusBtn = document.getElementById('wagerPlus');
            ownedEl.textContent = `(max ${max} · quartiere ${LOC_DUELLI_PER_QUARTIERE - resto}/${LOC_DUELLI_PER_QUARTIERE})`;
            slider.min = 1;
            slider.max = Math.max(1, max);
            const sync = (v) => {
                value = Math.max(1, Math.min(max, v));
                valueEl.textContent = value;
                slider.value = value;
                minusBtn.disabled = value <= 1;
                plusBtn.disabled = value >= max;
            };
            slider.oninput = () => sync(parseInt(slider.value, 10));
            minusBtn.onclick = () => sync(value - 1);
            plusBtn.onclick = () => sync(value + 1);
            document.getElementById('wagerMinBtn').onclick = () => sync(1);
            document.getElementById('wagerHalfBtn').onclick = () => sync(Math.max(1, Math.ceil(max / 2)));
            document.getElementById('wagerAllBtn').onclick = () => sync(max);
            sync(1);
        }

        document.getElementById('wagerConfirmBtn').onclick = () => {
            modal.classList.remove('open');
            const s = loadState();
            s.pendingEncounter.wager = value;
            saveState(s);
            launchDuel(s.pendingEncounter, s);
        };
        modal.classList.add('open');
    }

    // ================================================================
    // Lancio del duello vero — vedi js/duel-session.js (mode=tournament)
    // ================================================================
    function launchDuel(encounter, state) {
        const difficulty = (state && state.difficulty) || 'Medio';
        // Il TEMA del personaggio batte quello della fase: chi ne ha uno
        // proprio (Kaiba, Pegasus — vedi `duelTrack` in
        // js/data/characters-db.js) se lo porta dietro a qualunque turno,
        // invece di ereditare la traccia prevista per quello stadio del
        // torneo. Richiesta esplicita dell'utente per Kaiba.
        const sfidante = getCharacter(encounter.characterId);
        const track = (sfidante && sfidante.duelTrack)
            || DUEL_TRACKS[encounter.stage] || DUEL_TRACKS.street;
        // Campo di gioco per fase: la città per le preliminari, il
        // dirigibile per i quarti, la torre per
        // semifinale/finale. I percorsi passano da resolvedPhaseImage,
        // quindi se l'immagine dedicata non è ancora nel repository si
        // usa il fallback già deciso all'avvio invece di un campo vuoto
        // — e il parametro ?field= vuole solo il NOME del file dentro
        // images/fields/.
        let phase = 'city';
        if (encounter.stage === 'quarter') phase = 'airship';
        else if (encounter.stage === 'semi' || encounter.stage === 'final') phase = 'tower';
        const fieldPath = resolvedPhaseImage[phase] || PHASE_IMAGES[phase].fallback;
        const fieldImage = fieldPath.split('/').pop();
        // Torneo a regolamento classico: SOLO carte Yu-Gi-Oh — stessa
        // scelta già fatta per il Regno dei Duellanti, vedi
        // findForbiddenCards in js/duel-session.js.
        let url = `duelMonstersCore.html?mode=tournament&tournament=${TOURNAMENT_ID}`
            + `&character=${encodeURIComponent(encounter.characterId)}`
            + `&difficulty=${difficulty}`
            + `&music=${encodeURIComponent(track)}`
            + `&field=${encodeURIComponent(fieldImage)}`
            + `&origin=yu-gi-oh`;
        if (window.StoryAutowin) url = StoryAutowin.aggiungiAUrl(url);
        // Il regolamento del torneo ammette solo carte Yu-Gi-Oh: se il
        // mazzo in uso non lo rispetta si dice QUI, prima di caricare
        // l'arena. Il controllo dentro il duello resta come ultima
        // difesa, ma scoprirlo a musica gia' partita e' tardi.
        const fuoriRegolamento = window.DeckLegality
            ? DeckLegality.mazzoCorrenteNonAmmesso('yu-gi-oh')
            : [];
        if (fuoriRegolamento.length > 0) {
            const elenco = fuoriRegolamento.slice(0, 3).join(', ');
            const altre = fuoriRegolamento.length - Math.min(3, fuoriRegolamento.length);
            showToast(`🚫 Il torneo ammette solo carte Yu-Gi-Oh!, ma il tuo mazzo ne contiene ${fuoriRegolamento.length} di altre provenienze (${elenco}${altre > 0 ? ` e altre ${altre}` : ''}). Cambia mazzo dalla barra in alto.`);
            return;
        }
        window.location.href = url;
    }

    /**
     * Consuma la breadcrolla generica "com'è appena finito l'ultimo
     * duello" (js/duel-session.js#finish) SOLO se corrisponde davvero a
     * un pendingEncounter di QUESTO torneo.
     */
    function resolvePendingEncounterIfDone(state) {
        if (!state.pendingEncounter) return false;
        let outcome = null;
        try {
            const raw = sessionStorage.getItem('ygoLastDuelOutcome');
            if (raw) outcome = JSON.parse(raw);
        } catch (e) { /* noop */ }
        if (!outcome || outcome.mode !== 'tournament' || outcome.tournamentId !== TOURNAMENT_ID) return false;
        try { sessionStorage.removeItem('ygoLastDuelOutcome'); } catch (e) { /* noop */ }

        const enc = state.pendingEncounter;
        const name = nameOf(enc.characterId);
        const won = outcome.playerWon === true;
        // Reazione IN CARATTERE dell'AVVERSARIO (mai del giocatore): se
        // il giocatore vince, il Duellante dice una battuta da 'lose'.
        const reaction = getQuote(enc.characterId, won ? 'lose' : 'win');
        if (state.phase === 'city') avanzaOrologioCitta(state, 3);
        state.pendingEncounter = null;

        // --- Tabellone: vittoria-o-fuori, nessuna posta ---
        const airshipRound = AIRSHIP_ROUNDS.find((round) => round.stage === enc.stage);
        if (airshipRound || enc.stage === 'semi' || enc.stage === 'final') {
            if (!won) {
                state.eliminated = true;
                logEvent(state, '💀', `${name} ti elimina dalle finali di Battle City.`);
                if (window.NativeHaptics) NativeHaptics.error();
                saveState(state);
                showToast(`💀 ${name} ti ha sconfitto: il tuo torneo finisce qui.`, reaction);
                return true;
            }
            if (window.NativeHaptics) NativeHaptics.success();
            if (enc.stage === 'quarter') {
                state.bracket.quarterWinners[0] = 'player';
                state.bracket.semiWinners[0] = 'player';
                logEvent(state, '🏆', `Batti ${name} nei quarti sul dirigibile.`);
                enterTower(state);
                showToast(`🏆 Hai battuto ${name} nei quarti! Il dirigibile punta verso la Torre Kaiba.`, reaction);
            } else if (enc.stage === 'semi') {
                state.towerStage = 'final';
                logEvent(state, '🏆', `Batti ${name} in semifinale alla Torre Kaiba.`);
                saveState(state);
                // L'altra semifinale si decide adesso (playerFinalOpponent
                // la simula alla prima chiamata): si può finalmente dire
                // chi ha vinto e chi è stato eliminato dall'altra parte del
                // tabellone. I due contendenti erano i vincitori dei quarti
                // 2 e 3, quindi il perdente è quello che NON è passato.
                const finalista = playerFinalOpponent(state);
                const sfidanti = [state.bracket.quarterWinners[2], state.bracket.quarterWinners[3]];
                const eliminato = sfidanti.find((id) => id && id !== finalista);
                TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'final', state, saveState, {
                    avversario: nameOf(finalista),
                    sconfitto: eliminato ? nameOf(eliminato) : ''
                });
                showToast(`🏆 ${name} è fuori! Ti resta solo la finale, in cima alla torre.`, reaction);
            } else {
                state.phase = 'champion';
                state.towerStage = null;
                logEvent(state, '👑', `Batti ${name} in finale: sei Campione di Battle City!`);
                // Premio di completamento: assegnato PRIMA di incrementare
                // 'completions', così `primaVolta` è vero solo alla vera
                // prima vittoria (dopo l'incremento il contatore sarebbe
                // già a 1 e il raddoppio non scatterebbe mai).
                const primaVolta = (SaveManager.getTournamentStats(TOURNAMENT_ID).completions || 0) === 0;
                state.rewards = window.Rewards ? Rewards.forTournament(TOURNAMENT_ID, primaVolta, state.difficulty) : [];
                SaveManager.incrementTournamentStat(TOURNAMENT_ID, 'completions');
                saveState(state);
                TournamentDialogues.mostraUnaVolta(TOURNAMENT_ID, 'champion', state, saveState);
                showToast(`👑 Hai sconfitto ${name}! Sei il Campione di Battle City!`, reaction);
            }
            saveState(state);
            return true;
        }

        // --- Preliminari in città: si gioca la posta ---
        if (state.grid && enc.cellIndex != null && state.grid.cells[enc.cellIndex]) {
            state.grid.cells[enc.cellIndex].resolved = true;
        }
        ensureExtras(state);
        if (won) {
            // Il guadagno e' limitato dal tetto del quartiere (vedi LOC_DUELLI_PER_QUARTIERE).
            const guadagno = Math.min(enc.wager, locazioniRimasteQuartiere(state));
            state.locators += guadagno;
            if (guadagno > 0) {
                const idQ = state.grid && state.grid.districtId;
                state.locatoriVinte = state.locatoriVinte || {};
                state.locatoriVinte[idQ] = (state.locatoriVinte[idQ] || 0) + guadagno;
            }
            logEvent(state, '⚔️', `Vittoria su ${name} (+${guadagno}).`);
            // Missione secondaria: vale solo battendo il bersaglio indicato,
            // nella sua casella, in questo distretto.
            let bonusMissione = '';
            if (state.quest && enc.cellIndex === state.quest.cellIndex && enc.characterId === state.quest.characterId) {
                const premioCrediti = Number(state.quest.rewardCredits) || randomCreditReward(QUEST_CREDIT_REWARD);
                SaveManager.addCurrency('credits', premioCrediti);
                logEvent(state, '🎯', `Missione compiuta: ${name} battuto (+${premioCrediti} crediti).`);
                bonusMissione = ` <strong>Missione compiuta: +${premioCrediti} crediti!</strong>`;
                state.quest = null;
            }
            if (window.NativeHaptics) NativeHaptics.success();
            saveState(state);
            showToast(`⚔️ Hai sconfitto ${name}! ${guadagno > 0 ? `<strong>+${guadagno} Carta Locazione</strong>.` : '<strong>Nessuna Locazione: il quartiere ha già dato le sue.</strong>'}${bonusMissione}`, reaction);
        } else {
            // Lo Scudo del Duel Disk dimezza (per difetto) la posta persa:
            // con una sola Carta Locazione in gioco non si perde niente.
            let persa = enc.wager;
            let protetto = false;
            if (persa > 0 && consumeShield(state)) {
                persa = Math.floor(enc.wager / 2);
                protetto = true;
            }
            state.locators = Math.max(0, state.locators - persa);
            logEvent(state, '💀', `Sconfitta contro ${name} (−${persa}${protetto ? ', Scudo del Duel Disk' : ''}).`);
            if (state.locators <= 0) state.eliminated = true;
            if (window.NativeHaptics) NativeHaptics.error();
            saveState(state);
            showToast(`💀 ${name} ti ha battuto. <strong>−${persa} Carta Locazione</strong>${protetto ? ` (lo Scudo ha dimezzato la posta di ${enc.wager})` : ''}.`, reaction);
        }
        return true;
    }

        document.getElementById('menuAbandonConfirm').style.display = 'block';
    };
    document.getElementById('menuAbandonCancelBtn').onclick = () => {
        document.getElementById('menuOptionsList').style.display = 'grid';
        document.getElementById('menuAbandonConfirm').style.display = 'none';
    };
    document.getElementById('menuAbandonConfirmBtn').onclick = () => {
        saveState(null);
        menuModal.classList.remove('open');
        render();
    };
    document.getElementById('menuLogBtn').onclick = () => {
        menuModal.classList.remove('open');
        const state = loadState();
        document.getElementById('logLocators').textContent = state ? state.locators : 0;
        const list = document.getElementById('logList');
        const history = (state && state.history) || [];
        if (history.length === 0) {
            list.innerHTML = '<p class="log-empty">Il diario è ancora vuoto.</p>';
        } else {
            list.innerHTML = history.slice().reverse()
                .map((h) => `<div class="log-item"><span>${h.icon}</span><span>${h.text}</span></div>`)
                .join('');
        }
        logModal.classList.add('open');
    };
    document.getElementById('logCloseBtn').onclick = () => logModal.classList.remove('open');
    [menuModal, logModal].forEach((m) => {
        m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('open'); });
    });

    // ================================================================
    // Render principale — macchina a stati
    // ================================================================
    function render() {
        let state = loadState();
        if (!state) {
            renderHud(null);
            hudBackBtn.style.display = 'block';
            renderStartScreen();
            return;
        }
        hudBackBtn.style.display = 'none';
        renderHud(state);

        if (state.eliminated) { renderEliminated(state); return; }
        if (state.phase === 'champion') { renderChampion(state); return; }

        if (state.pendingEncounter) {
            // Esito fresco del duello appena giocato? Allora si consuma e
            // si prosegue; altrimenti l'incontro è rimasto in sospeso.
            if (resolvePendingEncounterIfDone(state)) { render(); return; }
            renderResumeEncounter(state);
            return;
        }

        if (state.phase === 'airship') { renderAirship(state); return; }
        if (state.phase === 'tower') { renderTower(state); return; }
        if (!state.grid) buildSector(state);
        renderCity(state);
    }

    // La colonna sonora giusta va scelta PRIMA di initAudioManager, così
    // riaprendo il torneo già dentro le finali non si carica per un
    // istante il brano della città per poi scartarlo subito.
    const bootState = loadState();
    const bootPhase = (bootState && bootState.phase) || 'city';
    currentPhaseTrack = PHASE_TRACKS[bootPhase] || PHASE_TRACKS.city;
    initAudioManager({ trackSrc: currentPhaseTrack });

    // Le immagini di fase vanno risolte prima del primo render: da lì
    // dipendono sia lo sfondo della mappa sia il campo passato al duello.
    preloadPhaseImages().then(render);
</script>
</body>
