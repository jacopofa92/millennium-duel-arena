<title>Yu-Gi-Oh! Millennium Duel Arena — Storia</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Stesso blocco di ogni altra pagina del gioco. overscroll-behavior:
       niente stiramento elastico quando si trascina oltre il bordo e
       niente "tira per ricaricare" — su una pagina di gioco quel gesto è
       a un dito di distanza dal ricaricare tutto. Va su html E su body:
       la regola vale per l'elemento che scorre DAVVERO, e dichiararla
       solo su html non copre le pagine dove a scorrere è il body. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #0b0d14;
        color: #e8e2d0;
        min-height: 100vh;
    }
    :root { --gold: #f7d774; --gold-strong: #f39c12; }

    /* La pagina è una colonna alta quanto lo schermo, così la mappa può
       prendersi tutto lo spazio che avanza sotto l'intestazione invece di
       accontentarsi di una frazione fissa dell'altezza. La catena dei
       `flex: 1` + `min-height: 0` va tenuta intera: basta che un anello
       torni ad `auto` perché il figlio non sappia più quanto è alto e la
       mappa collassi. */
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    /* La mappa riempie lo schermo: il margine in fondo per il pulsante Indietro (topbar.css) le toglierebbe
       altezza. Qui Indietro resta semplicemente sopra l'angolo della mappa. */
    body.tb-indietro-basso { padding-bottom: 0; }
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 18px 16px 18px;
        /* Nessun limite di larghezza qui: lo vuole solo l'ELENCO delle
           campagne, che è testo da leggere. La mappa va larga quanto lo
           schermo. */
        width: 100%;
        margin: 0 auto;
    }
    /* L'elenco delle campagne resta di larghezza leggibile e centrato. */
    #sceltaCampagna { width: 100%; max-width: 1100px; margin: 0 auto; }

    /* --- Scelta della campagna ------------------------------------ */
    /* Revamp (richiesta dell'utente "migliora anche la UI del menu
       storia"): ogni campagna è una scheda con in testa il disegno della
       SUA mappa, l'emblema in un rombo d'oro (lo stesso motivo del logo e
       della barra in alto), il ritratto di chi la si gioca, e sotto la
       barra dell'avanzamento, i livelli e un invito chiaro — Inizia,
       Continua, Rigioca. Prima erano righe di testo tutte uguali. */
    .storie-testa { text-align: center; margin: 6px 0 18px; }
    .storie-titolo {
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, 'URW Palladio L', 'Noto Serif', Georgia, serif;
        font-size: clamp(1.5rem, 3.4vw, 2.1rem); font-weight: 700; letter-spacing: 0.08em;
        background: linear-gradient(180deg, #fff6dc 0%, #f7d774 45%, #f39c12 85%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .storie-sotto { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: #a99c7d; margin-top: 4px; }
    .campagne {
        display: grid; gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
    }
    .campagna {
        position: relative;
        display: flex; flex-direction: column;
        text-align: left; width: 100%;
        padding: 0; overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(247, 215, 116, 0.3);
        background: linear-gradient(180deg, rgba(26, 21, 14, 0.96), rgba(10, 9, 13, 0.98));
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        color: inherit; font: inherit; cursor: pointer;
        transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .campagna:hover { transform: translateY(-3px); border-color: rgba(247, 215, 116, 0.75); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 22px rgba(243, 156, 18, 0.18); }
    .campagna:active { transform: translateY(0) scale(0.99); }
    .campagna:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .campagna--bloccata { cursor: default; }
    .campagna--bloccata:hover { transform: none; border-color: rgba(247, 215, 116, 0.3); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); }

    /* La testata: la mappa della campagna, velata verso il basso perché
       il nome che le sta sopra si legga. I candidati di `sfondo` sono
       livelli CSS impilati: se il primo manca resta visibile il secondo. */
    .campagna-banner {
        position: relative; height: 128px;
        background-size: cover; background-position: center;
        transition: transform 0.5s ease;
    }
    .campagna:hover .campagna-banner { transform: scale(1.04); }
    .campagna-banner::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(10, 9, 13, 0.1) 0%, rgba(10, 9, 13, 0.55) 60%, rgba(22, 18, 12, 1) 100%);
    }
    .campagna--bloccata .campagna-banner { filter: grayscale(1) brightness(0.45); }
    .campagna-emblema {
        position: absolute; left: 18px; bottom: -22px; z-index: 2;
        width: 50px; height: 50px; transform: rotate(45deg);
        display: grid; place-items: center;
        border-radius: 11px;
        border: 2px solid rgba(247, 215, 116, 0.75);
        background: linear-gradient(135deg, #3a2e1c, #15120e);
        box-shadow: 0 0 0 3px rgba(12, 10, 8, 0.9), 0 0 18px rgba(243, 156, 18, 0.35);
    }
    .campagna-emblema span { transform: rotate(-45deg); font-size: 1.5rem; }
    /* Il ritratto di chi la si gioca, in un medaglione a destra. */
    .campagna-ritratto {
        position: absolute; right: 16px; bottom: -26px; z-index: 2;
        width: 62px; height: 62px; border-radius: 50%; overflow: hidden;
        border: 2px solid rgba(247, 215, 116, 0.7);
        box-shadow: 0 0 0 3px rgba(12, 10, 8, 0.9), 0 6px 16px rgba(0, 0, 0, 0.5);
        background: #15120e;
    }
    .campagna-ritratto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .campagna--bloccata .campagna-ritratto { filter: grayscale(1); opacity: 0.6; }

    .campagna-corpo { position: relative; z-index: 1; padding: 30px 18px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .campagna-nome {
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, 'URW Palladio L', 'Noto Serif', Georgia, serif;
        font-size: 1.3rem; font-weight: 700; letter-spacing: 0.03em; line-height: 1.15;
        color: var(--gold); padding-right: 64px;
    }
    .campagna-sottotitolo { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: #a99c7d; padding-right: 64px; }
    .campagna-desc { font-size: 0.83rem; line-height: 1.5; color: #d8d0bc; margin-top: 2px; }
    .campagna--bloccata .campagna-nome { color: #8a806b; }

    /* Avanzamento: barra, poi i livelli come piccole pastiglie. */
    .campagna-piede { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 9px; }
    .campagna-barra { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .campagna-barra > i {
        display: block; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #c9770a, var(--gold));
        box-shadow: 0 0 10px rgba(243, 156, 18, 0.55);
    }
    .campagna-riga { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .campagna-livelli { display: flex; gap: 6px; flex-wrap: wrap; }
    .campagna-livello {
        font-size: 0.64rem; font-weight: 800; letter-spacing: 0.06em;
        padding: 3px 9px; border-radius: 999px;
        border: 1px solid rgba(247, 215, 116, 0.35); color: #e8dcb8;
        background: rgba(247, 215, 116, 0.06);
    }
    .campagna-livello--attivo { border-color: var(--gold); background: rgba(247, 215, 116, 0.18); color: #fff3cf; }
    .campagna-livello--finito { border-color: rgba(111, 224, 138, 0.6); color: #aef0bd; }
    .campagna-livello--chiuso { opacity: 0.45; }
    .campagna-invito {
        font-size: 0.78rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;
        padding: 8px 16px; border-radius: 999px;
        background: linear-gradient(135deg, #f7d774, #f39c12); color: #2a1c05;
        box-shadow: 0 6px 16px rgba(243, 156, 18, 0.3);
        white-space: nowrap;
    }
    .campagna-invito--rigioca { background: rgba(247, 215, 116, 0.12); color: var(--gold); border: 1px solid rgba(247, 215, 116, 0.5); box-shadow: none; }
    .campagna-invito--chiuso { background: rgba(255, 255, 255, 0.06); color: #8a806b; box-shadow: none; }
    @media (max-width: 480px) {
        .campagna-banner { height: 104px; }
        .campagna-nome { font-size: 1.12rem; }
        .campagna-desc { font-size: 0.8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
        .campagna, .campagna-banner { transition: none; }
        .campagna:hover, .campagna:hover .campagna-banner { transform: none; }
    }

    /* --- Mappa della campagna ------------------------------------- */
    .mappa-intestazione {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .mappa-titolo { font-size: 1.05rem; font-weight: 900; color: var(--gold); }
    .mappa-capitolo { font-size: 0.72rem; opacity: 0.75; letter-spacing: 1.5px; text-transform: uppercase; }
    /* La riga qui sopra dice DOVE sei ("Capitolo 4 di 7"), questa dice di
       cosa si tratta. Tono diverso apposta — niente maiuscoletto, niente
       spaziatura allargata — perché si legge come una frase e non come
       un'etichetta. Larghezza limitata per restare leggibile: una riga di
       prosa lunga quanto uno schermo desktop si segue male. */
    .mappa-capitolo-testo {
        margin-top: 6px;
        max-width: 56ch;
        font-size: 0.86rem;
        line-height: 1.5;
        opacity: 0.85;
    }
    /* La mappa si prende tutta l'altezza rimasta sotto l'intestazione e
       la striscia dei capitoli, invece di una frazione fissa dello
       schermo: era 62vh, cioè quasi sempre una finestrella con parecchio
       vuoto sotto. `min-height` è la rete di sicurezza per gli schermi
       molto bassi, dove ciò che avanza non basterebbe. */
    #vistaMappa { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    /* SERVE, non è ridondante: la regola qui sopra è un selettore di id,
       quindi batte per specificità il `display: none` che il browser dà
       da sé a [hidden]. Senza questa riga la vista mappa non si nasconde
       MAI, e sull'elenco delle campagne restavano appesi in fondo i suoi
       pezzi statici — i pulsanti "← Campagne"/"Ricomincia" e la barra
       dell'avanzamento — sotto le schede delle storie. */
    #vistaMappa[hidden] { display: none; }
    #mappaViewport { flex: 1; min-height: 300px; }
    /* Passaggio da una mappa all'altra dello stesso percorso (l'isola e
       gli interni del castello): il disegno nuovo emerge invece di
       sostituire di colpo il vecchio, così si legge come un cambio di
       luogo. */
    #mappaViewport.cambio-mappa .nm-canvas { animation: cambioMappa 0.7s ease-out both; }
    @keyframes cambioMappa {
        from { opacity: 0; filter: blur(6px) brightness(1.6); }
        to   { opacity: 1; filter: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        #mappaViewport.cambio-mappa .nm-canvas { animation: none; }
    }
    /* Un passaggio non è una tappa: niente ritratto né duello, è una
       porta. Anello tratteggiato invece che pieno, così a colpo d'occhio
       non lo si scambia per un incontro. */
    .nm-node--passaggio .nm-dot {
        border-style: dashed;
        background: radial-gradient(circle, rgba(247,215,116,0.25), rgba(12,10,6,0.85));
    }

    /* Il riassunto che apre e chiude il resto: esiste SOLO su schermi
       stretti (vedi il @media in fondo). Su desktop lo spazio non manca e
       nascondere le informazioni sarebbe solo un clic in più. */
    .mappa-toggle { display: none; }
    .mappa-toggle-freccia { transition: transform 0.2s ease; }
    .mappa-toggle[aria-expanded="true"] .mappa-toggle-freccia { transform: rotate(180deg); }

    /* Striscia dei capitoli: scorre in orizzontale su schermi stretti
       invece di andare a capo, così resta una riga sola e si capisce che
       è una sequenza. */
    .capitoli {
        display: flex; gap: 8px; margin-bottom: 8px;
        overflow-x: auto; padding-bottom: 4px;
        scrollbar-width: thin;
    }
    .cap {
        flex: none; display: flex; align-items: center; gap: 7px;
        padding: 6px 11px; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.3);
        font-size: 0.7rem; opacity: 0.55;
    }
    .cap--fatto { opacity: 0.85; border-color: rgba(247, 215, 116, 0.35); }
    .cap--corrente {
        opacity: 1;
        border-color: var(--gold);
        background: rgba(247, 215, 116, 0.12);
        box-shadow: 0 0 14px rgba(247, 215, 116, 0.2);
    }
    .cap-nome { font-weight: 800; white-space: nowrap; }
    .cap--corrente .cap-nome { color: var(--gold); }
    .cap-conta { font-size: 0.64rem; opacity: 0.8; font-variant-numeric: tabular-nums; }

    /* Livello della partita: tre pillole come quelle dei capitoli, ma
       cliccabili. Quella attiva è d'oro pieno; una bloccata è spenta e
       porta il lucchetto, col motivo nel title. */
    .livelli { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .livelli-etichetta {
        font-size: 0.66rem; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.7;
    }
    .livello {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 13px; border-radius: 999px; font: inherit; font-size: 0.78rem; font-weight: 800;
        border: 1px solid rgba(247, 215, 116, 0.35); background: rgba(0, 0, 0, 0.3);
        color: #e8dfc8; cursor: pointer;
    }
    .livello:hover:not(:disabled) { border-color: var(--gold); }
    .livello:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .livello--attivo {
        border-color: var(--gold); color: #1b1407;
        background: linear-gradient(180deg, #f7d774, #d9a534);
        box-shadow: 0 0 14px rgba(247, 215, 116, 0.3); cursor: default;
    }
    .livello:disabled:not(.livello--attivo) { opacity: 0.45; cursor: not-allowed; border-color: rgba(255, 255, 255, 0.14); }
    .livello-segno { font-size: 0.72rem; }

    .avanzamento { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avanzamento-barra {
        flex: 1; height: 5px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
    }
    .avanzamento-riempi {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, var(--gold-strong), var(--gold));
        transition: width 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .avanzamento-testo { font-size: 0.68rem; opacity: 0.75; font-variant-numeric: tabular-nums; }

    /* L'elenco delle carte che una campagna non accetta: e' la parte
       utile del divieto, quindi si legge senza fatica. */
    .fuori-tema {
        list-style: none;
        margin: 10px 0 4px;
        max-height: 40vh;
        overflow-y: auto;
    }
    .fuori-tema li {
        font-size: 0.82rem;
        line-height: 1.45;
        padding: 5px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .barra-azioni { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn {
        padding: 9px 16px; border-radius: 999px;
        border: 1px solid rgba(247, 215, 116, 0.45);
        background: rgba(247, 215, 116, 0.08);
        color: var(--gold); font-weight: 800; font-size: 0.78rem;
        cursor: pointer;
    }
    .btn:hover { background: rgba(247, 215, 116, 0.18); }
    .btn--spento { border-color: rgba(255, 255, 255, 0.18); color: #cfc8b6; background: rgba(0, 0, 0, 0.3); }

    /* --- Riquadri di servizio ------------------------------------------
       Le SCENE della storia non stanno più qui: sono intermezzi a
       dialoghi a piena schermata (js/ui/story-cutscene.*). Queste regole
       restano per i due riquadri che non sono racconto ma avvisi — il
       mazzo fuori tema e le ricompense di fine campagna — e che devono
       leggersi come il resto dell'interfaccia, non come una scena. */
    .scena-fondo {
        position: fixed; inset: 0; z-index: 60;
        background: rgba(4, 5, 10, 0.92);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .scena {
        max-width: 620px; width: 100%;
        border-radius: 20px; padding: 24px;
        border: 1px solid rgba(247, 215, 116, 0.35);
        background: linear-gradient(160deg, rgba(28, 24, 18, 0.96), rgba(12, 12, 18, 0.98));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .scena-chi { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    .scena-riga { font-size: 0.95rem; line-height: 1.6; margin-bottom: 10px; }
    .scena .btn { margin-top: 10px; }

    /* --- Messaggi -------------------------------------------------- */
    .avviso {
        margin-bottom: 14px; padding: 11px 14px; border-radius: 14px;
        font-size: 0.84rem; line-height: 1.4;
        border: 1px solid rgba(247, 215, 116, 0.3);
        background: rgba(247, 215, 116, 0.08);
    }
    .avviso--perso { border-color: rgba(220, 90, 90, 0.4); background: rgba(220, 90, 90, 0.1); }

    /* Schermi stretti O BASSI. La seconda condizione non è un di più: un
       telefono ruotato in orizzontale è largo 852px — quindi fuori dal
       primo limite — ma alto 393, e lì l'intestazione si mangiava quasi
       tutto lo schermo lasciando alla mappa una striscia di 150px.
       Misurato, non temuto. */
    @media (max-width: 700px), (max-height: 560px) {
        .main { padding: 10px 10px 12px; }
        /* Su schermi stretti la mappa continua a prendersi tutto lo
           spazio rimasto (vedi il flex più sopra): qui basta abbassare la
           rete di sicurezza, perché su un telefono in orizzontale 300px
           sarebbero già quasi tutta la finestra. */
        #mappaViewport { min-height: 220px; }

        /* Tutto ciò che sta SOPRA la mappa si stringe, perché ogni pixel
           che non usa lo prende la mappa. Su un telefono da 852px di
           altezza l'intestazione ne occupava 306 — più di un terzo dello
           schermo per del testo che si legge una volta. */
        .mappa-intestazione { gap: 8px; margin-bottom: 8px; }
        .mappa-titolo { font-size: 0.98rem; }
        .mappa-capitolo-testo {
            margin-top: 4px;
            font-size: 0.78rem;
            line-height: 1.4;
            /* Due righe e poi basta: la descrizione del capitolo è un
               invito, non un testo da studiare, e più in basso c'è la
               mappa. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .capitoli { gap: 6px; margin-bottom: 6px; }
        .cap { padding: 5px 9px; }
        .avanzamento { gap: 8px; margin-bottom: 8px; }

        /* IL COLLAPSE. Chiuso resta solo questa riga, e tutto il resto
           dello schermo è mappa. */
        .mappa-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            /* 44px pieni: è una cosa che si tocca spesso. */
            min-height: 44px;
            padding: 8px 14px;
            margin-bottom: 8px;
            border-radius: 14px;
            border: 1px solid rgba(247, 215, 116, 0.3);
            background: rgba(247, 215, 116, 0.07);
            color: var(--gold);
            font: 800 0.8rem/1.3 inherit;
            text-align: left;
            cursor: pointer;
        }
        .mappa-toggle:active { transform: scale(0.99); }
        .mappa-toggle-testo { min-width: 0; }
        #vistaMappa.compatto .mappa-dettagli { display: none; }
    }
</style>
</head>
<body>
<script src="js/ui/page-loader.js"></script>
<div id="topbarMount"></div>

<main class="main">
    <div id="avvisoMount"></div>

    <!-- Scelta della campagna: unica cosa visibile finché non se ne apre una. -->
    <section id="sceltaCampagna">
        <div class="storie-testa">
            <div class="storie-titolo">Le Storie</div>
            <div class="storie-sotto">Scegli quale leggenda rivivere</div>
        </div>
        <div class="campagne" id="campagneLista"></div>
    </section>

    <!-- Mappa della campagna aperta. -->
    <section id="vistaMappa" hidden>
        <!-- Solo su schermi stretti: una riga sola che riassume dove sei e
             apre/chiude tutto il resto. Su un telefono quelle informazioni
             occupavano un terzo dello schermo per del testo che si legge
             una volta, mentre la mappa è la cosa con cui si interagisce. -->
        <button type="button" class="mappa-toggle" id="mappaToggle" aria-expanded="false" aria-controls="mappaDettagli">
            <span class="mappa-toggle-testo" id="mappaToggleTesto"></span>
            <span class="mappa-toggle-freccia" aria-hidden="true">▾</span>
        </button>

        <div class="mappa-dettagli" id="mappaDettagli">
        <div class="mappa-intestazione">
            <div>
                <div class="mappa-titolo" id="mappaTitolo"></div>
                <div class="mappa-capitolo" id="mappaCapitolo"></div>
                <!-- Di cosa parla il capitolo in corso. Vuoto (e nascosto)
                     se quel capitolo non lo dichiara: il campo `testo` del
                     catalogo è facoltativo. -->
                <div class="mappa-capitolo-testo" id="mappaCapitoloTesto" hidden></div>
            </div>
            <div class="barra-azioni">
                <button type="button" class="btn btn--spento" id="btnIndietro">← Campagne</button>
                <button type="button" class="btn btn--spento" id="btnRicomincia">Ricomincia</button>
            </div>
        </div>
        <!-- Livello di difficoltà della partita (Facile/Normale/Difficile),
             solo sulla mappa della campagna e solo se la campagna ne ha. -->
        <div class="livelli" id="livelliMount" hidden></div>
        <!-- Striscia dei capitoli + avanzamento complessivo: dove sei e
             quanto manca, senza dover contare i pallini sulla mappa. -->
        <div class="capitoli" id="capitoliMount"></div>
        <div class="avanzamento">
            <span class="avanzamento-barra"><span class="avanzamento-riempi" id="avanzamentoRiempi"></span></span>
            <span class="avanzamento-testo" id="avanzamentoTesto"></span>
        </div>
        </div><!-- /.mappa-dettagli -->
        <div id="mappaViewport"></div>
    </section>
</main>

<script src="js/data/characters-db.js"></script>

<!-- I ritocchi dell'Editor Mappa (js/story/story-ritocchi.js): subito dopo il catalogo. -->
<script src="js/data/story-ritocchi.js"></script>
<script src="js/story/story-ritocchi.js"></script>
<!-- Le Sfide delle storie avanzano QUI: è questa pagina, non il duello,

<script src="js/ui/ambiente-mappe-storia.js"></script>
<!-- Il livello di Dettagli video: la polvere dorata nelle scene e sulla
     mappa si accende solo su "Alti", come gli ologrammi in duello. Va
     PRIMA di chi la interroga. -->

<!-- Le scene a dialoghi. characters-db.js è già caricato più sopra: è da
     lì che il componente prende nome e ritratto di chi parla. -->
<script src="js/ui/story-cutscene.js"></script>

<script src="js/ui/deck-switcher.js"></script>
