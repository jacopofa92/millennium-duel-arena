# render.yaml — come mettere online il Server di Stanze del Multiplayer
# =====================================================================
# "Blueprint" di Render: leggendo questo file, il servizio si configura
# da sé (niente campi da riempire a mano nel pannello, e la
# configurazione resta versionata qui insieme al codice invece che
# esistere solo dentro un account).
#
# Procedura, una volta sola:
#   1. render.com -> Sign up con GitHub
#   2. New -> Blueprint -> scegli il repository millennium-duel-arena -> Apply
#   3. Il servizio nasce all'indirizzo https://<name>.onrender.com
#      Se quel nome risultasse già preso da qualcun altro, Render ne
#      assegna uno diverso: in quel caso va aggiornato il valore
#      predefinito del campo "Indirizzo del server" in multiplayer.html
#      (con wss://, non https://).
#
# PIANO GRATUITO, il limite da conoscere: l'istanza viene sospesa dopo
# 15 minuti senza traffico e impiega circa un minuto a tornare su alla
# richiesta successiva. Durante una partita non succede mai (i messaggi
# del duello sono traffico), ma la PRIMA connessione dopo una pausa
# lunga aspetta — per questo js/multiplayer/network.js insiste invece di
# arrendersi al primo tentativo, e la lobby spiega l'attesa.
services:
  - type: web
    # Il nome DECIDE l'indirizzo pubblico (https://<name>.onrender.com),
    # e gli hostname .onrender.com sono globali: un nome generico o in
    # inglese ha buone probabilità di essere già occupato da qualcun
    # altro, e in quel caso Render ne assegna uno diverso da questo —
    # rompendo il valore predefinito scritto in multiplayer.html.
    # Verificato sul campo: "duelarena", il nome corto e ovvio, è già di
    # qualcun altro — da qui questo nome più lungo, che è invece libero e
    # corrisponde al servizio realmente online.
    # NOTA: questo nome NON è il "Blueprint Name" chiesto da Render al
    # momento dell'Apply — quello è solo l'etichetta del gruppo dentro il
    # proprio workspace (lì il blueprint si chiama "DuelArena") e non
    # compare in alcun indirizzo.
    # Cambiarlo NON rinomina il servizio esistente: alla sincronizzazione
    # successiva Render ne creerebbe un SECONDO, lasciando il primo attivo.
    # 2026-10-11: rinominato da "yugioh-duel-arena-relay" col nuovo nome del
    # gioco (Millennium Duel Arena). Come detto qui sopra, Render ha creato un
    # servizio NUOVO con questo nome: il vecchio si elimina a mano dal
    # pannello, dopo aver spostato su questo l'indirizzo in multiplayer.html.
    name: millennium-duel-arena-relay
    runtime: node
    plan: free
    region: frankfurt # il più vicino all'Italia tra quelli disponibili
    # NIENTE build: server.js usa solo moduli nativi di Node (http,
    # crypto, net). Va detto esplicitamente perché il comando predefinito
    # di Render sarebbe `npm install`, che qui scaricherebbe Playwright —
    # centinaia di MB di dipendenza di TEST, inutile in produzione.
    buildCommand: echo "Nessuna dipendenza da installare"
    startCommand: node server/server.js
    envVars:
      - key: MP_REQUIRE_AUTH
        value: "1"
    # server.js risponde già 200 su "/" (vedi lì): serve a Render per
    # sapere che il processo è vivo, e a chiunque per controllare a occhio
    # se il server è sveglio aprendo l'indirizzo nel browser.
    healthCheckPath: /
    # Si ridistribuisce SOLO quando cambia il relay (o la forma dei messaggi che controlla). Prima ogni push su main, anche di
    # una carta o di un'immagine, faceva ripartire il processo: tutte le stanze e le partite in corso sparivano all'istante
    # ("impossibile collegarsi al server" mentre si era in sala, proprio durante le prove). Il file protocollo-mp.js e' condiviso
    # coi client: se cambia, il relay deve ripartire con quello nuovo.
    buildFilter:
      paths:
        - server/**
        - js/multiplayer/protocollo-mp.js
        - render.yaml
