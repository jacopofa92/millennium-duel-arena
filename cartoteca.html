<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->
<style>@view-transition { navigation: auto; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Colore di sfondo applicato SUBITO, prima ancora che gli script
     bloccanti sotto (auth-gate/supabase) finiscano di scaricare: senza
     questo la pagina resta bianca/scoperta per l'intera durata del
     download, poi scatta di colpo al nero dell'overlay di auth-gate —
     un flash segnalato dall'utente. Stesso colore esatto dell'overlay
     di auth-gate.js e dello sfondo di page-loader.css, così la
     transizione è invisibile invece che un salto di tonalità. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Millennium">
<script src="js/ui/error-recovery.js"></script>
<!-- Accesso obbligatorio (js/cloud/auth-gate.js) — vedi il commento lì:
     rimanda a index.html se non c'è una sessione approvata. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/cloud/supabase-config.js"></script>
<script src="js/cloud/cloud-sync.js"></script>
<script src="js/cloud/auto-sync.js"></script>
<script src="js/cloud/auth-gate.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="stylesheet" href="js/ui/page-loader.css">
<link rel="preload" href="audio/soundtracks/56. Battle for the Millennium.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<!-- Ritratto del giocatore in fondo alla topbar: lo monta PageTopbar. -->
<link rel="stylesheet" href="js/ui/deck-switcher.css">
<title>Yu-Gi-Oh! Millennium Duel Arena — Cartoteca</title>
<link rel="stylesheet" href="js/ui/card.css">
<link rel="stylesheet" href="js/ui/card-detail.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi.
       -webkit-tap-highlight-color: via anche il rettangolo azzurrino che
       il browser mobile dipinge sopra QUALUNQUE elemento toccato —
       segnalato dall'utente tenendo premuto. Non toglie alcun riscontro
       al tocco: i pulsanti del gioco hanno il proprio stato ":active",
       che quel rettangolo si limitava a coprire con un colore di sistema
       estraneo alla tavolozza. Il contorno di messa a fuoco da tastiera
       resta intatto: quello NON passa da questa proprietà.
       overscroll-behavior: niente rimbalzo elastico quando si trascina
       la pagina oltre il bordo, e niente "tira per ricaricare" — su una
       pagina di gioco quel gesto e' a un dito di distanza dal ricaricare
       tutto a meta' duello. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14;
        min-height: 100vh;
    }
    /* Fondale sullo strato FISSO insieme alla sfumatura, non sul
       background di body: con `html, body { background }` (toppa
       anti-flash) la propagazione alla canvas si disattiva e il
       background di body resta ritagliato dentro il suo box, alto un
       solo viewport (height: 100%) — scorrendo comparirebbe una fascia
       nera sotto l'immagine. Un elemento position:fixed copre sempre il
       viewport, qualunque sia l'altezza del contenuto. */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            linear-gradient(180deg, rgba(6,7,12,0.45) 0%, rgba(6,7,12,0.55) 60%, rgba(4,5,8,0.65) 100%),
            url('images/background/backgroundMenu.jpg') center/cover no-repeat;
        pointer-events: none;
    }

    :root {
        --card-w: var(--carta-griglia);
        --card-h: calc(var(--card-w) / var(--card-ratio));
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --blue: #3498db;
        --red: #e74c3c;
    }

    /* ============================================================
       Topbar: markup/CSS generati da js/ui/topbar.js + js/ui/topbar.css
       (.topbar/.topbar-title canonici, non più .cartoteca-topbar/
       .cartoteca-title — nulla in questa pagina dipendeva dai nomi
       specifici, solo dall'altezza risultante, invariata).
       Override SOLO per questa pagina (richiesta esplicita dell'utente):
       il titolo "Cartoteca" è bianco pieno invece del gradiente oro
       standard di PageTopbar — le altre ~10 pagine che usano lo stesso
       componente condiviso restano invariate. Era stato messo nero pieno
       in una sessione precedente su richiesta dell'utente, ma risultava
       quasi invisibile sullo sfondo scuro della topbar: corretto in bianco.
       ============================================================ */
    #cartotecaTopbar .topbar-title {
        background: none;
        -webkit-background-clip: border-box;
        background-clip: border-box;
        -webkit-text-fill-color: #fff;
        color: #fff;
        text-shadow: none;
    }
    .cartoteca-count {
        margin-left: auto;
        font-size: 0.85rem;
        font-weight: 700;
        color: #cdd6ea;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 6px 14px;
        border-radius: 999px;
        white-space: nowrap;
    }
    /* ============================================================
       Filtri
       ============================================================ */
    .cartoteca-filters {
        position: sticky;
        top: 69px;
        z-index: 25;
        background: linear-gradient(180deg, rgba(14,14,20,0.96), rgba(14,14,20,0.9));
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 14px 22px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    /* Barra sempre visibile: ricerca + ordinamento + interruttore filtri.
       I filtri veri e propri (chip di tipo/livello/razza/...) stanno nel
       pannello sotto, chiuso di default — prima erano SEMPRE aperti e
       occupavano una fetta enorme di schermo ad ogni apertura pagina. */
    .filter-bar-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
    }
    .filter-sort {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #dfe7f7;
        font-family: inherit;
        font-size: 0.83rem;
        outline: none;
        cursor: pointer;
    }
    .filter-sort:focus { border-color: var(--gold-strong); }
    .filter-toggle-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #dfe7f7;
        font-family: inherit;
        font-size: 0.83rem;
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
    }
    .filter-toggle-btn:hover { border-color: rgba(247,215,116,0.5); }
    .filter-toggle-btn.has-active {
        border-color: var(--gold-strong);
        background: rgba(243,156,18,0.15);
    }
    .filter-toggle-badge {
        display: none;
        background: var(--gold-strong);
        color: #1a1408;
        font-size: 0.68rem;
        font-weight: 800;
        padding: 1px 7px;
        border-radius: 999px;
    }
    .filter-toggle-badge.show { display: inline-block; }
    .filter-toggle-arrow { font-size: 0.65rem; opacity: 0.7; transition: transform 0.25s ease; }
    .filter-toggle-btn.open .filter-toggle-arrow { transform: rotate(180deg); }

    /* Pannello filtri: chiuso di default (max-height:0), si apre solo su
       richiesta. max-height (non height:auto) perché è l'unico modo per
       animare in CSS puro un contenuto di altezza non nota a priori. */
    .filter-panel {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.3s cubic-bezier(0.16,0.84,0.44,1), opacity 0.25s ease, margin-top 0.3s ease;
    }
    .filter-panel.open {
        max-height: 1000px;
        opacity: 1;
        margin-top: 14px;
    }
    .filter-search {
        position: relative;
        flex: 1 1 240px;
        max-width: 480px;
    }
    .filter-search input {
        width: 100%;
        padding: 11px 16px 11px 40px;
        border-radius: 999px;
        border: 1px solid rgba(247,215,116,0.35);
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .filter-search input::placeholder { color: rgba(255,255,255,0.45); }
    .filter-search input:focus {
        border-color: var(--gold-strong);
        box-shadow: 0 0 0 3px rgba(243,156,18,0.18);
    }
    .filter-search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.6;
        pointer-events: none;
    }

    .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: flex-start;
    }
    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .filter-group-label {
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9aa5bd;
        font-weight: 700;
    }
    .filter-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 480px;
    }
    .chip {
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #dfe7f7;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        white-space: nowrap;
    }
    .chip:hover { transform: translateY(-1px); border-color: rgba(247,215,116,0.5); }
    .chip.active {
        background: linear-gradient(135deg, rgba(243,156,18,0.9), rgba(192,57,43,0.6));
        border-color: var(--gold-strong);
        color: #1a1408;
        box-shadow: 0 0 14px rgba(243,156,18,0.4);
    }
    .chip.attr-luce.active { background: linear-gradient(135deg, #fff6dc, #f7d774); color: #4a3a0a; }
    .chip.attr-oscurità.active { background: linear-gradient(135deg, #6c4a9c, #3d2560); color: #f0e6ff; }
    .chip.attr-terra.active { background: linear-gradient(135deg, #a97b3e, #6b4a1f); color: #fff3df; }
    .chip.attr-vento.active { background: linear-gradient(135deg, #52c9a4, #1f8f72); color: #06251c; }
    .chip.attr-acqua.active { background: linear-gradient(135deg, #4fa8e0, #1b6fb8); color: #06202f; }
    .chip.attr-fuoco.active { background: linear-gradient(135deg, #f0793c, #c0392b); color: #2c0800; }
    .chip.attr-divino.active { background: linear-gradient(135deg, #fff6c8, #f7d774, #f39c12); color: #402b00; }

    .filter-range {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .filter-range input {
        width: 74px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-family: inherit;
        font-size: 0.85rem;
        outline: none;
    }
    .filter-range input:focus { border-color: var(--gold-strong); }
    .filter-range span { color: #9aa5bd; font-size: 0.8rem; }

    .filter-reset {
        align-self: flex-start;
        margin-left: auto;
        border: 1px solid rgba(231,76,60,0.4);
        background: rgba(231,76,60,0.12);
        color: #ffb3ab;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        white-space: nowrap;
    }
    .filter-reset:hover { transform: translateY(-1px); box-shadow: 0 0 14px rgba(231,76,60,0.3); }

    /* ============================================================
       Griglia carte
       ============================================================ */
    .cartoteca-main {
        position: relative;
        z-index: 1;
        padding: 26px 22px 60px;
        max-width: 1500px;
        margin: 0 auto;
    }
    .cartoteca-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
        gap: 22px;
        justify-items: center;
    }
    /* Paginazione (300 carte per pagina, richiesta esplicita dell'utente):
       una barra identica sopra e sotto la griglia, così con una pagina
       piena non serve risalire in cima per cambiare pagina. */
    .cartoteca-pager {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 20px;
    }
    .cartoteca-pager.bottom { margin: 26px 0 0; }
    .cartoteca-pager[hidden] { display: none; }
    .pager-btn {
        border: 1px solid rgba(247,215,116,0.35);
        background: rgba(255,255,255,0.06);
        color: #f7d774;
        border-radius: 999px;
        padding: 8px 14px;
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease;
    }
    .pager-btn:hover:not(:disabled) { background: rgba(247,215,116,0.16); transform: translateY(-1px); }
    .pager-btn:active:not(:disabled) { transform: translateY(0); background: rgba(247,215,116,0.28); }
    .pager-btn:disabled { opacity: 0.32; cursor: not-allowed; }
    .pager-btn .pager-ico { font-size: 1rem; line-height: 1; }
    .pager-btn .pager-lbl { margin: 0 4px; }
    .pager-status {
        text-align: center;
        font-size: 0.82rem;
        font-weight: 800;
        color: #cdd6ea;
        min-width: 150px;
    }
    .pager-status .range {
        display: block;
        font-size: 0.68rem;
        font-weight: 600;
        color: #9aa5bd;
        margin-top: 2px;
    }
    /* js/card.css mette touch-action:none su .card per il trascinamento
       nel duello (duelMonstersCore.html) — qui le carte non si trascinano mai,
       e quella regola bloccava anche lo scroll verticale col dito quando
       il tocco iniziava sopra una carta. */
    .cartoteca-grid .card {
        touch-action: pan-y;
    }
    /* Badge "effetto implementato parzialmente" (richiesta esplicita
       dell'utente, per uso di sviluppo — non è un badge da titolo di
       gioco pubblicato): basato SOLO su card.missingEffectNote, l'unico
       segnale davvero affidabile al 100% in questo dataset. Un tentativo
       di rilevare anche le carte "senza alcun effetto implementato"
       (nessuna CardEffects.register per quell'id) è stato scartato dopo
       una verifica: le ~10 carte così segnalate avevano tutte in realtà
       un effetto reale, gestito con un controllo diretto sull'id sparso
       in duel-engine.js/actions.js/cards-db.js invece che nel registro
       CardEffects (es. Versago il Distruttore id 500, Kiseitai id 328,
       le carte "conta come 2 Tributi") — un badge "non implementato"
       basato su quel segnale sarebbe stato costantemente sbagliato. */
    .partial-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        font-size: clamp(11px, 15cqw, 20px);
        line-height: 1;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.65));
        z-index: 5;
    }
    .cartoteca-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: #9aa5bd;
        font-size: 1.05rem;
    }

    /* L'aspetto della carta (.card/.card-frame/...) vive in js/card.css,
       condiviso da tutte le pagine — qui restano solo dimensione/hover
       specifici di questa griglia. */
    .card:hover { transform: translateY(-8px) scale(1.045); box-shadow: 0 16px 34px rgba(0,0,0,0.4); }

    /* ============================================================
       La scheda di dettaglio carta è quella condivisa da tutto il gioco:
       js/ui/card-detail.js + js/ui/card-detail.css (CardDetail.open).
       ============================================================ */

    /* ============================================================
       Telefono: la topbar/filtri restavano dimensionati per desktop
       (padding 14px 22px, icona 40px, carte minime 168px) — su uno
       schermo stretto (~360px) questo lascia spazio per UNA sola carta
       gigante per riga invece di una griglia vera. Qui si restringe
       tutto e si aggiorna di conseguenza l'offset "top" della barra
       filtri (che deve restare appena sotto la topbar, mai sovrapposta
       né staccata).
       ============================================================ */
    @media (max-width: 480px) {
        /* Paginazione a misura di dito: solo frecce (il testo sparisce),
           pulsanti da 44px — lo standard per un'area di tocco comoda — e
           la riga di stato spostata sopra, su una riga tutta sua. */
        .cartoteca-pager { gap: 6px; }
        .pager-btn .pager-lbl { display: none; }
        .pager-btn { min-width: 44px; min-height: 44px; padding: 6px 10px; }
        .pager-status { flex: 1 0 100%; order: -1; min-width: 0; }
        .cartoteca-count { font-size: 0.62rem; padding: 3px 8px; }
        .cartoteca-filters { top: 45px; padding: 8px 10px; }
        .filter-sort, .filter-toggle-btn { padding: 7px 10px; font-size: 0.72rem; }
        .filter-search input { padding: 8px 12px 8px 34px; font-size: 0.82rem; }
        .cartoteca-main { padding: 12px 8px 40px; }
        .cartoteca-grid { gap: 8px; }
    }

    /* Telefono ruotato in orizzontale: poca altezza (spesso <500px) ma
       larghezza sopra i 480px, quindi la query sopra non scatta e senza
       questa la pagina resta dimensionata per desktop — topbar/filtri
       enormi rispetto alla poca altezza disponibile. */
    @media (max-height: 500px) and (orientation: landscape) {
        .cartoteca-count { font-size: 0.65rem; padding: 3px 9px; }
        .cartoteca-filters { top: 41px; padding: 6px 14px; }
        .filter-bar-top { gap: 6px; }
        .filter-sort, .filter-toggle-btn { padding: 5px 10px; font-size: 0.7rem; }
        .filter-search input { padding: 6px 12px 6px 32px; font-size: 0.78rem; }
        .cartoteca-main { padding: 8px 14px 30px; }
        .cartoteca-grid { gap: 8px; }
    }
</style>
</head>
<!-- data-card-badges accende su questa pagina i bollini "copie massime"
     e "copie possedute" e il bianco e nero sulle carte non possedute
     (vedi js/ui/card.css): fuori da qui resterebbero informazioni fuori
     posto, in duello soprattutto. -->
<body data-card-badges>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <div class="cartoteca-filters">
        <div class="filter-bar-top">
            <div class="filter-search">
                <span class="filter-search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Cerca una carta per nome..." autocomplete="off">
            </div>
            <select class="filter-sort" id="sortSelect">
                <option value="default">Catalogo originale</option>
                <option value="name-asc">Nome (A→Z)</option>
                <option value="name-desc">Nome (Z→A)</option>
                <option value="atk-desc">ATK (alto→basso)</option>
                <option value="atk-asc">ATK (basso→alto)</option>
                <option value="def-desc">DEF (alto→basso)</option>
                <option value="def-asc">DEF (basso→alto)</option>
                <option value="level-desc">Livello (alto→basso)</option>
                <option value="level-asc">Livello (basso→alto)</option>
            </select>
            <button type="button" class="filter-toggle-btn" id="filterToggleBtn">
                <span>🔧 Filtri</span>
                <span class="filter-toggle-badge" id="filterToggleBadge"></span>
                <span class="filter-toggle-arrow">▾</span>
            </button>
        </div>

        <div class="filter-panel" id="filterPanel">
            <div class="filter-row">
                <div class="filter-group">
                    <span class="filter-group-label">Tipo Carta</span>
                    <div class="filter-chips" id="typeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Livello</span>
                    <div class="filter-chips" id="levelChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Categoria Mostro</span>
                    <div class="filter-chips" id="categoryChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Tipo Mostro</span>
                    <div class="filter-chips" id="raceChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Attributo</span>
                    <div class="filter-chips" id="attributeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Sottotipo Magia</span>
                    <div class="filter-chips" id="spellSubtypeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Sottotipo Trappola</span>
                    <div class="filter-chips" id="trapSubtypeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Provenienza</span>
                    <div class="filter-chips" id="originChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">ATK</span>
                    <div class="filter-range">
                        <input type="number" id="atkMin" placeholder="Min" min="0">
                        <span>—</span>
                        <input type="number" id="atkMax" placeholder="Max" min="0">
                    </div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">DEF</span>
                    <div class="filter-range">
                        <input type="number" id="defMin" placeholder="Min" min="0">
                        <span>—</span>
                        <input type="number" id="defMax" placeholder="Max" min="0">
                    </div>
                </div>
                <button class="filter-reset" id="resetBtn">✖ Azzera filtri</button>
            </div>
        </div>
    </div>

    <main class="cartoteca-main">
        <div class="cartoteca-pager top" id="pagerTop" hidden></div>
        <div class="cartoteca-grid" id="cartotecaGrid"></div>
        <div class="cartoteca-pager bottom" id="pagerBottom" hidden></div>
    </main>

<script src="js/audio/audio-manager.js"></script>

     (SaveManager.getOwnedCount, vedi js/ui/card-renderer.js). -->

<!-- Anagrafica carte generata da data/cards.json (vedi scripts/build-cards-data.js):
     va caricata PRIMA di cards-db.js, che ora contiene solo le funzioni di supporto. -->

<script src="js/ui/card-detail.js"></script>

<script src="js/ui/topbar.js"></script>
<script>
    // Badge "N carte" (aggiornato da renderGrid() più sotto): l'unico
    // contenuto extra nella topbar di questa pagina, oltre a
    // Indietro/titolo standard.
    const topbarEl = PageTopbar.render('#topbarMount', { icon: 'collection', title: 'Cartoteca' });
    if (topbarEl) {
        // PageTopbar.render() sostituisce interamente #topbarMount con
        // questo elemento (mount.replaceWith(topbar) in topbar.js) — un
        // selettore CSS "#topbarMount .topbar-title" non troverebbe mai
        // nulla dopo il render, perché quell'id non esiste più nel DOM.
        // Un id dedicato qui è l'aggancio giusto per l'override di
        // colore solo-Cartoteca definito più sopra in questa pagina.
        topbarEl.id = 'cartotecaTopbar';
        const countBadge = document.createElement('div');
        countBadge.className = 'cartoteca-count';
        countBadge.id = 'resultCount';
        countBadge.textContent = '40 carte';
        topbarEl.appendChild(countBadge);
    }

    initAudioManager();
    Icons.hydrate();

    const state = {
        text: '',
        types: new Set(),
        levels: new Set(),
        categories: new Set(),
        races: new Set(),
        attributes: new Set(),
        spellSubtypes: new Set(),
        trapSubtypes: new Set(),
        origins: new Set(),
        atkMin: null,
        atkMax: null,
        defMin: null,
        defMax: null,
        sort: 'default',
        page: 1
    };

    // Paginazione lato client (richiesta esplicita dell'utente): con oltre
    // 1000 carte nel database, creare TUTTE le tile in un colpo solo rende
    // pesante ogni singolo cambio di filtro, perché renderGrid() ricostruisce
    // la griglia da zero ogni volta.
    const CARDS_PER_PAGE = 300;

    const TYPE_LABELS = { monster: 'Mostro', spell: 'Magia', trap: 'Trappola' };
    const TYPE_ICON = { monster: '👑', spell: '✨', trap: '🌀' };

    function normalize(str) {
        return (str || '').toString().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function uniqueSorted(arr) {
        return [...new Set(arr)].sort((a, b) => a - b);
    }

    function buildChipGroup(container, values, formatLabel, stateSet, extraClassFn) {
        container.innerHTML = '';
        values.forEach((val) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip' + (extraClassFn ? ' ' + extraClassFn(val) : '');
            chip.textContent = formatLabel(val);
            chip.dataset.value = val;
            chip.onclick = () => {
                if (stateSet.has(val)) {
                    stateSet.delete(val);
                    chip.classList.remove('active');
                } else {
                    stateSet.add(val);
                    chip.classList.add('active');
                }
                renderGrid();
            };
            container.appendChild(chip);
        });
    }

    function initFilters() {
        // Tipo carta
        buildChipGroup(
            document.getElementById('typeChips'),
            ['monster', 'spell', 'trap'],
            (v) => TYPE_ICON[v] + ' ' + TYPE_LABELS[v],
            state.types
        );

        // Livello (solo mostri)
        const levels = uniqueSorted(cardDatabase.filter(c => c.type === 'monster').map(c => c.level));
        buildChipGroup(
            document.getElementById('levelChips'),
            levels,
            (v) => `⭐ ${v}`,
            state.levels
        );

        // Categoria mostro (normale / con effetto / fusione / rituale)
        buildChipGroup(
            document.getElementById('categoryChips'),
            ['normal', 'effect', 'fusion', 'ritual'],
            (v) => MONSTER_CATEGORY_LABELS[v],
            state.categories
        );

        // Tipo mostro (razza) — base FISSA (getAllKnownRaces, in
        // cards-db.js: i Tipi ufficiali del gioco PIÙ quelli di serie
        // delle provenienze distribuite col gioco, es. Fanteria/Alpini/
        // Aviazione del set WW1, mostrati anche se ancora senza carte)
        // UNITA a qualunque Tipo Mostro CUSTOM realmente usato da una
        // carta caricata (crea-carta.html permette di crearne di nuovi
        // per provenienze diverse da Yu-Gi-Oh!) — stesso spirito del
        // filtro Attributo qui sotto, che deriva le proprie opzioni da
        // cardDatabase.
        const knownRaces = (typeof getAllKnownRaces === 'function') ? getAllKnownRaces() : MONSTER_RACES;
        const customRaces = [...new Set(cardDatabase.map((c) => c.race).filter((r) => r && !knownRaces.includes(r)))];
        buildChipGroup(
            document.getElementById('raceChips'),
            knownRaces.concat(customRaces),
            (v) => v,
            state.races
        );

        // Attributo
        const attributes = [...new Set(cardDatabase.filter(c => c.attribute).map(c => c.attribute))];
        const attrOrder = ['LUCE', 'OSCURITÀ', 'TERRA', 'ACQUA', 'FUOCO', 'VENTO', 'DIVINO'];
        attributes.sort((a, b) => attrOrder.indexOf(a) - attrOrder.indexOf(b));
        buildChipGroup(
            document.getElementById('attributeChips'),
            attributes,
            (v) => v,
            state.attributes,
            (v) => 'attr-' + normalize(v)
        );

        // Sottotipo Magia (Normale/Continua/Veloce/Rituale/Campo/Equip) — elenco
        // fisso da SPELL_SUBTYPE_LABELS, stesso spirito di MONSTER_RACES sopra.
        buildChipGroup(
            document.getElementById('spellSubtypeChips'),
            Object.keys(SPELL_SUBTYPE_LABELS),
            (v) => SPELL_SUBTYPE_LABELS[v],
            state.spellSubtypes
        );

        // Sottotipo Trappola (Normale/Continua/Contatore)
        buildChipGroup(
            document.getElementById('trapSubtypeChips'),
            Object.keys(TRAP_SUBTYPE_LABELS),
            (v) => TRAP_SUBTYPE_LABELS[v],
            state.trapSubtypes
        );

        // Provenienza — base FISSA da CARD_ORIGIN_LABELS (in cards-db.js,
        // mostra sempre Yu-Gi-Oh!/Fanmade/WW1/WW2 anche senza ancora
        // nessuna carta) UNITA a qualunque provenienza CUSTOM realmente
        // usata da una carta caricata — stesso spirito del Tipo Mostro
        // qui sopra.
        const customOrigins = [...new Set(cardDatabase.map((c) => c.origin).filter((o) => o && !CARD_ORIGIN_LABELS[o]))];
        // Un'origine custom mostra la propria etichetta leggibile (quella
        // scelta in crea-carta.html, es. "Prima Guerra Mondiale") invece
        // della sola key interna (es. "prima-guerra-mondiale") — recuperata
        // da CustomTaxonomy, che la ricorda per intero, non solo la key.
        const customOriginLabels = {};
        CustomTaxonomy.listOrigins().forEach((o) => { customOriginLabels[o.key] = o.label; });
        buildChipGroup(
            document.getElementById('originChips'),
            Object.keys(CARD_ORIGIN_LABELS).concat(customOrigins),
            (v) => CARD_ORIGIN_LABELS[v] || customOriginLabels[v] || v,
            state.origins
        );

        // Debounce (250ms): con oltre 900 carte nel database, renderGrid()
        // ricostruisce l'intera griglia da zero ad ogni chiamata (innerHTML
        // svuotato + una createCardElement per ogni carta ancora
        // corrispondente ai filtri) — senza debounce, digitare una parola
        // di 6 lettere significava 6 ricostruzioni complete della griglia,
        // una per tasto premuto, invece di una sola a digitazione ferma.
        let searchDebounceTimer = null;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const value = e.target.value;
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                state.text = normalize(value);
                renderGrid();
            }, 250);
        });
        ['atkMin', 'atkMax', 'defMin', 'defMax'].forEach((id) => {
            document.getElementById(id).addEventListener('input', (e) => {
                const val = e.target.value === '' ? null : Number(e.target.value);
                state[id] = val;
                renderGrid();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            state.sort = e.target.value;
            renderGrid();
        });

        // Pannello filtri: chiuso di default ("meno invasivo" di prima, quando
        // erano sempre tutti aperti) — un tocco/click sul pulsante lo apre o
        // chiude, con un badge che segna quanti filtri sono già attivi anche
        // a pannello chiuso.
        const filterToggleBtn = document.getElementById('filterToggleBtn');
        const filterPanel = document.getElementById('filterPanel');
        filterToggleBtn.onclick = () => {
            const isOpen = filterPanel.classList.toggle('open');
            filterToggleBtn.classList.toggle('open', isOpen);
        };

        document.getElementById('resetBtn').onclick = () => {
            state.text = '';
            state.types.clear();
            state.levels.clear();
            state.categories.clear();
            state.races.clear();
            state.attributes.clear();
            state.spellSubtypes.clear();
            state.trapSubtypes.clear();
            state.origins.clear();
            state.atkMin = null;
            state.atkMax = null;
            state.defMin = null;
            state.defMax = null;
            document.getElementById('searchInput').value = '';
            ['atkMin', 'atkMax', 'defMin', 'defMax'].forEach(id => document.getElementById(id).value = '');
            document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
            renderGrid();
        };
    }

    function cardMatchesFilters(card) {
        if (state.text) {
            const haystack = normalize(card.name) + ' ' + normalize(card.effect || '');
            if (!haystack.includes(state.text)) return false;
        }
        if (state.types.size > 0 && !state.types.has(card.type)) return false;
        if (state.levels.size > 0 && !(card.type === 'monster' && state.levels.has(card.level))) return false;
        if (state.categories.size > 0 && !(card.type === 'monster' && state.categories.has(getMonsterFilterCategory(card)))) return false;
        if (state.races.size > 0 && !(card.race && state.races.has(card.race))) return false;
        if (state.attributes.size > 0 && !(card.attribute && state.attributes.has(card.attribute))) return false;
        if (state.spellSubtypes.size > 0 && !(card.type === 'spell' && state.spellSubtypes.has(card.subtype))) return false;
        if (state.trapSubtypes.size > 0 && !(card.type === 'trap' && state.trapSubtypes.has(card.subtype))) return false;
        if (state.origins.size > 0 && !(card.origin && state.origins.has(card.origin))) return false;
        if (state.atkMin !== null && !(card.type === 'monster' && card.attack >= state.atkMin)) return false;
        if (state.atkMax !== null && !(card.type === 'monster' && card.attack <= state.atkMax)) return false;
        if (state.defMin !== null && !(card.type === 'monster' && card.defense >= state.defMin)) return false;
        if (state.defMax !== null && !(card.type === 'monster' && card.defense <= state.defMax)) return false;
        return true;
    }

    const nameCollator = new Intl.Collator('it');
    /** Ordina una lista di carte già filtrata secondo state.sort, senza toccare l'originale. */
    function sortCards(cards, sortKey) {
        const sorted = [...cards];
        const byName = (a, b) => nameCollator.compare(a.name, b.name);
        const numKey = (card, field) => (typeof card[field] === 'number' ? card[field] : -1);
        const byCatalog = (a, b) => {
            const gruppoA = a.origin === 'ww1' ? 1 : 0;
            const gruppoB = b.origin === 'ww1' ? 1 : 0;
            return gruppoA - gruppoB || numKey(a, 'id') - numKey(b, 'id') || byName(a, b);
        };
        if (!sortKey || sortKey === 'default') return sorted.sort(byCatalog);
        const cmp = {
            'name-asc': byName,
            'name-desc': (a, b) => byName(b, a),
            'atk-desc': (a, b) => numKey(b, 'attack') - numKey(a, 'attack') || byName(a, b),
            'atk-asc': (a, b) => numKey(a, 'attack') - numKey(b, 'attack') || byName(a, b),
            'def-desc': (a, b) => numKey(b, 'defense') - numKey(a, 'defense') || byName(a, b),
            'def-asc': (a, b) => numKey(a, 'defense') - numKey(b, 'defense') || byName(a, b),
            'level-desc': (a, b) => numKey(b, 'level') - numKey(a, 'level') || byName(a, b),
            'level-asc': (a, b) => numKey(a, 'level') - numKey(b, 'level') || byName(a, b)
        }[sortKey];
        if (cmp) sorted.sort(cmp);
        return sorted;
    }

    /** Numero di filtri attivi in questo momento, per il badge sul pulsante "Filtri". */
    function countActiveFilters() {
        return state.types.size + state.levels.size + state.categories.size + state.races.size +
            state.attributes.size + state.spellSubtypes.size + state.trapSubtypes.size + state.origins.size +
            (state.atkMin !== null ? 1 : 0) + (state.atkMax !== null ? 1 : 0) +
            (state.defMin !== null ? 1 : 0) + (state.defMax !== null ? 1 : 0);
    }

    function updateFilterToggleBadge() {
        const count = countActiveFilters();
        const badge = document.getElementById('filterToggleBadge');
        const btn = document.getElementById('filterToggleBtn');
        badge.textContent = count;
        badge.classList.toggle('show', count > 0);
        btn.classList.toggle('has-active', count > 0);
    }

    function createCardTile(card) {
        const el = createCardElement(card);
        el.onclick = () => openCardModal(card);
        // Riflesso per rarità e inclinazione sotto il mouse (js/ui/card-renderer.js).
        if (window.CartaViva) CartaViva.rendi(el, card, { modo: 'griglia' });
        if (card.missingEffectNote) {
            const badge = document.createElement('div');
            badge.className = 'partial-badge';
            badge.textContent = '🟡';
            badge.title = 'Effetto implementato parzialmente: ' + card.missingEffectNote;
            el.appendChild(badge);
        }
        return el;
    }

    /**
     * Disegna una delle due barre di paginazione. `totalPages` a 1 (o 0
     * risultati) la nasconde del tutto: senza abbastanza carte da
     * impaginare, una barra con tutti i pulsanti spenti sarebbe solo
     * rumore.
     */
    function renderPager(el, totalPages, total, firstIndex, shown) {
        if (totalPages <= 1) { el.hidden = true; el.innerHTML = ''; return; }
        el.hidden = false;
        // Etichette in uno <span> separato dalla freccia: su mobile viene
        // nascosto solo il testo (vedi il @media più sotto), lasciando
        // pulsanti quadrati grandi abbastanza per il dito invece di
        // quattro pillole lunghe che andrebbero a capo.
        el.innerHTML = `
            <button type="button" class="pager-btn" data-page="first" ${state.page === 1 ? 'disabled' : ''}><span class="pager-ico">«</span><span class="pager-lbl">Prima</span></button>
            <button type="button" class="pager-btn" data-page="prev" ${state.page === 1 ? 'disabled' : ''}><span class="pager-ico">‹</span><span class="pager-lbl">Precedente</span></button>
            <div class="pager-status">
                Pagina ${state.page} di ${totalPages}
                <span class="range">carte ${firstIndex + 1}-${firstIndex + shown} di ${total}</span>
            </div>
            <button type="button" class="pager-btn" data-page="next" ${state.page === totalPages ? 'disabled' : ''}><span class="pager-lbl">Successiva</span><span class="pager-ico">›</span></button>
            <button type="button" class="pager-btn" data-page="last" ${state.page === totalPages ? 'disabled' : ''}><span class="pager-lbl">Ultima</span><span class="pager-ico">»</span></button>
        `;
        el.querySelectorAll('.pager-btn').forEach((btn) => {
            btn.onclick = () => {
                const to = btn.dataset.page;
                if (to === 'first') state.page = 1;
                else if (to === 'prev') state.page = Math.max(1, state.page - 1);
                else if (to === 'next') state.page = Math.min(totalPages, state.page + 1);
                else if (to === 'last') state.page = totalPages;
                // true = NON tornare a pagina 1: è proprio un cambio pagina
                // voluto, a differenza di ogni altro chiamante (i filtri).
                renderGrid(true);
                document.querySelector('.cartoteca-main').scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
        });
    }

    /**
     * `keepPage` true SOLO dai pulsanti di paginazione: ogni altra
     * chiamata (filtri, ricerca, ordinamento, azzera) riporta a pagina 1,
     * che è il comportamento giusto — restare a "pagina 7" dopo aver
     * ristretto i risultati a 30 carte mostrerebbe una griglia vuota.
     */
    function renderGrid(keepPage) {
        const grid = document.getElementById('cartotecaGrid');
        const results = sortCards(cardDatabase.filter(cardMatchesFilters), state.sort);
        updateFilterToggleBadge();
        if (!keepPage) state.page = 1;
        const totalPages = Math.max(1, Math.ceil(results.length / CARDS_PER_PAGE));
        if (state.page > totalPages) state.page = totalPages;
        const firstIndex = (state.page - 1) * CARDS_PER_PAGE;
        const pageCards = results.slice(firstIndex, firstIndex + CARDS_PER_PAGE);

        grid.innerHTML = '';
        if (results.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cartoteca-empty';
            empty.textContent = '🔍 Nessuna carta corrisponde ai filtri selezionati.';
            grid.appendChild(empty);
        } else {
            pageCards.forEach(card => grid.appendChild(createCardTile(card)));
        }
        renderPager(document.getElementById('pagerTop'), totalPages, results.length, firstIndex, pageCards.length);
        renderPager(document.getElementById('pagerBottom'), totalPages, results.length, firstIndex, pageCards.length);
        document.getElementById('resultCount').textContent = `${results.length} cart${results.length === 1 ? 'a' : 'e'}`;
    }

    // La scheda della carta è quella condivisa da tutto il gioco
    // (js/ui/card-detail.js): tag, ATK/DEF, effetto, "Come si ottiene",
    // avviso di effetto parziale, Esc e click fuori per chiudere.
    function openCardModal(card) {
        CardDetail.open(card);
    }

    initFilters();
    renderGrid();
</script>
