<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->
<style>@view-transition { navigation: auto; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Colore di sfondo applicato SUBITO, prima ancora che gli script
     bloccanti sotto (auth-gate/supabase) finiscano di scaricare: senza
     questo la pagina resta bianca/scoperta per l'intera durata del
     download, poi scatta di colpo al nero dell'overlay di auth-gate —
     un flash segnalato dall'utente. Stesso colore esatto dell'overlay
     di auth-gate.js e dello sfondo di page-loader.css, così la
     transizione è invisibile invece che un salto di tonalità. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Millennium">
<script src="js/ui/error-recovery.js"></script>
<!-- Accesso obbligatorio (js/cloud/auth-gate.js) — vedi il commento lì:
     rimanda a index.html se non c'è una sessione approvata. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/cloud/supabase-config.js"></script>
<script src="js/cloud/cloud-sync.js"></script>
<script src="js/cloud/auto-sync.js"></script>
<script src="js/cloud/auth-gate.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="stylesheet" href="js/ui/page-loader.css">
<link rel="preload" href="audio/soundtracks/56. Battle for the Millennium.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<!-- Ritratto del giocatore in fondo alla topbar: lo monta PageTopbar. -->
<link rel="stylesheet" href="js/ui/deck-switcher.css">
<title>Yu-Gi-Oh! Millennium Duel Arena — Cartoteca</title>
<link rel="stylesheet" href="js/ui/card.css">
<link rel="stylesheet" href="js/ui/card-detail.css">
<link rel="stylesheet" href="js/ui/fluido.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco, ne' rettangolo azzurrino al tocco, ne' rimbalzo
       elastico (a un dito dal ricaricare tutto). input/textarea/select restano selezionabili: lo scope della Cartoteca
       (js/ui/cartoteca-view.css) lo riattiva per i suoi campi. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    html, body { height: 100%; }
    body { font-family: 'Arial', sans-serif; color: #fff; background: #0b0d14; min-height: 100vh; }
    /* Fondale sullo strato FISSO insieme alla sfumatura, non sul background di body (con la toppa anti-flash `html, body
       { background }` il background di body resterebbe alto un solo viewport e scorrendo comparirebbe una fascia nera). */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            linear-gradient(180deg, rgba(6,7,12,0.45) 0%, rgba(6,7,12,0.55) 60%, rgba(4,5,8,0.65) 100%),
            url('images/background/backgroundMenu.jpg') center/cover no-repeat;
        pointer-events: none;
    }
    /* La Cartoteca vera (filtri, griglia, paginazione) sta in js/ui/cartoteca-view.css. */
</style>
<link rel="stylesheet" href="js/ui/cartoteca-view.css">
</head>
<!-- data-card-badges accende su questa pagina i bollini "copie massime"
     e "copie possedute" e il bianco e nero sulle carte non possedute
     (vedi js/ui/card.css): fuori da qui resterebbero informazioni fuori
     posto, in duello soprattutto. -->
<body data-card-badges>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <div id="cartoteca-root"></div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<!-- save-manager.js serve per il bollino "copie possedute" su ogni carta
     (SaveManager.getOwnedCount, vedi js/ui/card-renderer.js). -->
<script src="js/save-manager.js"></script>
<!-- Anagrafica carte generata da data/cards.json (vedi scripts/build-cards-data.js):
     va caricata PRIMA di cards-db.js, che ora contiene solo le funzioni di supporto. -->
<script src="js/data/cards-data.generated.js"></script>
<!-- Niente motore del duello qui: il filtro "Categoria Mostro" legge l'elenco generato delle carte con effetto (scripts/build-card-effect-ids.js) invece di caricare circa 586KB di script. -->
<script src="js/data/card-effect-ids.generated.js"></script>
<script src="js/data/cards-db.js"></script>
<script src="js/data/card-rarity.js"></script>
<script src="js/economy/card-acquisition.js"></script>
<script src="js/data/custom-cards.js"></script>
<script src="js/data/custom-taxonomy.js"></script>
<script src="js/ui/fluido.js"></script>
<script src="js/ui/inclinazione.js"></script>
<script src="js/ui/card-renderer.js"></script>
<!-- La scheda di dettaglio carta è quella condivisa da tutto il gioco. -->
<script src="js/ui/card-detail.js"></script>
<script src="js/ui/cartoteca-view.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script src="js/ui/topbar.js"></script>
<script>
    // Badge "N carte" (aggiornato da renderGrid() più sotto): l'unico
    // contenuto extra nella topbar di questa pagina, oltre a
    // Indietro/titolo standard.
    const topbarEl = PageTopbar.render('#topbarMount', { icon: 'collection', title: 'Cartoteca' });
    if (topbarEl) {
        // PageTopbar.render() sostituisce interamente #topbarMount con
        // questo elemento (mount.replaceWith(topbar) in topbar.js) — un
        // selettore CSS "#topbarMount .topbar-title" non troverebbe mai
        // nulla dopo il render, perché quell'id non esiste più nel DOM.
        // Un id dedicato qui è l'aggancio giusto per l'override di
        // colore solo-Cartoteca definito più sopra in questa pagina.
        topbarEl.id = 'cartotecaTopbar';
        const countBadge = document.createElement('div');
        countBadge.className = 'cartoteca-count';
        countBadge.id = 'resultCount';
        countBadge.textContent = '40 carte';
        topbarEl.appendChild(countBadge);
    }

    initAudioManager();
    Icons.hydrate();

    // La Cartoteca vera e' js/ui/cartoteca-view.js (la stessa della vista del menu): qui solo la cornice della pagina.
    const conteggio = document.getElementById('resultCount');
    CartotecaView.mount(document.getElementById('cartoteca-root'), {
        onConteggio: (testo) => { if (conteggio) conteggio.textContent = testo; }
    });
</script>
</body>
</html>
